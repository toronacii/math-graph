multi_source_disambiguation_notes:
  - id: theorem.extreme-value-theorem
    note: >
      Rudin Theorem 4.16 ("continuous image of a compact set is
      compact") strictly subsumes Stewart's EVT. In a future Rudin
      merge: separate nodes; Stewart's EVT becomes a corollary via
      Heine-Borel.

  - id: theorem.mean-value-theorem
    note: >
      Rudin Theorem 5.10 (Cauchy MVT — generalized form for two
      functions) strictly subsumes Stewart's MVT. In a future Rudin
      merge: separate nodes; Stewart's MVT specializes to g(x) = x.

  - id: definition.newton-iteration
    note: >
      Rudin Theorem 5.18 gives a quadratic-convergence theorem on a
      neighborhood of a simple root with f'' continuous — different
      mathematical content from Stewart's pure iteration scheme;
      separate node in any future merge.

  - id: definition.antiderivative
    note: >
      Rudin / standard analysis uses the term "primitive". Same
      mathematical content (F'(x) = f(x) on an interval). Future
      merge: same node, with "primitive" as title alias.
