    section: "4.1"
    reason: >
      Stewart §4.1 states EVT without proof and explicitly defers
      the proof to Apéndice F. The full proof requires sequential
      compactness on closed bounded intervals, machinery developed
      in real analysis courses (Rudin Theorem 4.16). For this rerun
      EVT is treated as axiom-like within Ch4.
    target_chapter: Apéndice F (also Rudin Ch4 in any future merge)

  - statement: proposition.concavity-test
    section: "4.3"
    reason: >
      Stewart §4.3 derives the concavity test geometrically (tangent
      lines lying below the curve) without a rigorous argument. A
      formal proof requires either MVT applied twice or the second-
      order Taylor remainder. Stewart defers to Apéndice F.
    target_chapter: Apéndice F (or §11.10 Taylor)

  - statement: theorem.l-hospital-rule
    section: "4.4"
    reason: >
      Stewart §4.4 gives only an informal motivation for the
      simplest case (0/0 with f(a) = g(a) = 0 and f', g' continuous,
      g'(a) ≠ 0) and defers the general proof. The full statement —
      covering both 0/0 and ∞/∞ on one-sided, two-sided, finite and
      infinite limits — requires the Cauchy mean value theorem.
      Bundled into one node per Stewart's presentation; would be
      split if a multi-source Rudin merge happens.
    target_chapter: Apéndice F

