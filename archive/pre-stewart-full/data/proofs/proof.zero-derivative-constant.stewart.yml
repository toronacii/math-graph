id: proof.zero-derivative-constant.stewart
type: proof
status: draft

proves: corollary.zero-derivative-constant

uses:
  - theorem.mean-value-theorem

style: direct
sources:
  - work: Cálculo de una variable — Trascendentes tempranas
    author: James Stewart
    edition: "7"
    chapter: "4"
    section: "4.2"

confidence: high
notes: >
  For any x1 < x2 in (a,b), MVT gives f(x2) - f(x1) = f'(c)(x2-x1)
  for some c in (x1,x2). Since f'(c) = 0, f(x2) = f(x1).
