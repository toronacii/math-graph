id: proof.monotone-no-second-kind-discontinuity.rudin
type: proof

proves: corollary.monotone-no-second-kind-discontinuity

uses:
  - theorem.monotone-one-sided-limits

sources:
  - work: Principles of Mathematical Analysis
    author: Walter Rudin
    edition: "3"
    chapter: "4"
