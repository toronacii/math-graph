notes: >
  Let F be an antiderivative of f. Then by FTC Part 2:
  ∫_a^b f(g(x))g'(x)dx = F(g(x))|_a^b = F(g(b)) - F(g(a))
  = ∫_{g(a)}^{g(b)} f(u)du.
