notes: >
  Since f is continuous on [a, b], by the Extreme Value Theorem it
  attains its absolute minimum m and maximum M. By the integral
  comparison property, m(b-a) ≤ ∫_a^b f(x) dx ≤ M(b-a), so
  m ≤ (1/(b-a))∫_a^b f(x) dx ≤ M. Since f is continuous and
  f_avg lies between m and M, the Intermediate Value Theorem
  guarantees a number c in [a, b] with f(c) = f_avg.
