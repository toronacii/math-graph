confidence: high
notes: >
  Direct verification of all field axioms (A1)-(A5), (M1)-(M5),
  and (D) for ordered pairs with the defined operations. The
  multiplicative inverse of (a,b) ≠ (0,0) is (a/(a²+b²), -b/(a²+b²)).
