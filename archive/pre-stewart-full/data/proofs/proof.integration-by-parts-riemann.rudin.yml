notes: >
  Put H(x) = F(x)G(x). Then H' = F'G + FG' = fG + Fg. Since f, g in R
  and F, G continuous (hence bounded), fG and Fg are in R by Theorem 6.13.
  Apply Theorem 6.21 to H.
