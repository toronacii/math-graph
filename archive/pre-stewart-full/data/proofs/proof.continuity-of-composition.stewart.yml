style: epsilon-delta
sources:
  - work: Cálculo de una variable — Trascendentes tempranas
    author: James Stewart
    edition: "7"
    chapter: "2"
    section: "2.5"

confidence: medium
notes: >
  Given epsilon > 0, continuity of f at b gives delta_1 such that
  |y - b| < delta_1 implies |f(y) - f(b)| < epsilon. Since
  lim g(x) = b, there exists delta such that 0 < |x - a| < delta
  implies |g(x) - b| < delta_1. Combining gives the result.
