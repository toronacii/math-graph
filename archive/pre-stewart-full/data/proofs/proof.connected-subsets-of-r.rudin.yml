confidence: high
notes: >
  If z ∉ E with x < z < y (x,y ∈ E), split E = (E ∩ (-∞,z)) ∪ (E ∩ (z,∞)) — separated. Converse: if E not connected with A ∪ B = E, take x ∈ A, y ∈ B, z = sup(A ∩ [x,y]). By Theorem 2.28, z ∈ A̅, so z ∉ B, find z₁ ∉ E between z and y.
