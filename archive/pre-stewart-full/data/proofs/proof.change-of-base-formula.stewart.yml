sketch:
  es:
    text: >
      Sea y = logₐ(x). Por definición de logₐ, esto equivale a
      aʸ = x. Aplicando ln a ambos lados y usando la ley de la
      potencia (ln(aʸ) = y·ln(a)) se obtiene y·ln(a) = ln(x), es
      decir y = ln(x)/ln(a). Como y = logₐ(x), queda demostrada
      la fórmula.
