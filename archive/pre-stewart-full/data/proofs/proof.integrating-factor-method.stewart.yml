notes: >
  Let I(x) = e^{∫P(x)dx}. Then I'(x) = P(x)I(x) by the chain rule.
  Multiplying dy/dx + P(x)y = Q(x) by I(x):
  I(x)dy/dx + I(x)P(x)y = I(x)Q(x). The left side is d/dx[I(x)y]
  by the product rule. Integrating both sides using FTC gives
  I(x)y = ∫I(x)Q(x)dx, so y = (1/I(x))∫I(x)Q(x)dx.
