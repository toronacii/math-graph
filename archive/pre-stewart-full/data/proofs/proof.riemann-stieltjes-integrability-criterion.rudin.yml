confidence: high
notes: >
  Forward: U-L < epsilon implies upper and lower integrals differ by < epsilon,
  hence they are equal. Converse: if f in R(alpha), choose P_1, P_2 such that
  U(P_2) and L(P_1) are close to the integral, then common refinement works.
