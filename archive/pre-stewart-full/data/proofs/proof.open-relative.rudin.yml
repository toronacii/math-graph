confidence: high
notes: >
  If E open relative to Y: for each p ∈ E take Vp = ball in X with d(p,q) < rp, set G = ⋃Vp. Then G open in X and E = G ∩ Y. Converse: if E = G ∩ Y with G open, each p ∈ E has neighborhood in G, intersect with Y gives E.
