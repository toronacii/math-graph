id: theorem.arc-length-formula
type: theorem
status: draft

title:
  en: Arc Length Formula for Continuously Differentiable Curves

statement:
  natural:
    en: >
      If gamma' is continuous on [a, b], then gamma is rectifiable and
      Lambda(gamma) = integral_a^b |gamma'(t)| dt.
  latex: |
    \gamma' \in C[a,b]
    \implies
    \Lambda(\gamma) = \int_a^b |\gamma'(t)|\,dt

proved_by:
  - proof.arc-length-formula.rudin

sources:
  - work: Principles of Mathematical Analysis
    author: Walter Rudin
    edition: "3"
    chapter: "6"
    section: "6.27"

confidence: high
