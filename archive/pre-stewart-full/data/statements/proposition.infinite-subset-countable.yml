id: proposition.infinite-subset-countable
type: proposition
status: draft

title:
  en: Every Infinite Subset of a Countable Set is Countable

statement:
  natural:
    en: >
      Every infinite subset of a countable set A is countable.

proved_by:
  - proof.infinite-subset-countable.rudin

sources:
  - work: Principles of Mathematical Analysis
    author: Walter Rudin
    edition: "3"
    chapter: "2"
    section: "2.8"

confidence: high
notes: >
  Theorem 2.8 in Rudin. Establishes that countability is inherited by infinite subsets.
