id: theorem.derivative-arccos
type: theorem
status: draft

title:
  en: Derivative of arccosine
  es: Derivada del arcocoseno

statement:
  natural:
    es: >
      d/dx(cos⁻¹ x) = -1/√(1 - x²), para -1 < x < 1.
    en: >
      d/dx(cos⁻¹ x) = -1/√(1 - x²), for -1 < x < 1.
  latex: |
    \frac{d}{dx}\left(\cos^{-1} x\right) = -\frac{1}{\sqrt{1 - x^2}}

proved_by:
  - proof.derivative-arccos.stewart

sources:
  - work: Cálculo de una variable — Trascendentes tempranas
    author: James Stewart
    edition: "7"
    chapter: "3"
    section: "3.5"

confidence: high
notes: >
  Similar to arcsin: if y = cos⁻¹ x then cos y = x, so
  -sin y · dy/dx = 1, giving dy/dx = -1/sin y = -1/√(1 - x²).
