statement:
  natural:
    es:
      text: >
        Una función racional f es un cociente de dos polinomios, es decir,
        f(x) = P(x)/Q(x), donde P y Q son polinomios. El dominio consiste
        en todos los valores de x tales que Q(x) ≠ 0.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        A rational function f is a ratio of two polynomials, that is,
        f(x) = P(x)/Q(x), where P and Q are polynomials. The domain
        consists of all values of x such that Q(x) ≠ 0.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f(x) = \frac{P(x)}{Q(x)}, \qquad Q(x) \neq 0
    status: present
    review_status: unreviewed

