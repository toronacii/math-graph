statement:
  natural:
    es:
      text: >
        Si a y b son números positivos y x, y son números reales
        cualesquiera, entonces se cumplen las siguientes leyes:
        (1) aˣ⁺ʸ = aˣ·aʸ, (2) aˣ⁻ʸ = aˣ/aʸ, (3) (aˣ)ʸ = aˣʸ,
        (4) (a·b)ˣ = aˣ·bˣ.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If a and b are positive numbers and x, y are any real numbers,
        then the following laws hold: (1) aˣ⁺ʸ = aˣ·aʸ,
        (2) aˣ⁻ʸ = aˣ/aʸ, (3) (aˣ)ʸ = aˣʸ, (4) (a·b)ˣ = aˣ·bˣ.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      a^{x+y} = a^x a^y, \quad a^{x-y} = \frac{a^x}{a^y},
      \quad (a^x)^y = a^{xy}, \quad (ab)^x = a^x b^x
    status: present
    review_status: unreviewed

