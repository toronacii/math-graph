id: corollary.rationals-countable
type: corollary
status: draft

title:
  en: The Rational Numbers are Countable

statement:
  natural:
    en: >
      The set of all rational numbers is countable.

proved_by:
  - proof.rationals-countable.rudin

sources:
  - work: Principles of Mathematical Analysis
    author: Walter Rudin
    edition: "3"
    chapter: "2"
    section: "2.13"

confidence: high
notes: >
  Corollary to Theorem 2.13 in Rudin. Follows from the countability of integer pairs.
