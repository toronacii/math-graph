id: lemma.nested-k-cells
type: lemma
status: draft

title:
  en: Nested k-Cells Theorem

statement:
  natural:
    en: >
      If {Iₙ} is a sequence of k-cells with Iₙ ⊃ Iₙ₊₁, then ⋂Iₙ is nonempty.

proved_by:
  - proof.nested-k-cells.rudin

sources:
  - work: Principles of Mathematical Analysis
    author: Walter Rudin
    edition: "3"
    chapter: "2"
    section: "2.39"

confidence: high
notes: >
  Theorem 2.39 in Rudin. Generalizes the nested intervals theorem to k dimensions.
