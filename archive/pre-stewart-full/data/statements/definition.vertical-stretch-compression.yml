statement:
  natural:
    es:
      text: >
        Si c > 1, la gráfica de y = c·f(x) se obtiene estirando la
        gráfica de y = f(x) verticalmente por un factor de c. Si
        0 < c < 1, la gráfica se comprime verticalmente por un factor
        de c.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If c > 1, the graph of y = c·f(x) is obtained by stretching the
        graph of y = f(x) vertically by a factor of c. If 0 < c < 1,
        the graph is compressed vertically by a factor of c.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
