statement:
  natural:
    es:
      text: >
        El logaritmo natural es el logaritmo con base e, denotado ln.
        Es decir, ln(x) = logₑ(x). Equivalentemente, ln(x) = y si y
        sólo si eʸ = x.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The natural logarithm is the logarithm with base e, denoted
        ln. That is, ln(x) = logₑ(x). Equivalently, ln(x) = y if and
        only if eʸ = x.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
