id: theorem.heine-borel
type: theorem
status: draft

title:
  en: Heine-Borel Theorem

statement:
  natural:
    en: >
      A set E in Rk has one of the following properties iff it has all three: (a) E is closed and bounded, (b) E is compact, (c) every infinite subset of E has a limit point in E.

proved_by:
  - proof.heine-borel.rudin

sources:
  - work: Principles of Mathematical Analysis
    author: Walter Rudin
    edition: "3"
    chapter: "2"
    section: "2.41"

confidence: high
notes: >
  Theorem 2.41 in Rudin. The Heine-Borel theorem characterizing compact subsets of Euclidean space.
