id: theorem.integration-by-parts-definite
type: theorem
status: draft

title:
  en: Integration by Parts for Definite Integrals
  es: Integración por partes para integrales definidas

statement:
  natural:
    es: >
      Si f y g son diferenciables y sus derivadas son continuas en
      [a, b], entonces
      ∫_a^b f(x)g'(x) dx = [f(x)g(x)]_a^b - ∫_a^b g(x)f'(x) dx.
    en: >
      If f and g are differentiable and their derivatives are continuous
      on [a, b], then
      ∫_a^b f(x)g'(x) dx = [f(x)g(x)]_a^b - ∫_a^b g(x)f'(x) dx.
  latex: |
    \int_a^b f(x)\,g'(x)\,dx
    = \bigl[f(x)\,g(x)\bigr]_a^b - \int_a^b g(x)\,f'(x)\,dx

proved_by:
  - proof.integration-by-parts-definite.stewart

sources:
  - work: Cálculo de una variable — Trascendentes tempranas
    author: James Stewart
    edition: "7"
    chapter: "7"
    section: "7.1"

confidence: high
notes: >
  The definite integral version of integration by parts. Follows
  from applying FTC Part 2 to the indefinite integration by parts
  formula.
