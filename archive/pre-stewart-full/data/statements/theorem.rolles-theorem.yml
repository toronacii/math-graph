id: theorem.rolles-theorem
type: theorem
status: draft

title:
  en: Rolle's Theorem
  es: Teorema de Rolle

statement:
  natural:
    es: >
      Sea f una función que satisface las tres hipótesis siguientes:
      1. f es continua en el intervalo cerrado [a, b].
      2. f es derivable en el intervalo abierto (a, b).
      3. f(a) = f(b).
      Entonces existe un número c en (a, b) tal que f'(c) = 0.
    en: >
      Let f be a function that satisfies the following three hypotheses:
      1. f is continuous on the closed interval [a, b].
      2. f is differentiable on the open interval (a, b).
      3. f(a) = f(b).
      Then there is a number c in (a, b) such that f'(c) = 0.
  latex: |
    f \in C[a,b],\; f \text{ diff. on } (a,b),\; f(a)=f(b)
    \;\Rightarrow\;
    \exists\, c \in (a,b) : f'(c) = 0

proved_by:
  - proof.rolles-theorem.stewart

sources:
  - work: Cálculo de una variable — Trascendentes tempranas
    author: James Stewart
    edition: "7"
    chapter: "4"
    section: "4.2"

confidence: high
notes: >
  Stewart proves Rolle's theorem using the Extreme Value Theorem
  and Fermat's theorem. This serves as the key lemma for the
  Mean Value Theorem.
