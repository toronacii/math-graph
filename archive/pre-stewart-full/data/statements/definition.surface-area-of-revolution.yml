id: definition.surface-area-of-revolution
type: definition
status: draft

title:
  en: Surface area of revolution
  es: Área de superficie de revolución

statement:
  natural:
    es: >
      Si f' es continua en [a, b] y f(x) ≥ 0, entonces el área de
      la superficie obtenida al hacer girar la curva y = f(x),
      a ≤ x ≤ b, alrededor del eje x es
      S = ∫_a^b 2π f(x) √(1 + [f'(x)]²) dx.
    en: >
      If f' is continuous on [a, b] and f(x) ≥ 0, then the surface
      area of the surface obtained by rotating the curve y = f(x),
      a ≤ x ≤ b, about the x-axis is
      S = ∫_a^b 2π f(x) √(1 + [f'(x)]²) dx.
  latex: |
    S = \int_a^b 2\pi\,f(x)\,\sqrt{1 + \bigl[f'(x)\bigr]^2}\,dx

sources:
  - work: Cálculo de una variable — Trascendentes tempranas
    author: James Stewart
    edition: "7"
    chapter: "8"
    section: "8.2"

confidence: high
notes: >
  The formula combines the arc length element ds = √(1 + [f'(x)]²) dx
  with the circumference 2πf(x) of each circular cross-section.
  Derived by approximating the surface with frustums of cones.
