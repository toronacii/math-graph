id: theorem.monotonic-integrable-stieltjes
type: theorem
status: draft

title:
  en: Monotonic Functions with Continuous Integrator are Integrable

statement:
  natural:
    en: >
      If f is monotonic on [a, b] and alpha is continuous on [a, b],
      then f is in R(alpha).
  latex: |
    f \text{ monotonic on } [a,b],\;
    \alpha \in C[a,b]
    \implies f \in \mathscr{R}(\alpha)

proved_by:
  - proof.monotonic-integrable-stieltjes.rudin

sources:
  - work: Principles of Mathematical Analysis
    author: Walter Rudin
    edition: "3"
    chapter: "6"
    section: "6.9"

confidence: high
