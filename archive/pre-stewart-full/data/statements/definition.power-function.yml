generality:
  - target: definition.polynomial
    relation: incomparable
    notes: >
      Power functions x^a and polynomials overlap exactly when a is a
      non-negative integer (giving monomials). For non-integer a, x^a
      is not a polynomial; a general polynomial is not a single power
      function. Edge recorded on the alphabetically-earlier id per
      policy 04.

