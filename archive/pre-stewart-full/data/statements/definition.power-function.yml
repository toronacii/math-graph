statement:
  natural:
    es:
      text: >
        Una función potencia es una función de la forma f(x) = xᵃ, donde
        a es una constante. Los casos particulares importantes incluyen
        a = n (entero positivo), a = 1/n (raíces n-ésimas) y a = -1
        (función recíproca).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        A power function is a function of the form f(x) = xᵃ, where a is
        a constant. Important special cases include a = n (positive
        integer), a = 1/n (n-th roots), and a = -1 (the reciprocal
        function).
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f(x) = x^a
    status: present
    review_status: unreviewed

