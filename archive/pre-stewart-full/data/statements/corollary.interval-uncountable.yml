id: corollary.interval-uncountable
type: corollary
status: draft

title:
  en: Every Interval [a,b] is Uncountable

statement:
  natural:
    en: >
      Every interval [a,b] with a < b is uncountable. In particular, the set of all real numbers is uncountable.

proved_by:
  - proof.interval-uncountable.rudin

sources:
  - work: Principles of Mathematical Analysis
    author: Walter Rudin
    edition: "3"
    chapter: "2"
    section: "2.43"

confidence: high
notes: >
  Corollary to Theorem 2.43 in Rudin. Follows because [a,b] is a perfect set.
