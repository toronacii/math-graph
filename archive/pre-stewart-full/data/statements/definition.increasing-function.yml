statement:
  natural:
    es:
      text: >
        Una función f es creciente en un intervalo I si para cualesquiera
        dos números x₁ y x₂ en I tales que x₁ < x₂ se cumple que
        f(x₁) < f(x₂).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        A function f is increasing on an interval I if for any two
        numbers x₁ and x₂ in I such that x₁ < x₂, we have f(x₁) < f(x₂).
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \forall x_1, x_2 \in I:\; x_1 < x_2 \implies f(x_1) < f(x_2)
    status: present
    review_status: unreviewed

