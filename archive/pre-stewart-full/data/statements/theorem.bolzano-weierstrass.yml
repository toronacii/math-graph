id: theorem.bolzano-weierstrass
type: theorem
status: draft

title:
  en: Bolzano-Weierstrass Theorem

statement:
  natural:
    en: >
      Every bounded infinite subset of Rk has a limit point in Rk.

proved_by:
  - proof.bolzano-weierstrass.rudin

sources:
  - work: Principles of Mathematical Analysis
    author: Walter Rudin
    edition: "3"
    chapter: "2"
    section: "2.42"

confidence: high
notes: >
  Theorem 2.42 in Rudin. Immediate consequence of the Heine-Borel theorem.
