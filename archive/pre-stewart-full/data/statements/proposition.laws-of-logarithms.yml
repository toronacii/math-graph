statement:
  natural:
    es:
      text: >
        Si x > 0 e y > 0, entonces: (1) logₐ(xy) = logₐx + logₐy,
        (2) logₐ(x/y) = logₐx − logₐy, (3) logₐ(xʳ) = r·logₐx para
        todo número real r.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If x > 0 and y > 0, then: (1) logₐ(xy) = logₐx + logₐy,
        (2) logₐ(x/y) = logₐx − logₐy, (3) logₐ(xʳ) = r·logₐx for
        any real number r.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \log_a(xy) = \log_a x + \log_a y, \quad
      \log_a\!\tfrac{x}{y} = \log_a x - \log_a y, \quad
      \log_a(x^r) = r \log_a x
    status: present
    review_status: unreviewed

