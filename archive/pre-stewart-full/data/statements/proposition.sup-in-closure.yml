id: proposition.sup-in-closure
type: proposition
status: draft

title:
  en: Supremum Belongs to the Closure

statement:
  natural:
    en: >
      Let E be a nonempty set of real numbers bounded above. Let y = sup E. Then y ∈ E̅. Hence y ∈ E if E is closed.

proved_by:
  - proof.sup-in-closure.rudin

sources:
  - work: Principles of Mathematical Analysis
    author: Walter Rudin
    edition: "3"
    chapter: "2"
    section: "2.28"

confidence: high
notes: >
  Theorem 2.28 in Rudin. Connects the supremum with topological closure.
