sketch:
  es:
    text: >
      Por la identidad a = e^{ln a} (definición del logaritmo
      como inverso de la exponencial), a^x = (e^{ln a})^x =
      e^{(ln a) x}. Aplicando la regla de la cadena con función
      exterior e^u y función interior u = (ln a) x:
      (d/dx) a^x = (d/du) e^u · (d/dx)[(ln a) x]
                 = e^{(ln a) x} · ln a
                 = a^x · ln a.
    is_original: true
    origin: original
    review_status: unreviewed

