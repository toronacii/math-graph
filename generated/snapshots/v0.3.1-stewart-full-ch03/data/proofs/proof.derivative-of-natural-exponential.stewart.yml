sketch:
  es:
    text: >
      Por theorem.exponential-derivative-proportional aplicado a
      a = e, si e^x es derivable en 0 entonces
      (d/dx) e^x = f'(0)·e^x. Por definition.number-e,
      f'(0) = lím_{h→0} (e^h − 1)/h = 1. Por lo tanto
      (d/dx) e^x = 1·e^x = e^x.
    is_original: true
    origin: original
    review_status: unreviewed

