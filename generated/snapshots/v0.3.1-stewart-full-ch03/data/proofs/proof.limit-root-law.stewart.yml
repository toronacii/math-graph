  es:
    text: >
      Sea f(x) = ⁿ√x con n entero positivo. Por el Teorema 7, f es
      continua sobre su dominio. Por el Teorema 8, lím_{x→a} ⁿ√(g(x))
      = ⁿ√(lím_{x→a} g(x)), suponiendo que las raíces existen.
      Aplicando esto con g(x) = x se obtiene la ley 11 / ley de la
      raíz: lím_{x→a} ⁿ√x = ⁿ√a (caso n par requiere a > 0).
