sketch:
  es:
    text: >
      Sea f(x) = a^x. Por la definición de derivada,
      f'(x) = lím_{h→0} (a^{x+h} − a^x)/h
            = lím_{h→0} (a^x·a^h − a^x)/h
            = lím_{h→0} a^x·(a^h − 1)/h.
      Como a^x no depende de h, por la ley del múltiplo constante:
      f'(x) = a^x · lím_{h→0} (a^h − 1)/h.
      El límite restante es precisamente el valor f'(0). Por lo
      tanto, si f'(0) existe, entonces f'(x) = f'(0)·a^x para
      todo x.
    is_original: true
    origin: original
    review_status: unreviewed

