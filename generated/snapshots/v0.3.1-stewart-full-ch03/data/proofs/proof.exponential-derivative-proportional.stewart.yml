notes: >
  Conditional theorem: the derivation is rigorous given f'(0) exists.
  Existence of f'(0) is NOT proved by Stewart — only supported by
  a numerical table for a = 2 and a = 3. Marked as open epistemic
  debt; dependency_confidence:medium reflects the existence
  hypothesis. Rigorous treatment requires either a power-series
  definition of a^x or its construction as the inverse of the
  natural log.
