sketch:
  es:
    text: >
      Sea y = [g(x)]^n. Escriba y = f(u) con f(u) = u^n y
      u = g(x). Por theorem.power-rule-general, f'(u) = n u^{n−1}.
      Por theorem.chain-rule,
      dy/dx = (dy/du)·(du/dx) = n u^{n−1} · g'(x)
            = n [g(x)]^{n−1} · g'(x).
