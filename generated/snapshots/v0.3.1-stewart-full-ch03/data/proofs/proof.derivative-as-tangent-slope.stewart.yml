sketch:
  es:
    text: >
      Por la Definición 1 (§2.7), la pendiente m de la recta
      tangente a y = f(x) en P(a, f(a)) es
      m = lím_{x→a} (f(x) − f(a))/(x − a). Equivalentemente, por la
      sustitución h = x − a, m = lím_{h→0} (f(a + h) − f(a))/h
      (Ecuación 2). Por la Definición 4 (§2.7), la derivada f'(a)
      es exactamente f'(a) = lím_{h→0} (f(a + h) − f(a))/h. Las
      dos expresiones son literalmente el mismo límite, por lo
      tanto m = f'(a). La forma punto-pendiente de la recta que
      pasa por (a, f(a)) con pendiente f'(a) es
      y − f(a) = f'(a)·(x − a).
    is_original: true
    origin: original
    review_status: unreviewed
  en:
    text: >
      By Definition 1 (§2.7), the slope m of the tangent line to
      y = f(x) at P(a, f(a)) is
      m = lim_{x→a} (f(x) − f(a))/(x − a). Equivalently, with the
      substitution h = x − a, m = lim_{h→0} (f(a + h) − f(a))/h
      (Eq. 2). By Definition 4 (§2.7), the derivative f'(a) is
      exactly f'(a) = lim_{h→0} (f(a + h) − f(a))/h. The two
      expressions are literally the same limit, hence m = f'(a).
      The point-slope form of the line through (a, f(a)) with
      slope f'(a) is y − f(a) = f'(a)·(x − a).
