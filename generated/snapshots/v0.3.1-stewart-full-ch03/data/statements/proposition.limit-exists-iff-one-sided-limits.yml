    es:
      text: >
        lím_{x→a} f(x) = L si y sólo si lím_{x→a⁻} f(x) = L y
        lím_{x→a⁺} f(x) = L.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        lim_{x→a} f(x) = L if and only if lim_{x→a⁻} f(x) = L and
        lim_{x→a⁺} f(x) = L.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \lim_{x \to a} f(x) = L \iff
      \lim_{x \to a^{-}} f(x) = L \;\;\text{y}\;\;
      \lim_{x \to a^{+}} f(x) = L
