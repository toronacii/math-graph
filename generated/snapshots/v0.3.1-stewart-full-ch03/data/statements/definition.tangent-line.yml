notes: >
  Closes the §2.1 deferred entry for tangent-line (the §2.1 motivating
  setup defined only the secant-line; Stewart deferred the formal
  definition of tangent to §2.7 Def 1). Both equivalent slope forms
  (Eq 1 and Eq 2 in Stewart) are recorded in the LaTeX body. The
  identification slope-of-tangent = derivative is captured by
  proposition.derivative-as-tangent-slope.
