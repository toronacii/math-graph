    review_status: unreviewed

statement:
  natural:
    es:
      text: >
        La recta tangente a la curva y = f(x) en el punto P(a, f(a))
        es la recta que pasa por P con pendiente
        m = lím_{x→a} (f(x) − f(a))/(x − a), siempre que este límite
        exista. Equivalentemente, escribiendo h = x − a, la
        pendiente puede expresarse como
        m = lím_{h→0} (f(a + h) − f(a))/h.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The tangent line to the curve y = f(x) at the point
        P(a, f(a)) is the line through P with slope
        m = lim_{x→a} (f(x) − f(a))/(x − a), provided this limit
        exists. Equivalently, with h = x − a, the slope can be
        written m = lim_{h→0} (f(a + h) − f(a))/h.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      m = \lim_{x \to a} \frac{f(x) - f(a)}{x - a}
        = \lim_{h \to 0} \frac{f(a + h) - f(a)}{h}
    status: present
    review_status: unreviewed

