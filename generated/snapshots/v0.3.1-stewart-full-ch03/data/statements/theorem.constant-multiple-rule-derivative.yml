statement:
  natural:
    es:
      text: >
        Si c es una constante y f es una función derivable,
        entonces (d/dx)[c f(x)] = c (d/dx) f(x).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If c is a constant and f is a differentiable function,
        then (d/dx)[c f(x)] = c (d/dx) f(x).
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \frac{d}{dx}\bigl[c\,f(x)\bigr] \;=\; c\,\frac{d}{dx}f(x)
