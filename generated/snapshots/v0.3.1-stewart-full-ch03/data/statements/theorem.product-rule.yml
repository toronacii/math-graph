statement:
  natural:
    es:
      text: >
        Si f y g son derivables, entonces el producto fg es
        derivable y (d/dx)[f(x) g(x)] = f(x) (d/dx) g(x) +
        g(x) (d/dx) f(x). En palabras: la derivada de un producto
        de dos funciones es la primera función multiplicada por la
        derivada de la segunda, más la segunda función multiplicada
        por la derivada de la primera.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If f and g are differentiable, then the product fg is
        differentiable and (d/dx)[f(x) g(x)] = f(x) (d/dx) g(x) +
        g(x) (d/dx) f(x).
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \frac{d}{dx}\bigl[f(x)\,g(x)\bigr] \;=\;
        f(x)\,\frac{d}{dx}g(x) \;+\; g(x)\,\frac{d}{dx}f(x)
    status: present
    review_status: unreviewed

