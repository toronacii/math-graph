notes: >
  Stewart explicitly debunks the naive "derivative of product is
  product of derivatives" with a counterexample (f=x, g=x²).
  Historical attribution to Leibniz noted in the text. The
  geometric (rectangle-area) derivation is pedagogical; the
  algebraic limit derivation is the actual proof.
