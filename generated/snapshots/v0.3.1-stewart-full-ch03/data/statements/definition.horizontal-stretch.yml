statement:
  natural:
    es:
      text: >
        Sea c > 0. La gráfica de y = f(c·x) se obtiene de la de
        y = f(x) comprimiéndola horizontalmente por un factor c si
        c > 1, o alargándola horizontalmente por el factor 1/c si
        0 < c < 1.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        Let c > 0. The graph of y = f(c·x) is obtained from the
        graph of y = f(x) by compressing horizontally by a factor of
        c if c > 1, or stretching horizontally by a factor of 1/c if
        0 < c < 1.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      g(x) = f(c \cdot x), \qquad c > 0
    status: present
    review_status: unreviewed

