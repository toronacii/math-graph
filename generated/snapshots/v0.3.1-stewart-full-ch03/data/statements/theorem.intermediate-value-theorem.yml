statement:
  natural:
    es:
      text: >
        Suponga que f es continua sobre el intervalo cerrado [a, b]
        y sea N cualquier número entre f(a) y f(b), donde
        f(a) ≠ f(b). Entonces existe un número c en (a, b) tal que
        f(c) = N.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        Suppose f is continuous on the closed interval [a, b] and
        let N be any number between f(a) and f(b), where
        f(a) ≠ f(b). Then there exists a number c in (a, b) such
        that f(c) = N.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f \in C[a,b],\ N \text{ between } f(a) \text{ and } f(b),\
      f(a) \neq f(b)
      \implies
      \exists c \in (a,b) :\ f(c) = N
    status: present
    review_status: unreviewed

