statement:
  natural:
    es:
      text: >
        (a) Cualquier función polinomial es continua en todo su
        dominio; es decir, es continua sobre (−∞, ∞).
        (b) Cualquier función racional es continua siempre que esté
        definida; esto es, es continua en su dominio.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        (a) Every polynomial function is continuous on its entire
        domain, i.e. on (−∞, ∞).
        (b) Every rational function is continuous wherever it is
        defined, i.e. on its domain.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \begin{aligned}
      &P \text{ polynomial} \implies P \text{ continuous on } \mathbb{R}, \\
      &f = P/Q \text{ rational} \implies f \text{ continuous on its domain}.
      \end{aligned}
    status: present
    review_status: unreviewed

