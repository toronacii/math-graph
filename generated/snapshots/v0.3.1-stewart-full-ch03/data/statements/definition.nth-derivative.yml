statement:
  natural:
    es:
      text: >
        Para n ≥ 1, la n-ésima derivada de f, denotada f^(n), se
        define recursivamente: f^(1) = f' y, para n ≥ 2,
        f^(n) = (f^(n−1))', es decir, se obtiene derivando f
        sucesivamente n veces. La tercera y cuarta derivadas
        suelen escribirse f''' y f^(4); en notación de Leibniz,
        para y = f(x), se escribe d^n y / dx^n.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        For n ≥ 1, the n-th derivative of f, denoted f^(n), is
        defined recursively: f^(1) = f' and, for n ≥ 2,
        f^(n) = (f^(n−1))', i.e. it is obtained by differentiating
        f successively n times. The third and fourth derivatives
        are usually written f''' and f^(4); in Leibniz notation,
        for y = f(x), one writes d^n y / dx^n.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f^{(n)}(x) \;=\; \bigl(f^{(n-1)}\bigr)'(x),
        \qquad \frac{d^{n} y}{dx^{n}}
        \;=\; \frac{d}{dx}\!\left(\frac{d^{n-1} y}{dx^{n-1}}\right)
    status: present
    review_status: unreviewed

