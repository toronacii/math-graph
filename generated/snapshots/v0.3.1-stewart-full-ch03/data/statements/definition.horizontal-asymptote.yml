statement:
  natural:
    es:
      text: >
        La recta y = L se llama asíntota horizontal de la curva
        y = f(x) si lím_{x→∞} f(x) = L o lím_{x→−∞} f(x) = L.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The line y = L is called a horizontal asymptote of the
        curve y = f(x) if lim_{x→∞} f(x) = L or lim_{x→−∞} f(x) = L.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      y = L \text{ is a horizontal asymptote of } y = f(x)
      \iff \lim_{x \to \infty} f(x) = L \;\vee\; \lim_{x \to -\infty} f(x) = L
    status: present
