statement:
  natural:
    es:
      text: >
        Una función f se llama uno a uno (o inyectiva) si nunca toma
        el mismo valor dos veces; esto es, f(x₁) ≠ f(x₂) siempre que
        x₁ ≠ x₂.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        A function f is called one-to-one (or injective) if it never
        takes the same value twice; that is, f(x₁) ≠ f(x₂) whenever
        x₁ ≠ x₂.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \forall x_1, x_2 \in D:\; x_1 \ne x_2 \implies f(x_1) \ne f(x_2)
    status: present
