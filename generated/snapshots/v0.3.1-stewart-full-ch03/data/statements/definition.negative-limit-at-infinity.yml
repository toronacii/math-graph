statement:
  natural:
    es:
      text: >
        Sea f una función definida sobre algún intervalo (−∞, a).
        Entonces lím_{x→−∞} f(x) = L significa que los valores de
        f(x) pueden hacerse arbitrariamente cercanos a L haciendo
        que x sea negativa y suficientemente grande en magnitud.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        Let f be a function defined on some interval (−∞, a). Then
        lim_{x→−∞} f(x) = L means that the values of f(x) can be
        made arbitrarily close to L by taking x sufficiently large
        in magnitude on the negative side.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \lim_{x \to -\infty} f(x) = L
