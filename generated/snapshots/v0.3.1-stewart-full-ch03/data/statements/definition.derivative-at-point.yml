notes: >
  Stewart presents two equivalent forms (Eq 4 with h → 0 and Eq 5
  with x → a). The substitution x = a + h trivially equates them,
  so they are recorded inside one node rather than as two separate
  nodes. The link "f'(a) = slope of tangent" is captured by
  proposition.derivative-as-tangent-slope; the link
  "f'(a) = instantaneous velocity when f is position" is
  recorded informally inside definition.instantaneous-velocity
  rather than as a separate proposition (Stewart presents it as a
  reinterpretation, not a derived theorem).
