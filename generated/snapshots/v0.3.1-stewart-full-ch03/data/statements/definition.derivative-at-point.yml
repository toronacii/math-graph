statement:
  natural:
    es:
      text: >
        La derivada de una función f en un número x = a, denotada
        por f'(a), se define como el límite del cociente de
        diferencias f'(a) = lím_{h→0} (f(a + h) − f(a))/h, si este
        límite existe. Equivalentemente, escribiendo x = a + h se
        obtiene la forma f'(a) = lím_{x→a} (f(x) − f(a))/(x − a).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The derivative of a function f at a number x = a, denoted
        f'(a), is defined as the limit of the difference quotient
        f'(a) = lim_{h→0} (f(a + h) − f(a))/h, if this limit exists.
        Equivalently, writing x = a + h gives the form
        f'(a) = lim_{x→a} (f(x) − f(a))/(x − a).
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f'(a) \;=\; \lim_{h \to 0} \frac{f(a + h) - f(a)}{h}
                \;=\; \lim_{x \to a} \frac{f(x) - f(a)}{x - a}
    status: present
    review_status: unreviewed

