statement:
  natural:
    es:
      text: >
        Las funciones trigonométricas son las funciones reales seno
        (sin), coseno (cos), tangente (tan), cotangente (cot),
        secante (sec) y cosecante (csc), definidas a partir de
        relaciones angulares. En cálculo se utiliza la medida en
        radianes; sin y cos tienen dominio R y rango [-1, 1].
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The trigonometric functions are the real-valued functions
        sine (sin), cosine (cos), tangent (tan), cotangent (cot),
        secant (sec), and cosecant (csc), defined via angular
        relations. In calculus, radian measure is used; sin and cos
        have domain R and range [-1, 1].
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
