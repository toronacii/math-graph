statement:
  natural:
    es:
      text: >
        Si g es continua en x = a y f es continua en g(a), entonces
        la función compuesta f ∘ g dada por (f ∘ g)(x) = f(g(x)) es
        continua en x = a.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If g is continuous at x = a and f is continuous at g(a),
        then the composite function f ∘ g defined by
        (f ∘ g)(x) = f(g(x)) is continuous at x = a.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      g \text{ continuous at } a \;\wedge\;
      f \text{ continuous at } g(a)
      \implies
      f \circ g \text{ continuous at } a
    status: present
    review_status: unreviewed

