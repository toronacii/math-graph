statement:
  natural:
    es:
      text: >
        Si f es una función derivable, entonces su derivada f'
        también es una función y puede tener a su vez una
        derivada, denotada f'' = (f')'. Esta función f'' se
        denomina segunda derivada de f. En notación de Leibniz,
        para y = f(x), se escribe d²y/dx² = (d/dx)(dy/dx).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If f is a differentiable function, then its derivative f'
        is also a function and may itself have a derivative,
        denoted f'' = (f')'. The function f'' is called the
        second derivative of f. In Leibniz notation, for y = f(x),
        one writes d²y/dx² = (d/dx)(dy/dx).
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f''(x) \;=\; (f')'(x),
        \qquad \frac{d^{2}y}{dx^{2}}
        \;=\; \frac{d}{dx}\!\left(\frac{dy}{dx}\right)
    status: present
    review_status: unreviewed

