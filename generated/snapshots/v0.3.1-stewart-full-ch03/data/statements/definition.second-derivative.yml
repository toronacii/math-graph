notes: >
  Stewart introduces the second derivative as a concrete instance
  before the n-th derivative; both nodes are kept separate so that
  the n-th-derivative recursion (definition.nth-derivative) can
  cleanly cite the second derivative as its base case. The
  acceleration interpretation (a = s'') is captured by
  definition.acceleration via a generality edge.
