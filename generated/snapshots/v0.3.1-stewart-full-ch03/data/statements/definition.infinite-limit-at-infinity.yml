statement:
  natural:
    es:
      text: >
        La notación lím_{x→∞} f(x) = ∞ se utiliza para indicar que
        los valores de f(x) se hacen más grandes cuando x se hace
        muy grande. Un significado similar está asociado con los
        siguientes símbolos: lím_{x→−∞} f(x) = ∞,
        lím_{x→∞} f(x) = −∞ y lím_{x→−∞} f(x) = −∞.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The notation lim_{x→∞} f(x) = ∞ is used to indicate that
        f(x) grows large as x grows large. Similar meanings attach
        to the symbols lim_{x→−∞} f(x) = ∞, lim_{x→∞} f(x) = −∞,
        and lim_{x→−∞} f(x) = −∞.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \lim_{x \to \infty} f(x) = \infty,\quad
      \lim_{x \to -\infty} f(x) = \infty,\quad
      \lim_{x \to \infty} f(x) = -\infty,\quad
      \lim_{x \to -\infty} f(x) = -\infty
    status: informal
    review_status: unreviewed

