implicit_algebraic_imports:
  # All inherited, plus:
  - concept: Completeness Axiom (least upper bound property)
    used_by:
      - proof.monotonic-sequence-theorem.stewart
      - proof.extreme-value-theorem.stewart
      - proof.intermediate-value-theorem.stewart
    chapter: "2-11"
    notes: >
      The completeness axiom is the single most impactful implicit
      import in the graph. It underpins the MST (Ch11), EVT (Ch4),
      and IVT (Ch2), which together propagate to 23+ downstream proofs.

epistemic_debt_summary:
  total_weak_proofs: 7
  total_partial_proofs: 4
  total_inherited_weak: 5
  total_implicit_imports: 10
  affected_chain_depth: 12
  new_weak_since_chapter_10: 2
  new_partial_since_chapter_10: 1
  new_implicit_since_chapter_10: 1
  critical_debt: >
    The completeness axiom is the single most impactful gap in the
    graph. Three theorems (EVT, IVT, MST) are assumed without proof
    and collectively propagate to 23+ downstream proofs spanning
    Chapters 4-11. Adding a single axiom.completeness node and
    providing rigorous proofs of EVT, IVT, and MST would resolve
    the majority of epistemic debt in the graph.
