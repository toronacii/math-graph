  # New in Chapter 5
  - proof: proof.integrability-of-continuous-functions.stewart
    proves: theorem.integrability-of-continuous-functions
    issue: assumed-uniform-continuity
    confidence: low
    style: assumed
    chapter: "5"
    propagates_to:
      - proof.integral-properties.stewart
      - proof.integral-comparison.stewart
      - proof.ftc-part1.stewart
    notes: >
      Stewart states that continuous functions are integrable without
      proof. The rigorous proof requires uniform continuity on closed
      intervals (Heine-Cantor theorem), which is not covered in this
      textbook. While the integrability theorem is not directly used
      as a proof dependency, it provides the foundational guarantee
      that the definite integral exists for continuous functions —
      a premise implicitly used by all integration results.
    resolution_path: >
      Add the Heine-Cantor theorem (continuous on closed interval
      implies uniformly continuous) and use it to prove integrability
      via epsilon-delta argument on Riemann sums.

