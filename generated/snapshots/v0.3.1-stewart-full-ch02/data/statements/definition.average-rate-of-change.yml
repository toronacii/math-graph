    review_status: unreviewed

statement:
  natural:
    es:
      text: >
        Sea y = f(x). Si x cambia de x₁ a x₂, el incremento de x es
        Δx = x₂ − x₁ y el cambio correspondiente en y es
        Δy = f(x₂) − f(x₁). El cociente de diferencias
        Δy/Δx = (f(x₂) − f(x₁))/(x₂ − x₁) se llama razón de cambio
        promedio de y respecto a x sobre el intervalo [x₁, x₂], y
        coincide con la pendiente de la recta secante PQ que pasa
        por los puntos (x₁, f(x₁)) y (x₂, f(x₂)).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        Let y = f(x). If x changes from x₁ to x₂, the change in x is
        Δx = x₂ − x₁ and the corresponding change in y is
        Δy = f(x₂) − f(x₁). The difference quotient
        Δy/Δx = (f(x₂) − f(x₁))/(x₂ − x₁) is called the average rate
        of change of y with respect to x on the interval [x₁, x₂],
        and equals the slope of the secant line PQ through the
        points (x₁, f(x₁)) and (x₂, f(x₂)).
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \frac{\Delta y}{\Delta x}
        \;=\; \frac{f(x_2) - f(x_1)}{x_2 - x_1}
    status: present
    review_status: unreviewed

