statement:
  natural:
    es:
      text: >
        Una función f es continua sobre un intervalo si es continua
        en cada número en el intervalo. (Si f está definida sólo en
        un lado de un punto extremo del intervalo, entendemos por
        continua en el punto extremo, como continua por la derecha
        o continua por la izquierda.)
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        A function f is continuous on an interval if it is
        continuous at every number in the interval. (If f is
        defined only on one side of an endpoint, "continuous at the
        endpoint" means right-continuous or left-continuous.)
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f \text{ continuous on } I \iff
      \forall a \in I,\ f \text{ continuous at } a
      \;(\text{one-sided at endpoints})
    status: present
    review_status: unreviewed

