statement:
  natural:
    es:
      text: >
        Dadas dos funciones f y g con dominios A y B, se definen
        puntualmente las funciones (f + g)(x) = f(x) + g(x),
        (f − g)(x) = f(x) − g(x) y (fg)(x) = f(x) g(x) sobre el
        dominio común A ∩ B. La función cociente (f/g)(x) = f(x)/g(x)
        se define sobre {x ∈ A ∩ B : g(x) ≠ 0}.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        Given two functions f and g with domains A and B, the
        pointwise functions (f + g)(x) = f(x) + g(x),
        (f − g)(x) = f(x) − g(x), and (fg)(x) = f(x)g(x) are
        defined on the common domain A ∩ B. The quotient function
        (f/g)(x) = f(x)/g(x) is defined on {x ∈ A ∩ B : g(x) ≠ 0}.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      (f \pm g)(x) = f(x) \pm g(x), \qquad
      (fg)(x) = f(x) g(x), \qquad
      (f/g)(x) = \frac{f(x)}{g(x)} \;[g(x) \ne 0]
    status: present
    review_status: unreviewed

