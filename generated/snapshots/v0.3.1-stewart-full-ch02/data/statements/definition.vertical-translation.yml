statement:
  natural:
    es:
      text: >
        Sea c > 0. La gráfica de y = f(x) + c se obtiene desplazando
        la gráfica de y = f(x) verticalmente c unidades hacia arriba,
        y la gráfica de y = f(x) − c se obtiene desplazándola c
        unidades hacia abajo.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        Let c > 0. The graph of y = f(x) + c is the graph of
        y = f(x) shifted vertically c units upward, and the graph of
        y = f(x) − c is shifted c units downward.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      g(x) = f(x) + c, \qquad c \in \mathbb{R}
    status: present
    review_status: unreviewed

