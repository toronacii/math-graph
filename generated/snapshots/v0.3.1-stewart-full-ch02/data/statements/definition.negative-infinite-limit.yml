statement:
  natural:
    es:
      text: >
        Sea f definida por ambos lados de a, excepto posiblemente
        en a misma. Entonces lím_{x→a} f(x) = −∞ significa que los
        valores de f(x) pueden ser negativos arbitrariamente
        grandes, tomando x suficientemente cerca de a, pero no
        igual a a.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        Let f be defined on both sides of a, except possibly at a
        itself. Then lim_{x→a} f(x) = −∞ means that the values of
        f(x) can be made arbitrarily large negative by taking x
        sufficiently close to a, but not equal to a.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \lim_{x \to a} f(x) = -\infty
    status: informal
    review_status: unreviewed

