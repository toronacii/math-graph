statement:
  natural:
    es:
      text: >
        Si un objeto se mueve a lo largo de una línea recta con
        función posición s = f(t), la velocidad (o velocidad
        instantánea) en el instante t = a se define como el límite
        de las velocidades promedio sobre intervalos cada vez más
        cortos: v(a) = lím_{h→0} (f(a + h) − f(a)) / h, siempre que
        este límite exista.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If an object moves along a straight line with position
        function s = f(t), the velocity (or instantaneous velocity)
        at time t = a is defined as the limit of the average
        velocities over shorter and shorter time intervals:
        v(a) = lim_{h→0} (f(a + h) − f(a)) / h, provided this limit
        exists.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      v(a) \;=\; \lim_{h \to 0} \frac{f(a + h) - f(a)}{h}
    status: present
    review_status: unreviewed

