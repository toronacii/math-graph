notes: >
  Closes the §2.1 deferred entry for instantaneous velocity; the
  §2.1 setup discussed velocity informally via the falling-ball
  example, but the formal definition appears here in §2.7 (Eq 3).
  The identification velocity = derivative is captured separately
  through definition.derivative-at-point: v(a) is literally the
  same difference-quotient limit as f'(a) when f is the position
  function, which is the kinematic instance of the derivative.
