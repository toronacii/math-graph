statement:
  natural:
    es:
      text: >
        Una función definida por partes (por trozos) es aquella cuyo
        dominio se divide en subconjuntos disjuntos, asignando a cada
        subconjunto una fórmula distinta para calcular f(x).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        A piecewise-defined function is one whose domain is split into
        disjoint subsets, with a distinct formula for f(x) assigned to
        each subset.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
