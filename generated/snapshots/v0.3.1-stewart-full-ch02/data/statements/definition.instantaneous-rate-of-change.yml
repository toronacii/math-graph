statement:
  natural:
    es:
      text: >
        Sea y = f(x). La razón de cambio instantánea de y respecto a
        x en x = x₁ se define como el límite de las razones de cambio
        promedio sobre intervalos cada vez más pequeños:
        lím_{Δx→0} Δy/Δx = lím_{x₂→x₁} (f(x₂) − f(x₁))/(x₂ − x₁).
        Geométricamente coincide con la pendiente de la recta
        tangente a la curva y = f(x) en el punto P(x₁, f(x₁)).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        Let y = f(x). The instantaneous rate of change of y with
        respect to x at x = x₁ is defined as the limit of the
        average rates of change over smaller and smaller intervals:
        lim_{Δx→0} Δy/Δx = lim_{x₂→x₁} (f(x₂) − f(x₁))/(x₂ − x₁).
        Geometrically it equals the slope of the tangent line to
        the curve y = f(x) at the point P(x₁, f(x₁)).
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \text{instantaneous rate of change}
        \;=\; \lim_{\Delta x \to 0} \frac{\Delta y}{\Delta x}
        \;=\; \lim_{x_2 \to x_1} \frac{f(x_2) - f(x_1)}{x_2 - x_1}
    status: present
    review_status: unreviewed

