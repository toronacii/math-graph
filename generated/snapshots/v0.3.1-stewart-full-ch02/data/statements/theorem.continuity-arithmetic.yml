statement:
  natural:
    es:
      text: >
        Si f y g son continuas en x = a y c es una constante,
        entonces las siguientes funciones son también continuas en
        x = a: (1) f + g; (2) f − g; (3) c f; (4) f g;
        (5) f / g, siempre que g(a) ≠ 0.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If f and g are continuous at x = a and c is a constant,
        then the following functions are also continuous at x = a:
        (1) f + g; (2) f − g; (3) c f; (4) f g;
        (5) f / g, provided g(a) ≠ 0.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f, g \text{ continuous at } a \implies
      f \pm g,\ cf,\ fg,\ f/g\ (g(a) \neq 0)
      \text{ continuous at } a
    status: present
    review_status: unreviewed

