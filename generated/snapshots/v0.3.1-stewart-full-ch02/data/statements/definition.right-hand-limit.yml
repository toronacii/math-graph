    review_status: unreviewed

statement:
  natural:
    es:
      text: >
        Decimos que lím_{x→a⁺} f(x) = L (el límite de f(x) cuando
        x tiende a a por la derecha es igual a L) si podemos hacer
        que los valores de f(x) se acerquen arbitrariamente a L
        tomando x suficientemente cercanos a a, pero mayores que a.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        We say lim_{x→a⁺} f(x) = L (the right-hand limit of f(x) as
        x approaches a equals L) if we can make the values of f(x)
        arbitrarily close to L by taking x sufficiently close to a
        but greater than a.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \lim_{x \to a^{+}} f(x) = L
    status: informal
    review_status: unreviewed

