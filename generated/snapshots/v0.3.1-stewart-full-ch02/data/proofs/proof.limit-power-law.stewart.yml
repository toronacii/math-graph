      Si utilizamos repetidamente la ley del producto (Ley 4) con
      g(x) = f(x), obtenemos lím [f(x)]² = (lím f(x))²; por
      inducción sobre n, lím [f(x)]ⁿ = (lím f(x))ⁿ.
