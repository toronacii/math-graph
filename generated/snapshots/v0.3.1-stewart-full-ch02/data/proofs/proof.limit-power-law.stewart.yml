    role: essential
    confidence: high
    implicit: false
    notes: >
      product law (limit-laws #4) applied repeatedly: at step k,
      lim [f(x)]^{k+1} = lim ([f(x)]^k · f(x))
                     = (lim [f(x)]^k) · (lim f(x))

