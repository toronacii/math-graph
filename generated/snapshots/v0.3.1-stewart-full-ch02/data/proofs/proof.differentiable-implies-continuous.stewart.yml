sketch:
  es:
    text: >
      Hipótesis: f'(a) = lím_{x→a} (f(x) − f(a))/(x − a) existe
      (forma Eq 2.7.5 de la derivada). Para x ≠ a se puede
      escribir f(x) − f(a) = ((f(x) − f(a))/(x − a))·(x − a).
      Aplicando la ley del producto de los límites,
      lím_{x→a} [f(x) − f(a)] =
      lím_{x→a} (f(x) − f(a))/(x − a) · lím_{x→a} (x − a) =
      f'(a) · 0 = 0. Sumando y restando f(a) y aplicando la ley
      de la suma, lím_{x→a} f(x) = lím_{x→a} f(a) +
      lím_{x→a} [f(x) − f(a)] = f(a) + 0 = f(a). Por lo tanto f
      es continua en a.
