notes: >
  Standard textbook proof. Uses Stewart's Eq 2.7.5 form of the
  derivative (x → a, not h → 0) because the (x − a) factor is the
  algebraic pivot. Depends on the SUM and PRODUCT cases of
  proposition.limit-laws, both established (sum case proved
  explicitly; product case still bundled).
