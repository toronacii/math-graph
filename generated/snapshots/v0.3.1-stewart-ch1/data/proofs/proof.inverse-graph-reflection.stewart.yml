sketch:
  es:
    text: >
      Por definición de gráfica, (a, b) ∈ graph(f) ⇔ f(a) = b. Por
      definición de inversa, f(a) = b ⇔ f⁻¹(b) = a, es decir,
      (b, a) ∈ graph(f⁻¹). La transformación (a, b) ↦ (b, a) es
      exactamente la reflexión respecto a la recta y = x. Por tanto
      graph(f⁻¹) es la imagen de graph(f) bajo dicha reflexión.
    is_original: true
