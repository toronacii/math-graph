notes: >
  Choose eta so that [alpha(b) - alpha(a)] eta < epsilon. By uniform
  continuity (Theorem 4.19), choose delta so that |f(x)-f(t)| < eta
  when |x-t| < delta. Any partition with Delta x_i < delta gives
  M_i - m_i <= eta, so U - L <= eta [alpha(b) - alpha(a)] < epsilon.
