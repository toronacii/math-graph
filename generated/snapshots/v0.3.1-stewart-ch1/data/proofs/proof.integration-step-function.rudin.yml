proves: theorem.integration-step-function

uses:
  - definition.unit-step-function
  - definition.riemann-stieltjes-integral
  - definition.continuity-metric

style: direct
sources:
  - work: Principles of Mathematical Analysis
    author: Walter Rudin
    edition: "3"
    chapter: "6"
    section: "6.15"

confidence: high
notes: >
  Consider partition P = {a, s, x_2, b} with s < x_2. Then
  U(P,f,alpha) = M_2 and L(P,f,alpha) = m_2. As x_2 -> s,
  both converge to f(s) by continuity at s.
