statement:
  natural:
    es:
      text: >
        Una función f es par si para todo x en su dominio se cumple
        f(-x) = f(x). Geométricamente, la gráfica de una función par
        es simétrica respecto al eje y.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        A function f is even if f(-x) = f(x) for every x in its domain.
        Geometrically, the graph of an even function is symmetric about
        the y-axis.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \forall x \in D:\; f(-x) = f(x)
