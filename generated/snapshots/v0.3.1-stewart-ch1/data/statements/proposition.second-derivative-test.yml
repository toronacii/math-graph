id: proposition.second-derivative-test
type: proposition
status: draft

title:
  en: The Second Derivative Test
  es: Prueba de la segunda derivada

statement:
  natural:
    es: >
      Suponga que f'' es continua cerca de c.
      (a) Si f'(c) = 0 y f''(c) > 0, entonces f tiene un mínimo
      local en c. (b) Si f'(c) = 0 y f''(c) < 0, entonces f tiene
      un máximo local en c.
    en: >
      Suppose f'' is continuous near c.
      (a) If f'(c) = 0 and f''(c) > 0, then f has a local minimum
      at c. (b) If f'(c) = 0 and f''(c) < 0, then f has a local
      maximum at c.
  latex: |
    f'(c) = 0 \;\wedge\; f''(c) > 0 \;\Rightarrow\; \text{local min at } c \\
    f'(c) = 0 \;\wedge\; f''(c) < 0 \;\Rightarrow\; \text{local max at } c

proved_by:
  - proof.second-derivative-test.stewart

sources:
  - work: Cálculo de una variable — Trascendentes tempranas
    author: James Stewart
    edition: "7"
    chapter: "4"
    section: "4.3"

confidence: high
notes: >
  When f''(c) > 0, f is concave up near c, so the tangent line
  at c lies below the graph, meaning c is a local minimum.
