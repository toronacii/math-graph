id: definition.concave-downward
type: definition
status: draft

title:
  en: Concave downward
  es: Cóncava hacia abajo

statement:
  natural:
    es: >
      Si la gráfica de f se encuentra por debajo de todas sus tangentes
      en un intervalo I, entonces se dice que f es cóncava hacia abajo
      en I.
    en: >
      If the graph of f lies below all of its tangent lines on an
      interval I, then f is called concave downward on I.

sources:
  - work: Cálculo de una variable — Trascendentes tempranas
    author: James Stewart
    edition: "7"
    chapter: "4"
    section: "4.3"

confidence: high
