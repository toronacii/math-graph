statement:
  natural:
    es:
      text: >
        La función logarítmica con base a, denotada logₐ, es la función
        inversa de la función exponencial con base a. Es decir,
        logₐ(x) = y si y sólo si aʸ = x, donde a > 0 y a ≠ 1.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The logarithmic function with base a, denoted logₐ, is the
        inverse of the exponential function with base a. That is,
        logₐ(x) = y if and only if aʸ = x, where a > 0 and a ≠ 1.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \log_a x = y \iff a^y = x, \qquad a > 0,\; a \neq 1
    status: present
    review_status: unreviewed

