        Una función es inyectiva si y sólo si ninguna línea horizontal
        corta su gráfica más de una vez.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        A function is one-to-one if and only if no horizontal line
        intersects its graph more than once.
