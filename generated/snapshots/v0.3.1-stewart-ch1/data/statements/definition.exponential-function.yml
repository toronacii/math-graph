statement:
  natural:
    es:
      text: >
        La función exponencial con base a es la función f(x) = aˣ,
        donde a es una constante positiva distinta de 1 y x es
        cualquier número real. El dominio es todos los reales y el
        rango es (0, ∞).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The exponential function with base a is the function f(x) = aˣ,
        where a is a positive constant different from 1 and x is any
        real number. The domain is all real numbers and the range is
        (0, ∞).
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f(x) = a^x, \qquad a > 0,\; a \neq 1
