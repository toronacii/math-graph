statement:
  natural:
    es:
      text: >
        Una función es algebraica si puede construirse a partir de
        polinomios mediante operaciones algebraicas (suma, resta,
        multiplicación, división y extracción de raíces). Toda función
        racional es automáticamente algebraica.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        A function is algebraic if it can be constructed from polynomials
        using algebraic operations (addition, subtraction, multiplication,
        division, and root extraction). Every rational function is
        automatically algebraic.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: ""
    status: not_applicable
    notes: >
      Stewart describes the class of algebraic functions in prose,
      without giving a single defining formula.
    review_status: unreviewed

