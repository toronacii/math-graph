statement:
  natural:
    es:
      text: >
        Si c > 1, la gráfica de y = f(cx) se obtiene comprimiendo la
        gráfica de y = f(x) horizontalmente por un factor de c. Si
        0 < c < 1, la gráfica se estira horizontalmente por un factor
        de 1/c.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If c > 1, the graph of y = f(cx) is obtained by compressing
        the graph of y = f(x) horizontally by a factor of c. If
        0 < c < 1, the graph is stretched horizontally by a factor
        of 1/c.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      y = f(c x), \qquad c > 0
    status: present
    review_status: unreviewed

