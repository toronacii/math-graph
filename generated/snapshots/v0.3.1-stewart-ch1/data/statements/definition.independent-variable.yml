statement:
  natural:
    es:
      text: >
        La variable independiente de una función f es el símbolo x que
        representa un elemento arbitrario del dominio. Se dice
        independiente porque puede tomar libremente cualquier valor del
        dominio.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The independent variable of a function f is the symbol x
        representing an arbitrary element of the domain. It is called
        independent because it can freely take any value in the domain.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
