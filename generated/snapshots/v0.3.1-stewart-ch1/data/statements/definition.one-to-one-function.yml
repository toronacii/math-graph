statement:
  natural:
    es:
      text: >
        Una función f es inyectiva (uno a uno) si nunca toma el mismo
        valor dos veces; es decir, si x₁ ≠ x₂ entonces f(x₁) ≠ f(x₂).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        A function f is one-to-one if it never takes the same value
        twice; that is, if x₁ ≠ x₂ then f(x₁) ≠ f(x₂).
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      x_1 \neq x_2 \implies f(x_1) \neq f(x_2)
    status: present
    review_status: unreviewed

