notes: >
  Upper bound: |gamma(x_i) - gamma(x_{i-1})| = |integral gamma' dt|
  <= integral |gamma'| dt, so Lambda(P) <= integral |gamma'| dt.
  Lower bound: use uniform continuity of gamma' to show
  integral |gamma'| dt <= Lambda(P) + 2 epsilon (b-a) for fine enough P.
