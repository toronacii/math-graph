proves: theorem.integral-triangle-inequality-vector

uses:
  - theorem.composition-preserves-integrability
  - theorem.riemann-stieltjes-integral-properties
  - definition.vector-valued-integral

style: direct
sources:
  - work: Principles of Mathematical Analysis
    author: Walter Rudin
    edition: "3"
    chapter: "6"
    section: "6.25"

confidence: high
notes: >
  |f| = (f_1^2 + ... + f_k^2)^{1/2} in R(alpha) by Theorem 6.11 applied
  twice (squaring, then square root). For the inequality, put
  y = integral f d alpha, compute |y|^2 = sum y_j integral f_j d alpha
  = integral (sum y_j f_j) d alpha <= |y| integral |f| d alpha by
  Schwarz inequality and Theorem 6.12(b). Divide by |y|.
