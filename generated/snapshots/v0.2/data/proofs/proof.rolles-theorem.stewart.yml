id: proof.rolles-theorem.stewart
type: proof
status: draft

proves: theorem.rolles-theorem

uses:
  - theorem.extreme-value-theorem
  - theorem.fermat-theorem
  - definition.continuity-on-interval
  - definition.differentiable

style: direct
sources:
  - work: Cálculo de una variable — Trascendentes tempranas
    author: James Stewart
    edition: "7"
    chapter: "4"
    section: "4.2"

confidence: high
notes: >
  Case 1: f(x) = f(a) for all x in [a,b], then f is constant and
  f'(c) = 0 for any c. Case 2: f(x) > f(a) for some x, then by EVT
  f attains a maximum at some c in (a,b) (not an endpoint since
  f(a) = f(b)). By Fermat's theorem, f'(c) = 0. Case 3: analogous
  with minimum.
