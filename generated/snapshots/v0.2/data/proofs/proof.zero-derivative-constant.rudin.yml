id: proof.zero-derivative-constant.rudin
type: proof
status: draft

proves: corollary.zero-derivative-constant

uses:
  - theorem.mean-value-theorem

style: direct
sources:
  - work: Principles of Mathematical Analysis
    author: Walter Rudin
    edition: "3"
    chapter: "5"
    section: "5.11"

confidence: high
notes: >
  Part (b) of Theorem 5.11. For any x1, x2 in (a,b), MVT gives
  f(x2) - f(x1) = (x2 - x1)f'(x) = 0. Hence f is constant.
