id: proof.geometric-series.stewart
type: proof
status: draft

proves: theorem.geometric-series

uses:
  - definition.infinite-series
  - definition.sequence

style: algebraic
sources:
  - work: Cálculo de una variable — Trascendentes tempranas
    author: James Stewart
    edition: "7"
    chapter: "11"
    section: "11.2"

confidence: high
notes: >
  The partial sum is sₙ = a(1-rⁿ)/(1-r) for r ≠ 1. When |r| < 1,
  rⁿ → 0, so sₙ → a/(1-r). When |r| ≥ 1, the partial sums do
  not converge.
