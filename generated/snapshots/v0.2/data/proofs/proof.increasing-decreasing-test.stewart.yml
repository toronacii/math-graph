id: proof.increasing-decreasing-test.stewart
type: proof
status: draft

proves: proposition.increasing-decreasing-test

uses:
  - theorem.mean-value-theorem
  - definition.increasing-function
  - definition.decreasing-function

style: direct
sources:
  - work: Cálculo de una variable — Trascendentes tempranas
    author: James Stewart
    edition: "7"
    chapter: "4"
    section: "4.3"

confidence: high
notes: >
  For x1 < x2 in the interval, MVT gives f(x2) - f(x1) = f'(c)(x2-x1)
  for some c in (x1,x2). If f'(c) > 0 then f(x2) > f(x1), so f is
  increasing. Analogous for decreasing.
