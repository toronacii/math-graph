    author: James Stewart
    edition: "7"
    chapter: "4"
    section: "4.1"

confidence: high
notes: >
  Assume f has a local max at c and f'(c) exists. For h > 0 small,
  f(c+h) ≤ f(c), so [f(c+h)-f(c)]/h ≤ 0, giving f'(c) ≤ 0.
  For h < 0 small, [f(c+h)-f(c)]/h ≥ 0, giving f'(c) ≥ 0.
  Therefore f'(c) = 0. Analogous for local min.
