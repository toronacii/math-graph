confidence: low
notes: >
  Stewart states the laws of exponents without proof in section 1.4,
  treating them as known results from precalculus extended to real
  exponents. A rigorous proof requires the construction of the real
  exponential via limits or the natural logarithm, which appears
  later in the text.
