id: proposition.change-of-base-formula
type: proposition
status: draft

title:
  en: Change of base formula
  es: Fórmula de cambio de base

statement:
  natural:
    es: >
      Para cualquier número positivo a ≠ 1, se tiene
      logₐx = ln(x)/ln(a) para todo x > 0.
    en: >
      For any positive number a ≠ 1, we have
      logₐx = ln(x)/ln(a) for all x > 0.
  latex: |
    \log_a x = \frac{\ln x}{\ln a}

proved_by:
  - proof.change-of-base-formula.stewart

sources:
  - work: Cálculo de una variable — Trascendentes tempranas
    author: James Stewart
    edition: "7"
    chapter: "1"
    section: "1.5"

confidence: medium
notes: >
  Stewart presents the change of base formula in section 1.5, noting
  it allows computing any logarithm using natural logarithms.
