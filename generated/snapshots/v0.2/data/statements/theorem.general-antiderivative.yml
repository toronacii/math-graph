id: theorem.general-antiderivative
type: theorem
status: draft

title:
  en: General antiderivative
  es: Antiderivada general

statement:
  natural:
    es: >
      Si F es una antiderivada de f en un intervalo I, entonces la
      antiderivada más general de f en I es F(x) + C, donde C es
      una constante arbitraria.
    en: >
      If F is an antiderivative of f on an interval I, then the most
      general antiderivative of f on I is F(x) + C, where C is an
      arbitrary constant.
  latex: |
    F'(x) = f(x) \;\Rightarrow\;
    \text{general antiderivative} = F(x) + C

proved_by:
  - proof.general-antiderivative.stewart

sources:
  - work: Cálculo de una variable — Trascendentes tempranas
    author: James Stewart
    edition: "7"
    chapter: "4"
    section: "4.9"

confidence: high
notes: >
  Direct consequence of the corollary that functions with equal
  derivatives differ by a constant.
