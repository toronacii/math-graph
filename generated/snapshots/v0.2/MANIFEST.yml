snapshot:
  version: v0.2
  label: prototype-baseline
  created: 2026-05-11
  status: frozen
  policy: read-only-historical-archive

provenance:
  schema_module: schema/models.py
  pipeline:
    - scripts.loader
    - scripts.validate
    - scripts.build_db
    - scripts.build_graph
    - scripts.make_context_pack
  build_command: uv run python -m scripts.build_graph

contents:
  data/:        full YAML source-of-truth at v0.2 freeze
  graph/:       graph.json, node-details.json, math_graph.db
  exports/:     graph.graphml
  reports/:     all chapter reports + audits
  milestones/:  per-chapter completion records
  context-packs/: extraction context packs

graph_state:
  total_nodes: 527
  total_edges: 687
  statements: 326
  proofs: 201
  sources_extracted:
    stewart: chapters 1-11
    rudin: chapters 1-6

successor:
  version: v0.3
  notes: >
    v0.3 is a semantically hardened rerun. Node IDs MAY differ.
    This v0.2 snapshot is preserved only for historical comparison
    and migration auditing. It is not used by the live pipeline.

hash_index: hashes.txt   # to be generated by scripts.snapshot
