sketch:
  es:
    text: >
      Como g es continua en a, lím_{x→a} g(x) = g(a). Como f es
      continua en b = g(a), por el Teorema 8 lím_{x→a} f(g(x)) =
      f(g(a)) = (f ∘ g)(a). Esto muestra que f ∘ g es continua en a.
