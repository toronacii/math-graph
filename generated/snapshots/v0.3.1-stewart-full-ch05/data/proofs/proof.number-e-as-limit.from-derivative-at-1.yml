uses:
  - id: theorem.derivative-of-natural-logarithm
    role: essential
    confidence: high
    notes: f(x) = ln x has f'(1) = 1/1 = 1; this is the pivot
  - id: definition.derivative-function
    role: definition
    confidence: high
    notes: f'(1) = lim_{x→0} (f(1+x) − f(1))/x
  - id: proposition.laws-of-logarithms
    role: essential
    confidence: high
    notes: (1/x) · ln(1 + x) = ln (1 + x)^{1/x}
  - id: theorem.continuity-of-composition
    role: essential
    confidence: medium
    notes: >
      Stewart cites "Theorem 2.5.8 and continuity of the
      exponential function" to interchange exp with the limit:
      exp(lim ln(1+x)^{1/x}) = lim exp(ln (1+x)^{1/x}) = lim (1+x)^{1/x}.
      Modeled as theorem.continuity-of-composition (if present in
      graph; otherwise treat as low-confidence implicit).

sources:
  - work: Cálculo de una variable — Trascendentes tempranas
    author: James Stewart
    edition: "7"
    chapter: "3"
