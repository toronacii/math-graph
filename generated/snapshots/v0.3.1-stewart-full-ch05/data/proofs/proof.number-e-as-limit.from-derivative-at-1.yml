sketch:
  es:
    text: >
      Sea f(x) = ln x. Por Eq 2, f'(x) = 1/x, luego f'(1) = 1.
      Pero por la definición de derivada,
      f'(1) = lím_{x→0} (ln(1 + x) − ln 1)/x = lím_{x→0} (1/x) ln(1 + x)
            = lím_{x→0} ln (1 + x)^{1/x}.
      Como f'(1) = 1, se tiene lím_{x→0} ln (1 + x)^{1/x} = 1.
      Aplicando la exponencial (continua) a ambos lados e
      intercambiándola con el límite (Teorema 2.5.8):
      e = e^1 = exp(lím ln(1+x)^{1/x}) = lím exp(ln(1+x)^{1/x})
        = lím (1+x)^{1/x}. La forma alternativa Eq 6 sigue al
      sustituir n = 1/x (entonces n → ∞ cuando x → 0⁺).
    is_original: true
    origin: original
    review_status: unreviewed

