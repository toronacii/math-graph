sketch:
  es:
    text: >
      Sean u = f(x), v = g(x), v ≠ 0. El cambio en el cociente
      al pasar x → x + Δx es
      Δ(u/v) = (u+Δu)/(v+Δv) − u/v
             = ((u+Δu)v − u(v+Δv)) / (v(v+Δv))
             = (vΔu − uΔv) / (v(v+Δv)).
      Dividiendo entre Δx:
      Δ(u/v)/Δx = (v·(Δu/Δx) − u·(Δv/Δx)) / (v(v+Δv)).
      Como g es derivable, también es continua, así que Δv → 0
      cuando Δx → 0, lo cual implica v + Δv → v. Aplicando las
      leyes de los límites,
      (d/dx)(u/v) = (v·(du/dx) − u·(dv/dx)) / v².
    is_original: true
    origin: original
    review_status: unreviewed

