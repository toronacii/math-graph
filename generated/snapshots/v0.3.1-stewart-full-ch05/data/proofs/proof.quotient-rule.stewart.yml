notes: >
  Closes the QUOTIENT case of the limit-laws bundled debt
  (the limit law for quotients is invoked when passing v(v+Δv) → v²
  through the limit). The hypothesis v ≠ 0 in a neighborhood is
  used implicitly via continuity of g.
