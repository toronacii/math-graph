sketch:
  es:
    text: >
      Escribe f(x) − g(x) = f(x) + (−1)·g(x). Por la regla de
      la suma, (d/dx)[f(x) + (−1)g(x)] =
      (d/dx) f(x) + (d/dx)[(−1)g(x)]. Por la regla del múltiplo
      constante con c = −1, (d/dx)[(−1)g(x)] = (−1)·g'(x) =
      −g'(x). Combinando:
      (d/dx)[f(x) − g(x)] = f'(x) − g'(x).
    is_original: true
    origin: original
    review_status: unreviewed

