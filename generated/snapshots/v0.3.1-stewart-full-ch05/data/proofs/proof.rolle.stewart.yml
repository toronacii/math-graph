sketch:
  es:
    text: >
      Tres casos. (I) Si f es constante en [a, b], f'(x) = 0 en todo
      (a, b) y c puede ser cualquiera. (II) Si f(x) > f(a) para algún
      x en (a, b): por el TVE f alcanza un máximo absoluto en [a, b];
      como f(a) = f(b) y el máximo supera a f(a), debe alcanzarse en
      algún c en (a, b). c es máximo local, f es derivable en c por
      la hipótesis 2, así que por Fermat f'(c) = 0. (III) Si
      f(x) < f(a) para algún x en (a, b): análogo aplicando el TVE
      al mínimo y luego Fermat.
    is_original: true
    origin: original
    review_status: unreviewed

