notes: >
  Stewart's full proof. The proof depends critically on EVT
  (existence of extremum on a compact interval) and Fermat
  (vanishing derivative at interior extremum) — making Rolle the
  bridge between Ch2 continuity / Ch4 §4.1 results and the Mean
  Value Theorem. EVT is itself unproved in Stewart (deferred to
  Apéndice F), so this proof carries the same epistemic debt.
