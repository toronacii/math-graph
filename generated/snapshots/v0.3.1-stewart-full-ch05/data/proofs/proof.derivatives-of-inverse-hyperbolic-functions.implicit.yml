parts:
  - name: derivative-of-arcsinh
    kind: subclaim
    description: >
      (d/dx) senh⁻¹ x = 1/√(1 + x²). Let y = senh⁻¹ x, so
      senh y = x. Differentiating implicitly: cosh y · (dy/dx) = 1,
      so dy/dx = 1/cosh y. Since cosh²y − senh²y = 1 and cosh y > 0,
      cosh y = √(1 + senh²y) = √(1 + x²). Stewart Example 4
      (Solution 1), page 261. An alternative proof differentiates
      the log form senh⁻¹ x = ln(x + √(x² + 1)) directly
      (Solution 2).
    uses:
      - id: proposition.implicit-differentiation
        role: essential
        confidence: high
      - id: theorem.chain-rule
        role: essential
        confidence: high
      - id: definition.inverse-hyperbolic-function
        role: definition
        confidence: high
      - id: theorem.derivatives-of-hyperbolic-functions
        role: essential
        confidence: high
        notes: (d/dy) senh y = cosh y
      - id: proposition.hyperbolic-identities
        role: essential
        confidence: high
        notes: cosh y = √(1 + senh²y) used to convert cosh y to a function of x

  - name: derivatives-of-arccosh-arctanh-arccsch-arcsech-arccoth
    kind: subclaim
    description: >
      The remaining five derivatives in Table 6 are derived
      analogously by implicit differentiation (or by differentiating
      the corresponding log forms from Equations 3–5 and Exercise 28).
      Stewart Ex 29. The tanh⁻¹ and coth⁻¹ formulas are
      algebraically identical (both 1/(1 − x²)) but apply on
      disjoint domains |x| < 1 and |x| > 1 respectively.
    uses:
      - id: proposition.implicit-differentiation
        role: essential
        confidence: medium
      - id: theorem.chain-rule
        role: essential
        confidence: medium
      - id: definition.inverse-hyperbolic-function
        role: definition
        confidence: high
      - id: theorem.derivatives-of-hyperbolic-functions
        role: essential
        confidence: medium
      - id: proposition.hyperbolic-identities
        role: essential
        confidence: medium
        notes: identities used to rewrite cosh y, sech²y, etc. in terms of x

