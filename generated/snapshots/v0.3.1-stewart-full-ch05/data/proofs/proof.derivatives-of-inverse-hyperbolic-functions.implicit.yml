sketch:
  es:
    text: >
      Bundle. arcsinh: sea y = senh⁻¹ x; entonces senh y = x.
      Derivando implícitamente, cosh y · (dy/dx) = 1, así
      dy/dx = 1/cosh y. Como cosh²y − senh²y = 1 y cosh y ≥ 0,
      cosh y = √(1 + senh²y) = √(1 + x²), de donde
      (d/dx) senh⁻¹ x = 1/√(1 + x²). Casos restantes (arccosh,
      arctanh, arccsch, arcsech, arccoth): técnica análoga,
      usando las identidades hiperbólicas para convertir
      cosh y, sech²y, etc. en expresiones de x. Las fórmulas de
      tanh⁻¹ y coth⁻¹ coinciden algebraicamente pero sus
      dominios son disjuntos.
    is_original: true
    origin: original
    review_status: unreviewed

