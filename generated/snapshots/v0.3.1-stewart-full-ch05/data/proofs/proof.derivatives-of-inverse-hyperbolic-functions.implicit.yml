notes: >
  Bundled proof. arcsinh is fully written out in Example 4
  (two methods); the other five are deferred to Exercise 29.
  dependency_confidence:medium reflects the partial textual
  coverage AND Stewart's informal assertion that the inverse of
  a differentiable bijection is differentiable. The dependency
  on proposition.hyperbolic-identities is essential — without
  the Pythagorean identity, cosh y cannot be re-expressed as a
  function of x = senh y.
