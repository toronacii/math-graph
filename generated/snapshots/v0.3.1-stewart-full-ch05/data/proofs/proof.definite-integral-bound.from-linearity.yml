sketch:
  es:
    text: >
      Las tres propiedades de comparación se derivan de la no-negatividad
      (Propiedad 6): si f(x) ≥ 0 en [a, b], entonces cada término
      f(xᵢ*)Δx ≥ 0, luego la integral (límite de tales sumas) es ≥ 0.
      Propiedad 7 (f ≥ g ⟹ ∫f ≥ ∫g): aplicar Propiedad 6 a f−g ≥ 0
      y usar linealidad (∫f − ∫g = ∫(f−g) ≥ 0).
      Propiedad 8 (m(b−a) ≤ ∫f ≤ M(b−a)): aplicar Propiedad 7 a las
      funciones constantes m ≤ f ≤ M e integrar; ∫m dx = m(b−a).
