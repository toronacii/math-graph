    confidence: high
    notes: >
      Non-negativity (Property 6) appeals to the Riemann sum definition:
      each term f(xᵢ*)Δx ≥ 0 passes to the limit.
  - id: proposition.definite-integral-properties
    role: essential
    confidence: high
    notes: >
      Linearity (Properties 1–5) is used to reduce f ≥ g to f−g ≥ 0
      and to handle the constant-function bounds.

