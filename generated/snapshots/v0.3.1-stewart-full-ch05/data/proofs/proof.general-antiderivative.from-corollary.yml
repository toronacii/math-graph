sketch:
  es:
    text: >
      Si F y G son antiderivadas de f sobre I, entonces F'(x) = f(x)
      = G'(x) para toda x en I. Por el Corolario 4.2.7 existe una
      constante C con G(x) − F(x) = C, es decir G(x) = F(x) + C.
      Recíprocamente, F(x) + C es antiderivada de f para todo C.
    is_original: true
    origin: original
    review_status: unreviewed

