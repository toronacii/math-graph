notes: >
  Stewart's discussion preceding Teorema 1 page 344 is itself the
  proof — he derives F + C as the general antiderivative by direct
  appeal to Corolario 4.2.7. The converse direction (every F + C is
  an antiderivative) Stewart leaves implicit; we make it explicit
  here for completeness, since it follows trivially from the
  constant-rule and sum-rule for derivatives.
