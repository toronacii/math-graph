sketch:
  es:
    text: >
      Por continuidad de f y g en a, lím_{x→a} f(x) = f(a) y
      lím_{x→a} g(x) = g(a). Por la ley 1 de los límites,
      lím_{x→a} [f(x) + g(x)] = lím f(x) + lím g(x) = f(a) + g(a) =
      (f + g)(a). Esto prueba que f + g es continua en a.
    is_original: true
    origin: original
    review_status: unreviewed

