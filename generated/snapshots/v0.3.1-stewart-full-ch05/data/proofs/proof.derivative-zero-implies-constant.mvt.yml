notes: >
  Stewart's direct application of MVT to two arbitrary interior
  points. The interval hypothesis is essential — Stewart's NOTA
  explicitly warns the result fails on disconnected domains
  (counterexample x/|x| on R \ {0}). This proof inherits the
  epistemic chain MVT → Rolle → EVT + Fermat.
