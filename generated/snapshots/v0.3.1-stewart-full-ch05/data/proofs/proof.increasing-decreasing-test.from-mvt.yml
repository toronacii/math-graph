sketch:
  es:
    text: >
      Sean x₁ < x₂ en I. Por el TVM existe c entre x₁ y x₂ con
      f(x₂) − f(x₁) = f'(c)(x₂ − x₁). Si f'(c) > 0 y x₂ − x₁ > 0,
      el lado derecho es positivo, así que f(x₁) < f(x₂); f es
      creciente. El caso f' < 0 es análogo.
    is_original: true
    origin: original
    review_status: unreviewed

