schema_version: "0.3.1"
id: proof.increasing-decreasing-test.from-mvt
type: proof
status: extracted

proves: proposition.increasing-decreasing-test
style: direct-from-mvt

uses: []

parts:
  - name: case-positive-derivative
    kind: subclaim
    description: >
      Suppose f'(x) > 0 on the interval I. Take any x₁, x₂ in I with
      x₁ < x₂. By the definition of increasing function, we must
      show f(x₁) < f(x₂). Since f is differentiable on I (a
      requirement of f'(x) > 0 making sense), it is differentiable
      on (x₁, x₂) and continuous on [x₁, x₂] (differentiable implies
      continuous). The Mean Value Theorem yields a c with
      x₁ < c < x₂ such that f(x₂) − f(x₁) = f'(c)(x₂ − x₁). The
      hypothesis gives f'(c) > 0, and x₂ − x₁ > 0, so the right side
      is positive: f(x₂) − f(x₁) > 0, i.e. f(x₁) < f(x₂). Hence f is
      increasing on I.
    uses:
      - id: theorem.mean-value-theorem
        role: essential
        confidence: high
      - id: theorem.differentiable-implies-continuous
        role: essential
        confidence: high
      - id: definition.increasing-function
        role: definition
        confidence: high

  - name: case-negative-derivative
    kind: subclaim
    description: >
      The case f'(x) < 0 is symmetric: same argument with the
      inequality reversed gives f(x₂) − f(x₁) < 0, hence f is
      decreasing on I. (Equivalently, apply part (a) to −f.)
    uses:
      - id: theorem.mean-value-theorem
        role: essential
        confidence: high
      - id: definition.decreasing-function
        role: definition
        confidence: high

