  - id: theorem.ftc-part-1
    role: essential
    confidence: high
    notes: >
      TFC1 establishes that g(x) = ∫_a^x f(t) dt satisfies g'(x) = f(x),
      making it an antiderivative — the key bridge to TFC2.
  - id: corollary.derivatives-equal-implies-differ-by-constant
    role: essential
    confidence: high
    notes: >
      Since F' = g' = f, the corollary gives F(x) = g(x) + C for some constant C.
