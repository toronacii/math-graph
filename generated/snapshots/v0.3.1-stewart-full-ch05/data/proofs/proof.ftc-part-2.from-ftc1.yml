sketch:
  es:
    text: >
      Sea g(x) = ∫_a^x f(t) dt. Por TFC1, g'(x) = f(x), así que g es
      una antiderivada de f. Si F es cualquier antiderivada de f, entonces
      F' = g' = f, luego por el corolario F(x) = g(x) + C para alguna
      constante C.
      Por tanto F(b) − F(a) = [g(b) + C] − [g(a) + C] = g(b) − g(a)
      = ∫_a^b f(t) dt − 0 = ∫_a^b f(x) dx.
