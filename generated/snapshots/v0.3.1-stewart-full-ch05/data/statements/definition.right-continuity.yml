statement:
  natural:
    es:
      text: >
        Una función f es continua por la derecha de un número x = a
        si lím_{x→a⁺} f(x) = f(a).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        A function f is right-continuous at a number x = a if
        lim_{x→a⁺} f(x) = f(a).
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f \text{ right-continuous at } a
      \iff \lim_{x \to a^{+}} f(x) = f(a)
    status: present
    review_status: unreviewed

