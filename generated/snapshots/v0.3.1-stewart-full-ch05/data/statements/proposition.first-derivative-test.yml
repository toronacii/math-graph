statement:
  natural:
    es:
      text: >
        Supongamos que c es un número crítico de una función continua
        f. a) Si f' cambia de positiva a negativa en c, entonces f
        tiene un máximo local en c. b) Si f' cambia de negativa a
        positiva en c, entonces f tiene un mínimo local en c. c) Si
        f' no cambia de signo en c (positiva por ambos lados o
        negativa por ambos lados), entonces f no tiene máximo ni
        mínimo local en c.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        Suppose that c is a critical number of a continuous function
        f. (a) If f' changes from positive to negative at c, then f
        has a local maximum at c. (b) If f' changes from negative to
        positive at c, then f has a local minimum at c. (c) If f'
        does not change sign at c (positive on both sides or negative
        on both sides), then f has neither a local maximum nor a
        local minimum at c.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      c \text{ critical, } f \text{ continuous near } c:\quad
      \text{sign change }(+\to-) \Rightarrow \text{local max};\;
      (-\to+) \Rightarrow \text{local min};\;
      \text{no sign change} \Rightarrow \text{no local extremum}
    status: informal
    review_status: unreviewed

