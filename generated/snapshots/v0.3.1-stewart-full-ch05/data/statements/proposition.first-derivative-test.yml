notes: >
  Stewart §4.3 page 291. "Cambia de signo en c" is informal; the
  intended meaning is: there exists δ > 0 such that f' has constant
  sign on (c−δ, c) and constant (opposite, or same in case c) sign
  on (c, c+δ). Stewart's exercise 87 exhibits a function whose
  derivative changes sign infinitely often near the critical
  point — outside the scope of this test. The continuity hypothesis
  on f handles the case where c is in the domain but f' may not
  exist at c. LaTeX status informal because the sign-change clause
  is not given in symbolic form by Stewart.
