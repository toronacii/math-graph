notes: >
  Stewart's Eq 5. Closes (modulo the natural-log derivative debt
  to §3.6) the f'(0) computation that was open in
  theorem.exponential-derivative-proportional: f'(0) = ln a.
  Stewart explicitly cautions not to confuse this with the power
  rule (here x is the exponent, not the base).
