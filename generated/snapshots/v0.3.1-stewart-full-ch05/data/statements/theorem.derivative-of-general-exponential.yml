statement:
  natural:
    es:
      text: >
        Para cualquier base a > 0, la derivada de la función
        exponencial a^x es (d/dx) a^x = a^x · ln a.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        For any base a > 0, the derivative of the exponential
        function a^x is (d/dx) a^x = a^x · ln a.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \frac{d}{dx}\,a^{x} \;=\; a^{x}\,\ln a \qquad (a > 0)
    status: present
    review_status: unreviewed

