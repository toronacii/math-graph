notes: >
  Stewart §4.2 page 284. Historical note: published 1691 by Michel
  Rolle. Stewart presents Rolle as the technical lemma underlying
  the Mean Value Theorem. Proof structure has three cases keyed on
  whether f is constant, attains a value above f(a), or attains a
  value below f(a) — the last two cases route through the Extreme
  Value Theorem and Fermat's Theorem.
