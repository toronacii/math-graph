statement:
  natural:
    es:
      text: >
        Si f es una función que satisface las siguientes tres
        hipótesis: (1) f es continua sobre el intervalo cerrado
        [a, b]; (2) f es derivable sobre el intervalo abierto
        (a, b); (3) f(a) = f(b); entonces hay un número c en
        (a, b) tal que f'(c) = 0.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        Let f be a function satisfying the three hypotheses:
        (1) f is continuous on the closed interval [a, b];
        (2) f is differentiable on the open interval (a, b);
        (3) f(a) = f(b). Then there is a number c in (a, b)
        such that f'(c) = 0.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f \in C([a,b]) \;\wedge\; f \in D((a,b)) \;\wedge\; f(a) = f(b)
      \;\implies\; \exists c \in (a,b):\; f'(c) = 0
    status: present
    review_status: unreviewed

