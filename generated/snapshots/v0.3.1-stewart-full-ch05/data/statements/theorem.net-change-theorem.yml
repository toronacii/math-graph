notes: >
  Atomic decision: kept separate from theorem.ftc-part-2 because Stewart
  gives it an explicit named box and the semantic framing (rate → net change)
  is educationally and physically distinct from the "antiderivative evaluation"
  framing of TFC2. Examples in §5.4: water flow, population growth, cost
  marginal, displacement of a particle. The generality edge (equivalent)
  records the mathematical identity without collapsing the two nodes.
