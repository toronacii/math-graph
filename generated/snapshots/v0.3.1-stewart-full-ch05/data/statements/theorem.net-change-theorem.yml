statement:
  natural:
    es:
      text: >
        La integral de una razón de cambio es el cambio neto:
        ∫_a^b F'(x) dx = F(b) − F(a).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The integral of a rate of change is the net change:
        ∫_a^b F'(x) dx = F(b) − F(a).
      is_original: false
      origin: llm
      generated_by: "llm:claude-sonnet-4-6"
      review_status: unreviewed
  latex:
    body: |
      \int_a^b F'(x)\,dx = F(b) - F(a)
    status: present
    review_status: unreviewed

proved_by: []

depends_on:
  - id: theorem.ftc-part-2
    role: uses_concept
    confidence: high
    notes: >
      The Net Change Theorem IS TFC2 restated: letting f = F' and F be any
      antiderivative recovers TFC2 exactly. The conceptual framing differs:
      TFC2 says "compute ∫f by finding an antiderivative F"; NCT says
      "interpret ∫F' as the total accumulated change in F".
  - id: definition.definite-integral
    role: uses_concept
    confidence: high

