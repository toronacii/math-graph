notes: >
  Bundled node consistent with the inverse-trig bundle policy
  (carried from Ch1/Ch2 epistemic debt). Stewart proves arcsin
  and arctan inline by implicit differentiation; the other four
  are exercises 64 and follow the same technique. Stewart also
  notes a hidden hypothesis: that the inverse function of a
  one-to-one differentiable function is itself differentiable
  (except where the tangent is vertical) — recorded as
  dependency_confidence:medium. The csc⁻¹ and sec⁻¹ formulas
  depend on the chosen branch convention.
