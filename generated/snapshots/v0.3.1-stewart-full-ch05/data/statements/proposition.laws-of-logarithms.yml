statement:
  natural:
    es:
      text: >
        Si x > 0 e y > 0, y r es un número real cualquiera, entonces:
        (1) logₐ(xy) = logₐ x + logₐ y;
        (2) logₐ(x/y) = logₐ x − logₐ y;
        (3) logₐ(xʳ) = r · logₐ x.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If x > 0 and y > 0, and r is any real number, then:
        (1) logₐ(xy) = logₐ x + logₐ y;
        (2) logₐ(x/y) = logₐ x − logₐ y;
        (3) logₐ(xʳ) = r · logₐ x.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \log_a(xy) = \log_a x + \log_a y, \quad
      \log_a\!\tfrac{x}{y} = \log_a x - \log_a y, \quad
      \log_a(x^{r}) = r \log_a x
    status: present
    review_status: unreviewed

