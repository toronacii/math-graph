statement:
  natural:
    es:
      text: >
        Supongamos que f'' es continua cerca de c. a) Si f'(c) = 0
        y f''(c) > 0, entonces f tiene un mínimo local en c. b) Si
        f'(c) = 0 y f''(c) < 0, entonces f tiene un máximo local en
        c.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        Suppose f'' is continuous near c. (a) If f'(c) = 0 and
        f''(c) > 0, then f has a local minimum at c. (b) If f'(c) = 0
        and f''(c) < 0, then f has a local maximum at c.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f'' \text{ continuous near } c,\ f'(c) = 0:\quad
      f''(c) > 0 \Rightarrow \text{local min at } c;\quad
      f''(c) < 0 \Rightarrow \text{local max at } c
