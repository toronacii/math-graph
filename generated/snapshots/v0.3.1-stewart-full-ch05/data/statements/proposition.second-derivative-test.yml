notes: >
  Stewart §4.3 page 295. Stewart explicitly notes the test is
  inconclusive when f''(c) = 0 (Example 6: x⁴ − 4x³ at x = 0 is not
  an extremum despite f''(0) = 0; for x⁴ at 0 it IS an extremum but
  f''(0) = 0 — so neither outcome can be deduced) and also fails
  when f''(c) does not exist; in those cases the First Derivative
  Test is the fallback. Critical numbers where f'(c) does not exist
  are likewise outside the scope of this test.
