notes: >
  Stewart §4.3 page 290 ("Prueba C/D"). Direct corollary of the Mean
  Value Theorem. The converse fails in general: f increasing does
  not imply f'(x) > 0 (e.g., f(x) = x³ is strictly increasing on R
  but f'(0) = 0). Exercise 85 generalizes the test to allow f' = 0
  at a single point in I.
