statement:
  natural:
    es:
      text: >
        a) Si f'(x) > 0 sobre un intervalo, entonces f es creciente
        sobre ese intervalo. b) Si f'(x) < 0 sobre un intervalo,
        entonces f es decreciente sobre ese intervalo.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        (a) If f'(x) > 0 on an interval, then f is increasing on that
        interval. (b) If f'(x) < 0 on an interval, then f is
        decreasing on that interval.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \bigl(\forall x \in I:\ f'(x) > 0\bigr) \implies f \text{ increasing on } I
      \quad\wedge\quad
      \bigl(\forall x \in I:\ f'(x) < 0\bigr) \implies f \text{ decreasing on } I
    status: present
    review_status: unreviewed

