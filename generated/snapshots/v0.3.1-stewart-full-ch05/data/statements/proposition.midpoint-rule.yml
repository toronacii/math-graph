notes: >
  Numerical approximation schema. In practice the Midpoint Rule gives a
  better approximation than either the left- or right-endpoint Riemann sums
  for a given n (the error is O(1/n²) for smooth f vs O(1/n) for endpoint
  sums). Error analysis appears in Stewart §7.7 (Simpson's Rule, Trapezoidal
  Rule, Midpoint Rule error bounds). No formal proof obligation; correctness
  follows from the definition of the integral.
