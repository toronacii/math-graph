statement:
  natural:
    es:
      text: >
        ∫_a^b f(x) dx ≈ Σᵢ₌₁ⁿ f(x̄ᵢ)Δx = Δx[f(x̄₁) + ··· + f(x̄ₙ)]
        donde Δx = (b − a)/n y x̄ᵢ = (xᵢ₋₁ + xᵢ)/2 es el punto medio
        del i-ésimo subintervalo [xᵢ₋₁, xᵢ].
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        ∫_a^b f(x) dx ≈ Σᵢ₌₁ⁿ f(x̄ᵢ)Δx = Δx[f(x̄₁) + ··· + f(x̄ₙ)]
        where Δx = (b − a)/n and x̄ᵢ = (xᵢ₋₁ + xᵢ)/2 is the midpoint
        of the i-th subinterval [xᵢ₋₁, xᵢ].
      is_original: false
      origin: llm
      generated_by: "llm:claude-sonnet-4-6"
      review_status: unreviewed
  latex:
    body: |
      \int_a^b f(x)\,dx
        \;\approx\; \sum_{i=1}^{n} f(\bar{x}_i)\,\Delta x
        = \Delta x\bigl[f(\bar{x}_1)+\cdots+f(\bar{x}_n)\bigr],
      \quad \bar{x}_i = \tfrac{1}{2}(x_{i-1}+x_i)
    status: present
    review_status: unreviewed

