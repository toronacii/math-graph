statement:
  natural:
    es:
      text: >
        Si f'(x) = g'(x) para toda x en un intervalo (a, b), entonces
        f − g es constante sobre (a, b); esto es, f(x) = g(x) + c
        donde c es una constante.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If f'(x) = g'(x) for all x in an interval (a, b), then f − g
        is constant on (a, b); that is, f(x) = g(x) + c where c is a
        constant.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \bigl(\forall x \in (a,b):\; f'(x) = g'(x)\bigr) \;\implies\;
      \exists c \in \mathbb{R}:\; \forall x \in (a,b),\; f(x) = g(x) + c
    status: present
