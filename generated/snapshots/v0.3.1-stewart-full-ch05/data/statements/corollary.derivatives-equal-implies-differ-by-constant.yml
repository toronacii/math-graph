notes: >
  Stewart Corolario 7 §4.2 page 288. This is the formal justification
  for the "+ C" appearing in every general antiderivative (§4.9) and
  every indefinite integral (Ch5). Stewart's Example 6 uses it to
  prove the identity arctan(x) + arccot(x) = π/2 by showing both
  sides have zero derivative and matching at x = 1.
