statement:
  natural:
    es:
      text: >
        Una función f es derivable (diferenciable) en x = a si la
        derivada f'(a) existe; es decir, si el límite del cociente
        de diferencias lím_{h→0} (f(a + h) − f(a))/h existe y es
        finito.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        A function f is differentiable at x = a if the derivative
        f'(a) exists; that is, if the limit of the difference
        quotient lim_{h→0} (f(a + h) − f(a))/h exists and is
        finite.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f \text{ is differentiable at } a
        \;\Longleftrightarrow\;
      \lim_{h \to 0} \frac{f(a + h) - f(a)}{h} \text{ exists}
    status: present
    review_status: unreviewed

