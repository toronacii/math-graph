statement:
  natural:
    es:
      text: >
        La notación ∫ f(x) dx = F(x) significa que F'(x) = f(x), es
        decir, F es una antiderivada de f. Una integral indefinida
        representa una familia de funciones (una antiderivada para cada
        valor de la constante C). Por convención, toda fórmula para una
        integral indefinida general es válida sólo sobre un intervalo.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The notation ∫ f(x) dx = F(x) means F'(x) = f(x), i.e., F is an
        antiderivative of f. An indefinite integral represents a family of
        functions (one antiderivative for each value of the constant C).
        By convention, every formula for a general indefinite integral is
        valid only on an interval.
      is_original: false
      origin: llm
      generated_by: "llm:claude-sonnet-4-6"
      review_status: unreviewed
  latex:
    body: |
      \int f(x)\,dx = F(x) + C
      \quad\text{means}\quad F'(x) = f(x)
    status: present
    review_status: unreviewed

