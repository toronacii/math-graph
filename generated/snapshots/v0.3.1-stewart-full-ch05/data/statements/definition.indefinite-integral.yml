depends_on:
  - id: definition.antiderivative
    role: extends
    confidence: high
    notes: >
      The indefinite integral is the same mathematical concept as the
      antiderivative (§4.9), re-expressed with integral notation and
      emphasising the family-of-functions aspect. The two definitions are
      logically equivalent; the notation ∫ f dx = F + C is introduced here
      to connect antiderivatives to the definite integral via TFC2.
  - id: theorem.general-antiderivative
    role: uses_concept
    confidence: high
    notes: >
      Justifies the "+ C" in ∫ f dx = F + C: any two antiderivatives of f
      differ by a constant on an interval.

