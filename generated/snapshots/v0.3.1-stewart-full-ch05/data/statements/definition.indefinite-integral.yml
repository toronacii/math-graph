notes: >
  Atomic decision: definition.antiderivative (§4.9) and
  definition.indefinite-integral (§5.4) are kept as SEPARATE nodes because
  they differ in framing and context: antiderivative is introduced as a
  function F with F' = f in the context of reverse differentiation, while
  indefinite integral introduces Leibniz notation ∫ f dx and explicitly ties
  antiderivatives to TFC2. The mathematical content is the same; the depends_on
  edge (extends) records this relationship.
  Stewart's key warning (highlighted in the book): a definite integral ∫_a^b f dx
  is a NUMBER, whereas an indefinite integral ∫ f dx is a FUNCTION (or family).
