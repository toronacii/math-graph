statement:
  natural:
    es:
      text: >
        Si f es una función que satisface las hipótesis: (1) f es
        continua sobre el intervalo cerrado [a, b]; (2) f es
        derivable sobre el intervalo abierto (a, b); entonces existe
        un número c en (a, b) tal que f'(c) = (f(b) − f(a)) / (b − a),
        o, equivalentemente, f(b) − f(a) = f'(c) (b − a).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        Let f be a function satisfying: (1) f is continuous on the
        closed interval [a, b]; (2) f is differentiable on the open
        interval (a, b). Then there exists a number c in (a, b) such
        that f'(c) = (f(b) − f(a)) / (b − a), equivalently
        f(b) − f(a) = f'(c) (b − a).
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f \in C([a,b]) \;\wedge\; f \in D((a,b)) \;\implies\;
      \exists c \in (a,b):\; f'(c) = \frac{f(b) - f(a)}{b - a}
    status: present
    review_status: unreviewed

