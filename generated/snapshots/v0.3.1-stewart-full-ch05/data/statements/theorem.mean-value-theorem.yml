notes: >
  Stewart §4.2 page 285, attributed to Joseph Louis Lagrange.
  Geometric interpretation: at some interior point c the tangent
  line is parallel to the secant line through (a, f(a)), (b, f(b)).
  Kinematic reading: instantaneous velocity equals average velocity
  at some moment in the interval. This theorem is the central
  workhorse of Ch4 — it powers theorem.derivative-zero-implies-
  constant, the increasing/decreasing tests of §4.3, and the
  evaluation theorem of Ch5.
