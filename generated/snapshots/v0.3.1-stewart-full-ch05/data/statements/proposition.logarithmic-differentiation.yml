statement:
  natural:
    es:
      text: >
        Para hallar la derivada de una función y = f(x) que
        comprende productos, cocientes o potencias, se puede
        proceder así: (1) tomar logaritmos naturales de ambos
        lados de la ecuación y aplicar las leyes de los logaritmos
        para simplificar; (2) derivar implícitamente respecto a x;
        (3) resolver la ecuación resultante para y'. Si f(x) puede
        ser negativa, se trabaja con ln|y| = ln|f(x)|.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        To find the derivative of a function y = f(x) involving
        products, quotients, or powers one may proceed as follows:
        (1) take natural logarithms of both sides and apply the
        laws of logarithms to simplify; (2) differentiate
        implicitly with respect to x; (3) solve the resulting
        equation for y'. If f(x) can be negative, work instead
        with ln|y| = ln|f(x)|.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \text{(1) } \ln|y| = \ln|f(x)| \quad\Longrightarrow\quad
      \text{(2) } \frac{y'}{y} = \frac{d}{dx}\,\ln|f(x)| \quad\Longrightarrow\quad
      \text{(3) } y' = y\cdot\frac{d}{dx}\,\ln|f(x)|
    status: present
    review_status: unreviewed

