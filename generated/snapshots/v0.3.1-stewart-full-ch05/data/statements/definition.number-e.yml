notes: >
  Stewart had introduced e informally in §1.5 and now provides
  the operational definition via the limit. Existence/uniqueness
  of such an a between 2 and 3 is asserted but not rigorously
  proved (relies on intuitive monotonic dependence of f'(0) on
  the base a). This is open epistemic debt — flagged as
  dependency_confidence:medium. A rigorous derivation requires
  the exponential function as a power series or the inverse of
  the natural log; both are outside Stewart's scope.
