statement:
  natural:
    es:
      text: >
        e es el número tal que lím_{h→0} (e^h − 1)/h = 1.
        Geométricamente, es la base a > 0 para la cual la recta
        tangente a y = a^x en (0, 1) tiene pendiente exactamente 1.
        Aproximadamente e ≈ 2.71828.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        e is the number such that lim_{h→0} (e^h − 1)/h = 1.
        Geometrically, e is the base a > 0 for which the tangent
        line to y = a^x at (0, 1) has slope exactly 1.
        Approximately e ≈ 2.71828.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \lim_{h \to 0} \frac{e^{h} - 1}{h} \;=\; 1
