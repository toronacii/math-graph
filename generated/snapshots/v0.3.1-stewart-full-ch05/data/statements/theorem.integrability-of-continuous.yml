statement:
  natural:
    es:
      text: >
        Si f es continua sobre [a, b], o si f tiene sólo un número finito
        de discontinuidades de salto, entonces f es integrable sobre [a, b];
        es decir, la integral definida ∫_a^b f(x) dx existe.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If f is continuous on [a, b], or if f has only a finite number of
        jump discontinuities, then f is integrable on [a, b]; that is, the
        definite integral ∫_a^b f(x) dx exists.
      is_original: false
      origin: llm
      generated_by: "llm:claude-sonnet-4-6"
      review_status: unreviewed
  latex:
    body: |
      f \in C([a,b]) \;\text{or } f \text{ has finitely many jump discontinuities}
      \;\implies\; \int_a^b f(x)\,dx \text{ exists}
    status: present
    review_status: unreviewed

