notes: >
  Stewart states this without proof: "Se demuestra en cursos más avanzados."
  The proof requires uniform continuity (which itself follows from continuity
  on a compact interval) and the completeness of ℝ. Both of these appear in
  Rudin Ch4-6. No proof node is created here; deferred indefinitely.
  The extension to finitely many jump discontinuities follows because removing
  finitely many points from a partition does not change the limit.
