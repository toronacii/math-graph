notes: >
  Preliminary/pedagogical definition introduced in §5.1 before the formal
  definition of the definite integral in §5.2. Restricted to continuous
  f(x) ≥ 0. Stewart shows (via examples) that both left-endpoint and
  right-endpoint sums converge to the same limit, motivating the general
  definition. This node captures the area interpretation; the full generality
  (net area for sign-changing f) lives in definition.definite-integral.
