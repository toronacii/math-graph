statement:
  natural:
    es:
      text: >
        El área A de la región S que se encuentra bajo la gráfica de la
        función continua f (donde f(x) ≥ 0) es el límite de la suma de
        las áreas de los rectángulos de aproximación:
        A = lím_{n→∞} R_n = lím_{n→∞} [f(x₁)Δx + f(x₂)Δx + ··· + f(xₙ)Δx]
        donde Δx = (b − a)/n y xᵢ = a + i·Δx son los puntos extremos
        derechos de los subintervalos.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The area A of the region S lying under the graph of a continuous
        function f (with f(x) ≥ 0) is the limit of the sum of the areas
        of the approximating rectangles:
        A = lim_{n→∞} R_n = lim_{n→∞} [f(x₁)Δx + f(x₂)Δx + ··· + f(xₙ)Δx]
        where Δx = (b − a)/n and xᵢ = a + i·Δx are the right endpoints
        of the subintervals.
      is_original: false
      origin: llm
      generated_by: "llm:claude-sonnet-4-6"
      review_status: unreviewed
  latex:
    body: |
      A = \lim_{n \to \infty} R_n
        = \lim_{n \to \infty} \sum_{i=1}^{n} f(x_i)\,\Delta x,
      \quad \Delta x = \frac{b-a}{n},\quad x_i = a + i\,\Delta x
    status: present
    review_status: unreviewed

