notes: >
  Stewart presents this as a boxed reinterpretation rather than a
  numbered theorem, but it is a substantive proposition: it asserts
  that two independently introduced limits — the tangent slope of
  Def 1 (§2.7) and the derivative of Def 4 (§2.7) — are the same
  number. The proof is purely definitional (both unfold to the same
  difference-quotient limit), but the identification deserves an
  explicit graph node because all subsequent geometric interpretations
  of the derivative depend on it.
