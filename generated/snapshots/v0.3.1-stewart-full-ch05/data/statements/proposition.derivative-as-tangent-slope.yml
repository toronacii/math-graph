statement:
  natural:
    es:
      text: >
        La recta tangente a y = f(x) en (a, f(a)) es la recta que
        pasa por (a, f(a)) cuya pendiente es igual a f'(a), la
        derivada de f en x = a. En consecuencia, la ecuación
        punto-pendiente de la recta tangente puede escribirse como
        y − f(a) = f'(a)·(x − a).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The tangent line to y = f(x) at (a, f(a)) is the line
        through (a, f(a)) whose slope equals f'(a), the derivative
        of f at x = a. Consequently, the point-slope equation of
        the tangent line can be written as
        y − f(a) = f'(a)·(x − a).
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      m_{\text{tan}} \;=\; f'(a),
        \qquad y - f(a) \;=\; f'(a)\,(x - a)
    status: present
    review_status: unreviewed

