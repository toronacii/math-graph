statement:
  natural:
    es:
      text: >
        El rango de una función f con dominio D es el conjunto de
        valores f(x) para x en D, esto es, {f(x) : x ∈ D}.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The range of a function f with domain D is the set of values
        f(x) for x in D, that is, {f(x) : x ∈ D}.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
