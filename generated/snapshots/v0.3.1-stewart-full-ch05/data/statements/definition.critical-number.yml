statement:
  natural:
    es:
      text: >
        Un número crítico de una función f es un número c en el
        dominio de f tal que f'(c) = 0 o f'(c) no existe.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        A critical number of a function f is a number c in the
        domain of f such that either f'(c) = 0 or f'(c) does not
        exist.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      c \in D \;\text{ is critical} \iff f'(c) = 0 \;\vee\; f'(c) \text{ does not exist}
