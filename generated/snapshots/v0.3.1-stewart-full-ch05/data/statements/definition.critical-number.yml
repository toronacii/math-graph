notes: >
  Stewart Definition 6 (page 277). Critical number lumps two
  distinct conditions (f'(c) = 0 vs f'(c) undefined) into one
  concept; this is intentional — it captures the union of "places
  where Fermat's theorem might apply or might fail to detect". The
  more granular distinction (stationary point vs singular point)
  is not made by Stewart and is not modeled here.
