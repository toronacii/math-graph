    es:
      text: >
        El logaritmo natural es la función logarítmica de base e,
        denotada ln; esto es, ln x = logₑ x.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The natural logarithm is the logarithmic function with base
        e, denoted ln; that is, ln x = logₑ x.
