notes: >
  Named after Bernhard Riemann (1826–1866). Stewart introduces this in §5.2
  and credits Riemann. The definite integral (definition.definite-integral) is
  defined as the limit of Riemann sums as n → ∞ (max Δxᵢ → 0). Rudin Ch6
  develops the Riemann-Stieltjes integral, which strictly generalises this.
