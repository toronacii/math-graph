statement:
  natural:
    es:
      text: >
        Sea f una función definida sobre [a, b]. Se divide [a, b] en n
        subintervalos de anchos Δxᵢ y se elige un punto muestra xᵢ* en
        el i-ésimo subintervalo [xᵢ₋₁, xᵢ]. La suma de Riemann de f
        correspondiente a esta partición y elección de puntos muestra es
        Σᵢ₌₁ⁿ f(xᵢ*)Δxᵢ.
        Para subintervalos de igual ancho Δx = (b − a)/n, la suma se
        escribe Σᵢ₌₁ⁿ f(xᵢ*)Δx.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        Let f be a function defined on [a, b]. Partition [a, b] into n
        subintervals of widths Δxᵢ and choose a sample point xᵢ* in the
        i-th subinterval [xᵢ₋₁, xᵢ]. The Riemann sum of f for this
        partition and choice of sample points is
        Σᵢ₌₁ⁿ f(xᵢ*)Δxᵢ.
        For equal-width subintervals Δx = (b − a)/n the sum is written
        Σᵢ₌₁ⁿ f(xᵢ*)Δx.
      is_original: false
      origin: llm
      generated_by: "llm:claude-sonnet-4-6"
      review_status: unreviewed
  latex:
    body: |
      \sum_{i=1}^{n} f(x_i^*)\,\Delta x_i,
      \quad x_i^* \in [x_{i-1}, x_i]
    status: present
    review_status: unreviewed

