notes: >
  A practical computational shortcut: symmetric limits [−a, a] combined with
  even or odd symmetry halves (or eliminates) the integration work. The two
  parts are bundled in one node following Stewart's box; splitting would be
  possible but adds no analytical value since they share proof structure and
  context.
