statement:
  natural:
    es:
      text: >
        Suponga que f es continua sobre [−a, a].
        (a) Si f es par [f(−x) = f(x)], entonces
            ∫_{-a}^a f(x) dx = 2 ∫_0^a f(x) dx.
        (b) Si f es impar [f(−x) = −f(x)], entonces
            ∫_{-a}^a f(x) dx = 0.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        Suppose f is continuous on [−a, a].
        (a) If f is even [f(−x) = f(x)], then
            ∫_{-a}^a f(x) dx = 2 ∫_0^a f(x) dx.
        (b) If f is odd [f(−x) = −f(x)], then
            ∫_{-a}^a f(x) dx = 0.
      is_original: false
      origin: llm
      generated_by: "llm:claude-sonnet-4-6"
      review_status: unreviewed
  latex:
    body: |
      f \in C([-a,a]):\quad
      f(-x)=f(x)\;\Rightarrow\;\int_{-a}^{a}f(x)\,dx = 2\int_0^a f(x)\,dx;\\
      f(-x)=-f(x)\;\Rightarrow\;\int_{-a}^{a}f(x)\,dx = 0
    status: present
    review_status: unreviewed

