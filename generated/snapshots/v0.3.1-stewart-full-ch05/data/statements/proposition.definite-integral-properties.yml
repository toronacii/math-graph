notes: >
  Type-B bundle: Stewart presents Properties 1–5 as a named group. They are
  closely related linearity/additivity rules that are always used together.
  Splitting further (one node per property) would produce five near-identical
  nodes with no clear analytic gain. Accepted as deliberate bundle debt.
  Property 2 has a brief inline derivation using the limit-of-a-sum; the
  others are analogous. No separate proof node created.
  Properties 6–8 (comparison properties) are in a separate node
  proposition.definite-integral-bound, where Property 8 has an explicit proof.
