statement:
  natural:
    es:
      text: >
        Suponiendo que f y g son funciones continuas, se tienen las
        siguientes propiedades de la integral definida:
        1. ∫_a^b c dx = c(b − a), donde c es cualquier constante.
        2. ∫_a^b [f(x) + g(x)] dx = ∫_a^b f(x) dx + ∫_a^b g(x) dx.
        3. ∫_a^b c·f(x) dx = c·∫_a^b f(x) dx, donde c es cualquier constante.
        4. ∫_a^b [f(x) − g(x)] dx = ∫_a^b f(x) dx − ∫_a^b g(x) dx.
        5. ∫_a^c f(x) dx + ∫_c^b f(x) dx = ∫_a^b f(x) dx.
        Además: ∫_b^a f(x) dx = −∫_a^b f(x) dx y ∫_a^a f(x) dx = 0.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        Assuming f and g are continuous functions, the definite integral
        satisfies:
        1. ∫_a^b c dx = c(b − a) for any constant c.
        2. ∫_a^b [f(x) + g(x)] dx = ∫_a^b f(x) dx + ∫_a^b g(x) dx.
        3. ∫_a^b c·f(x) dx = c·∫_a^b f(x) dx for any constant c.
        4. ∫_a^b [f(x) − g(x)] dx = ∫_a^b f(x) dx − ∫_a^b g(x) dx.
        5. ∫_a^c f(x) dx + ∫_c^b f(x) dx = ∫_a^b f(x) dx.
        Also: ∫_b^a f(x) dx = −∫_a^b f(x) dx and ∫_a^a f(x) dx = 0.
      is_original: false
      origin: llm
      generated_by: "llm:claude-sonnet-4-6"
      review_status: unreviewed
  latex:
    body: |
      \int_a^b c\,dx = c(b-a);\quad
      \int_a^b [f+g]\,dx = \int_a^b f\,dx + \int_a^b g\,dx;\quad
      \int_a^b cf\,dx = c\int_a^b f\,dx;\\
      \int_a^c f\,dx + \int_c^b f\,dx = \int_a^b f\,dx;\quad
      \int_b^a f\,dx = -\int_a^b f\,dx;\quad
      \int_a^a f\,dx = 0
    status: present
    review_status: unreviewed

