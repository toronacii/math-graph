statement:
  natural:
    es:
      text: >
        Para hallar los valores máximo y mínimo absolutos de una
        función continua f sobre un intervalo cerrado [a, b]:
        (1) hallar los valores de f en los números críticos de f
        en (a, b);
        (2) hallar los valores de f en los puntos extremos del
        intervalo, f(a) y f(b);
        (3) el más grande de los valores obtenidos en los pasos
        1 y 2 es el máximo absoluto; el más pequeño, el mínimo
        absoluto.
        Este procedimiento es válido porque el teorema del valor
        extremo garantiza la existencia de máximo y mínimo
        absolutos, y todo extremo local en (a, b) ocurre en un
        número crítico (Fermat reformulado).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        To find the absolute maximum and minimum values of a
        continuous function f on a closed interval [a, b]:
        (1) compute f at the critical numbers of f in (a, b);
        (2) compute f at the endpoints, f(a) and f(b);
        (3) the largest of the values from steps 1 and 2 is the
        absolute maximum; the smallest is the absolute minimum.
        This procedure is valid because the extreme value theorem
        guarantees existence of absolute max and min, and every
        interior local extremum occurs at a critical number
        (Fermat reformulated).
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \max_{[a,b]} f, \;\min_{[a,b]} f \;\in\;
      \bigl\{ f(c) : c \text{ critical in } (a,b) \bigr\} \;\cup\; \{ f(a), f(b) \}
    status: present
    review_status: unreviewed

