statement:
  natural:
    es:
      text: >
        La recta x = a se llama asíntota vertical de la curva
        y = f(x) si al menos una de las siguientes afirmaciones es
        verdadera:
        lím_{x→a} f(x) = ∞,
        lím_{x→a⁻} f(x) = ∞,
        lím_{x→a⁺} f(x) = ∞,
        lím_{x→a} f(x) = −∞,
        lím_{x→a⁻} f(x) = −∞,
        lím_{x→a⁺} f(x) = −∞.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The line x = a is called a vertical asymptote of the curve
        y = f(x) if at least one of the following is true:
        lim_{x→a} f(x) = ∞,
        lim_{x→a⁻} f(x) = ∞,
        lim_{x→a⁺} f(x) = ∞,
        lim_{x→a} f(x) = −∞,
        lim_{x→a⁻} f(x) = −∞,
        lim_{x→a⁺} f(x) = −∞.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
