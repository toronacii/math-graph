statement:
  natural:
    es:
      text: >
        Las seis funciones hiperbólicas se definen para todo
        x ∈ ℝ (con las restricciones de dominio indicadas) por:
        senh x = (e^x − e^{−x})/2;
        cosh x = (e^x + e^{−x})/2;
        tanh x = senh(x)/cosh(x);
        csch x = 1/senh(x) (x ≠ 0);
        sech x = 1/cosh(x);
        coth x = cosh(x)/senh(x) (x ≠ 0).
        Domain/range: senh : ℝ → ℝ; cosh : ℝ → [1, ∞);
        tanh : ℝ → (−1, 1).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The six hyperbolic functions are defined for all x ∈ ℝ
        (with the domain restrictions indicated) by:
        sinh x = (e^x − e^{−x})/2;
        cosh x = (e^x + e^{−x})/2;
        tanh x = sinh(x)/cosh(x);
        csch x = 1/sinh(x) (x ≠ 0);
        sech x = 1/cosh(x);
        coth x = cosh(x)/sinh(x) (x ≠ 0).
        Domain/range: sinh : ℝ → ℝ; cosh : ℝ → [1, ∞);
        tanh : ℝ → (−1, 1).
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \sinh x = \frac{e^{x} - e^{-x}}{2},\quad
      \cosh x = \frac{e^{x} + e^{-x}}{2},\quad
      \tanh x = \frac{\sinh x}{\cosh x},\\
      \operatorname{csch} x = \frac{1}{\sinh x}\;(x\neq 0),\quad
      \operatorname{sech} x = \frac{1}{\cosh x},\quad
      \coth x = \frac{\cosh x}{\sinh x}\;(x\neq 0)
    status: present
    review_status: unreviewed

