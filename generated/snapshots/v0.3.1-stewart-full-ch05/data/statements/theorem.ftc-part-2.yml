statement:
  natural:
    es:
      text: >
        Si f es continua sobre [a, b], entonces
        ∫_a^b f(x) dx = F(b) − F(a)
        donde F es cualquier antiderivada de f; es decir, F' = f.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If f is continuous on [a, b], then
        ∫_a^b f(x) dx = F(b) − F(a)
        where F is any antiderivative of f; that is, F' = f.
      is_original: false
      origin: llm
      generated_by: "llm:claude-sonnet-4-6"
      review_status: unreviewed
  latex:
    body: |
      f \in C([a,b]),\; F' = f
      \;\;\Rightarrow\;\;
      \int_a^b f(x)\,dx = F(b) - F(a) = \Bigl[F(x)\Bigr]_a^b
    status: present
    review_status: unreviewed

