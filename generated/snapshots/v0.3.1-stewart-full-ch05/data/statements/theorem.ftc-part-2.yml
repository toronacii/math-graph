notes: >
  Abbreviated TFC2. The central computational theorem of integral calculus:
  it reduces the hard problem of computing a definite integral (an infinite
  limit) to the easy problem of finding any antiderivative and evaluating at
  endpoints. Stewart uses the bracket notation [F(x)]_a^b = F(b) − F(a).
  Historical note: Isaac Barrow (1670), then Newton and Leibniz independently
  discovered and exploited this relationship.
  Multi-source note: Rudin Thm 6.21 states the same result for the
  Riemann-Stieltjes integral with α(x) = x. Future Rudin Ch6 extraction will
  extend this node or create a companion.
  theorem.net-change-theorem is an equivalent restatement emphasising the
  "integral of a rate = net change" interpretation.
