notes: >
  No separate proof — equivalence with theorem.fermat is captured
  in generality. The proof obligation reduces to: if f has local
  extremum at c then either f'(c) exists (apply Fermat to get
  f'(c) = 0, hence c is critical) or f'(c) does not exist (then
  c is critical by definition).
