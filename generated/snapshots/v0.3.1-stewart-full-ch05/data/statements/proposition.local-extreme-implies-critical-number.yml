statement:
  natural:
    es:
      text: >
        Si f tiene un máximo o un mínimo local en c, entonces c es
        un número crítico de f. (Reformulación del teorema de
        Fermat en términos de números críticos: incluye el caso
        f'(c) = 0 — Fermat directo — y el caso f'(c) no existe —
        el extremo aún ocurre en un punto del dominio que satisface
        la definición de número crítico.)
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If f has a local maximum or local minimum at c, then c is
        a critical number of f. (Reformulation of Fermat's theorem
        in terms of critical numbers: covers both the case
        f'(c) = 0 — direct Fermat — and the case where f'(c) fails
        to exist — the extremum still occurs at a point of the
        domain satisfying the critical-number definition.)
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f \text{ has local extremum at } c \implies c \text{ is a critical number of } f
    status: present
    review_status: unreviewed

generality:
  - relation: equivalent
    target: theorem.fermat
    notes: >
      Logically equivalent reformulation under definition.critical-
      number: Fermat states f'(c) = 0 (assuming f'(c) exists);
      this proposition combines the two failure modes of the
      converse (cf. Examples 5–6) into the single notion of critical
      number, so the implication holds without the differentiability
      hypothesis. Stewart §4.1 page 278 writes "compare la
      definición 6 con el teorema 4" to justify the restatement.

