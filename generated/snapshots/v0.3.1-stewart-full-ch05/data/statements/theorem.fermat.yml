        Si f tiene un máximo o un mínimo local en c, y si f'(c)
        existe, entonces f'(c) = 0.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If f has a local maximum or local minimum at c, and if
        f'(c) exists, then f'(c) = 0.
      is_original: false
      origin: llm
