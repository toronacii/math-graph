notes: >
  Stewart Theorem 4 §4.1 page 276. Stewart explicitly warns
  (Examples 5, 6) that the converse is false — f'(c) = 0 does NOT
  imply local extremum (e.g., x³ at 0), and a local extremum can
  occur where f'(c) does not exist (e.g., |x| at 0). These two
  failures motivate definition.critical-number, which encompasses
  both possibilities and is the proper search space for extrema.
  Equivalent reformulation as proposition.local-extreme-implies-
  critical-number tracked separately.
