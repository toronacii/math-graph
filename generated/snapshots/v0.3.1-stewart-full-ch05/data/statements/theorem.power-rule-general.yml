statement:
  natural:
    es:
      text: >
        Si n es cualquier número real, entonces (d/dx)(x^n) =
        n x^{n−1}.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If n is any real number, then (d/dx)(x^n) = n x^{n−1}.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \frac{d}{dx}\,x^{n} \;=\; n\,x^{n-1}\qquad (n \in \mathbb{R})
    status: present
    review_status: unreviewed

