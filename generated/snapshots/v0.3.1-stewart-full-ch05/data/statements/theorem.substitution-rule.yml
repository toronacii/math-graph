notes: >
  The substitution rule is the integration analogue of the chain rule for
  differentiation: it converts ∫f(g(x))g'(x)dx into the simpler ∫f(u)du by
  the substitution u = g(x), du = g'(x)dx. The definite-integral version
  (with transformed limits) is theorem.substitution-rule-definite.
