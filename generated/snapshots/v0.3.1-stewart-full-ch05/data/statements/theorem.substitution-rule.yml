statement:
  natural:
    es:
      text: >
        Si u = g(x) es una función derivable cuyo rango es un intervalo I
        y f es continua sobre I, entonces
        ∫ f(g(x))·g'(x) dx = ∫ f(u) du.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If u = g(x) is a differentiable function whose range is an
        interval I and f is continuous on I, then
        ∫ f(g(x))·g'(x) dx = ∫ f(u) du.
      is_original: false
      origin: llm
      generated_by: "llm:claude-sonnet-4-6"
      review_status: unreviewed
  latex:
    body: |
      \int f(g(x))\,g'(x)\,dx = \int f(u)\,du,
      \quad u = g(x)
    status: present
    review_status: unreviewed

