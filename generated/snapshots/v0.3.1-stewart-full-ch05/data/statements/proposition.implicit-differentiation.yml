statement:
  natural:
    es:
      text: >
        Si una ecuación F(x, y) = 0 define implícitamente a y como
        función derivable de x en una región, la derivada dy/dx
        puede obtenerse derivando ambos miembros de la ecuación
        respecto a x (tratando y como función de x y aplicando la
        regla de la cadena al diferenciar términos en y) y
        despejando dy/dx en la ecuación resultante.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If an equation F(x, y) = 0 implicitly defines y as a
        differentiable function of x in some region, then dy/dx
        can be found by differentiating both sides of the equation
        with respect to x (treating y as a function of x and
        applying the chain rule to terms involving y) and solving
        the resulting equation for dy/dx.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      F(x,y) = 0,\ y = y(x)\text{ derivable}
        \;\Longrightarrow\;
        \frac{dy}{dx}
          = -\,\frac{\partial F/\partial x}{\partial F/\partial y}
        \quad\text{(via chain rule on each term in }y\text{)}
    status: present
    review_status: unreviewed

