notes: >
  Stewart presents this as a METHOD, not a theorem with proof —
  it relies on the (assumed) hypothesis "the equation determines
  y implicitly as a differentiable function of x". The rigorous
  hypothesis (Implicit Function Theorem of multivariable calculus)
  is well outside the scope of single-variable Stewart. Classified
  as proposition with semantic_kind=[schema,principle] to flag its
  methodological nature. semantic_confidence:medium because the
  existence/differentiability hypothesis is left informal.
  proved_by:[] reflects no proof in §3.5; the technique is
  justified case-by-case by chain-rule application.
