epistemic_debt_summary:
  total_weak_proofs: 4
  total_partial_proofs: 2
  total_inherited_weak: 3
  total_implicit_imports: 7
  affected_chain_depth: 8
  new_weak_since_chapter_3: 1
  new_partial_since_chapter_3: 1
  new_implicit_since_chapter_3: 1
  critical_debt: >
    The EVT is now the highest-impact weak dependency. Via the chain
    EVT → Rolle's → MVT, its assumed status propagates to 10+ downstream
    proofs including L'Hopital's rule and the general antiderivative
    theorem. Resolving the completeness axiom would resolve both
    EVT and IVT simultaneously.
