notes: >
  Stewart explicitly warns that ∞ is not a number — the notation is
  shorthand for divergence. The rigorous definition (Definición 4
  in §2.4) is a SEPARATE node. The four one-sided infinite-limit
  variants (lim_{a⁻}=±∞, lim_{a⁺}=±∞) are mentioned briefly in §2.2
  but not given individual definition numbers; they are not
  authored as separate atoms here. They will appear when needed by
  vertical-asymptote applications.
