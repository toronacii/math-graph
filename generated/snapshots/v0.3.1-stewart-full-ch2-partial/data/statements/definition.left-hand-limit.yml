title:
  es:
    text: Límite por la izquierda
    is_original: true
    origin: original
    review_status: unreviewed
  en:
    text: Left-hand limit
    is_original: false
    origin: llm
    generated_by: "llm:claude-opus-4.7"
    review_status: unreviewed

statement:
  natural:
    es:
      text: >
        Cuando escribimos lím_{x→a⁻} f(x) = L decimos que el límite
        izquierdo de f(x) cuando x se aproxima a a (o el límite de
        f(x) cuando x tiende a a por la izquierda) es igual a L si
        podemos hacer que los valores de f(x) se acerquen
        arbitrariamente a L, tanto como queramos, tomando x
        suficientemente cercanos a a, pero menores que a.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        We write lim_{x→a⁻} f(x) = L and say the left-hand limit of
        f(x) as x approaches a (or the limit of f(x) as x approaches
        a from the left) equals L if we can make the values of f(x)
        arbitrarily close to L by taking x sufficiently close to a
        but less than a.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \lim_{x \to a^{-}} f(x) = L
    status: informal
    review_status: unreviewed

