statement:
  natural:
    es:
      text: >
        Si f(x) = g(x) cuando x ≠ a (en algún intervalo abierto
        alrededor de a), entonces lím_{x→a} f(x) = lím_{x→a} g(x),
        siempre que el límite exista.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If f(x) = g(x) when x ≠ a (on some open interval around a),
        then lim_{x→a} f(x) = lim_{x→a} g(x), provided the limit
        exists.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f(x) = g(x) \;\text{para } x \neq a
      \;\;\Longrightarrow\;\;
      \lim_{x \to a} f(x) = \lim_{x \to a} g(x)
    status: present
    review_status: unreviewed

