notes: >
  Locality principle for limits — Stewart states it as a boxed
  fact between Examples 3 and 4. Used in Examples 3, 4, 5, 6 to
  cancel common factors / simplify the expression before
  evaluating. No proof in the main text (it follows directly from
  Definition 1, since the limit only depends on values at x ≠ a).
