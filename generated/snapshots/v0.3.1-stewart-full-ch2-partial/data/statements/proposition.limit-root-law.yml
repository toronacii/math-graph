        Let n be a positive integer. Then
        lim_{x→a} ⁿ√x = ⁿ√a (if n is even, assume a > 0); more
        generally, lim_{x→a} ⁿ√f(x) = ⁿ√(lim_{x→a} f(x)) (if n is
