statement:
  natural:
    es:
      text: >
        Una función f se llama creciente sobre un intervalo I si
        f(x₁) < f(x₂) siempre que x₁ < x₂ en I.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        A function f is called increasing on an interval I if
        f(x₁) < f(x₂) whenever x₁ < x₂ in I.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \forall x_1, x_2 \in I:\; x_1 < x_2 \implies f(x_1) < f(x_2)
    status: present
    review_status: unreviewed

