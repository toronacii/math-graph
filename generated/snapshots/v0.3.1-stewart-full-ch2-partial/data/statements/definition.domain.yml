statement:
  natural:
    es:
      text: >
        El dominio de una función f es el conjunto D de todos los
        elementos a los que f asigna un valor; equivalentemente, es el
        conjunto de entradas admisibles de f.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The domain of a function f is the set D of all elements to
        which f assigns a value; equivalently, the set of admissible
        inputs of f.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
