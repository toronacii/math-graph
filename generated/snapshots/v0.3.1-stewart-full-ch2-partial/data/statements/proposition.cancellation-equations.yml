statement:
  natural:
    es:
      text: >
        Si f es una función uno a uno con dominio A y rango B y f⁻¹
        es su función inversa, entonces f⁻¹(f(x)) = x para todo
        x ∈ A y f(f⁻¹(y)) = y para todo y ∈ B.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If f is a one-to-one function with domain A and range B and
        f⁻¹ is its inverse, then f⁻¹(f(x)) = x for every x ∈ A and
        f(f⁻¹(y)) = y for every y ∈ B.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f^{-1}(f(x)) = x \;\;(x \in A), \qquad
      f(f^{-1}(y)) = y \;\;(y \in B)
