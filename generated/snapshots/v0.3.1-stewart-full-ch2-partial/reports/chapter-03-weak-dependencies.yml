implicit_algebraic_imports:

  # Inherited from Chapters 1-2
  - concept: Real number field axioms
    used_by:
      - definition.function
      - definition.domain
      - definition.range
      - definition.epsilon-delta-limit
      - definition.continuity-at-point
    chapter: "1-2"
    notes: >
      Unchanged. The epsilon-delta definition and continuity assume
      completeness and order properties.

  - concept: Precalculus trigonometry
    used_by:
      - definition.trigonometric-function
      - theorem.limit-sinx-over-x
      - proof.derivative-sin.stewart
      - proof.derivative-cos.stewart
    chapter: "1-3"
    notes: >
      Extended in Chapter 3. The proofs of d/dx(sin x) and d/dx(cos x)
      use the angle addition formulas sin(A+B) and cos(A+B), which
      are imported from precalculus without formal justification.

  - concept: Triangle inequality
    used_by:
      - proof.limit-laws.stewart
    chapter: "2"
    notes: Unchanged.

  - concept: Archimedean property
    used_by:
      - proof.limit-one-over-x-at-infinity.stewart
    chapter: "2"
    notes: Unchanged.

  # New in Chapter 3
  - concept: Binomial theorem
    used_by:
      - proof.power-rule.stewart
    chapter: "3"
    notes: >
      The proof of the power rule for positive integers uses the
      binomial expansion (x+h)^n = sum of binomial coefficients.
      This is a combinatorial result imported without proof.

  - concept: Pythagorean identity (sin²x + cos²x = 1)
    used_by:
      - proof.derivative-tan.stewart
      - proof.derivative-cot.stewart
      - proof.derivative-arcsin.stewart
      - proof.derivative-arccos.stewart
    chapter: "3"
    notes: >
      The proofs of trig and inverse trig derivatives use sin²x + cos²x = 1
      and 1 + tan²x = sec²x to simplify expressions. These identities
      are assumed from precalculus trigonometry.

