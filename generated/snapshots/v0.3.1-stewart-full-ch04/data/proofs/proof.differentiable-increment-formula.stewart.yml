sketch:
  es:
    text: >
      Defina ε(Δx) = Δy/Δx − f'(a) para Δx ≠ 0 y ε(0) = 0.
      Por la definición de derivada, lím_{Δx→0} ε(Δx) =
      lím_{Δx→0} Δy/Δx − f'(a) = f'(a) − f'(a) = 0, así que
      ε es continua en 0. Multiplicando por Δx:
      ε(Δx)·Δx = Δy − f'(a)·Δx, es decir
      Δy = f'(a)·Δx + ε(Δx)·Δx, con ε → 0 cuando Δx → 0.
