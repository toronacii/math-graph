notes: >
  Stewart proves ONLY Law 1 (sum) explicitly in §2.4; Laws 2–5 are
  deferred to Apéndice F and to exercises. This proof node therefore
  uses parts[] with a single 'sum-law' part, scoped to the sum law
  only. dependency_confidence: medium reflects that this proof
  establishes the bundled proposition.limit-laws ONLY in part — the
  bundle remains epistemic debt until either (a) Apéndice F is
  extracted with proofs of the remaining laws, or (b) the bundle is
  split into proposition.limit-{sum,difference,constant-multiple,
  product,quotient}-law atoms. Top-level uses[] is empty per
  template guidance: all dependencies live inside parts[].
