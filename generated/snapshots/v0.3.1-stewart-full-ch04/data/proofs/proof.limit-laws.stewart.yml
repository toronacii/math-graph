sketch:
  es:
    text: >
      Sea ε > 0. Como lím_{x→a} f(x) = L existe δ₁ > 0 tal que
      0 < |x − a| < δ₁ ⇒ |f(x) − L| < ε/2. Análogamente existe
      δ₂ > 0 tal que 0 < |x − a| < δ₂ ⇒ |g(x) − M| < ε/2.
      Tomando δ = mín{δ₁, δ₂}, si 0 < |x − a| < δ entonces, por la
      desigualdad del triángulo, |(f(x) + g(x)) − (L + M)| ≤
      |f(x) − L| + |g(x) − M| < ε/2 + ε/2 = ε. Por tanto
      lím_{x→a} (f + g)(x) = L + M.
    is_original: true
    origin: original
    review_status: unreviewed

