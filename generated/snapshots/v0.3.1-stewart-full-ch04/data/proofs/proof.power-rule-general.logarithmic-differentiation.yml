sketch:
  es:
    text: >
      Sea y = x^n con x ≠ 0. Tomando ln|·| de ambos lados y
      aplicando las leyes de los logaritmos: ln|y| = ln|x|^n =
      n · ln|x|. Derivando implícitamente respecto a x usando
      (d/dx) ln|y| = y'/y y (d/dx) ln|x| = 1/x: y'/y = n/x.
      Despejando y' = n · y/x = n · x^n / x = n · x^{n−1}. El
      caso x = 0 con n ≥ 1 se demuestra directamente desde la
      definición de derivada (Stewart lo nota al margen).
    is_original: true
    origin: original
    review_status: unreviewed

