notes: >
  Closes the §3.1 epistemic debt for theorem.power-rule-general:
  Stewart's promised proof for arbitrary real n via logarithmic
  differentiation. Note: x = 0 boundary case for n ≥ 1 is handled
  separately from the definition of derivative (Stewart's marginal
  remark, p. 221) and is not modeled as a separate proof here.
