sketch:
  es:
    text: >
      Caso máximo. Como f(c) ≥ f(x) para x cerca de c, en
      particular f(c) ≥ f(c + h) para |h| pequeño, así
      f(c + h) − f(c) ≤ 0. Si h > 0 entonces (f(c+h) − f(c))/h ≤ 0;
      tomando límite por derecha y usando monotonía del límite
      (Teorema 2.3.2 de Stewart), f'(c) = lím_{h→0⁺} ≤ 0. Si
      h < 0 entonces (f(c+h) − f(c))/h ≥ 0; el límite por
      izquierda da f'(c) ≥ 0. Como f'(c) existe, los dos límites
      laterales coinciden con f'(c), y la doble desigualdad fuerza
      f'(c) = 0. Caso mínimo: análogo (o aplicar caso máximo a −f
      vía Ej 76).
    is_original: true
    origin: original
    review_status: unreviewed

