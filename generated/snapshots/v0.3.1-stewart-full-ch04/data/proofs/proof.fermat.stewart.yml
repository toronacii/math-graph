schema_version: "0.3.1"
id: proof.fermat.stewart
type: proof
status: extracted

proves: theorem.fermat
style: one-sided-limits

uses: []

parts:
  - name: max-case-right-limit
    kind: subclaim
    description: >
      Suppose f has a local maximum at c, so f(c) ≥ f(c + h) for
      all sufficiently small h. Hence f(c + h) − f(c) ≤ 0. For
      h > 0 small, dividing by h preserves the inequality:
      (f(c + h) − f(c))/h ≤ 0. Taking the right-hand limit (using
      the limit-monotonicity property §2.3.2): f'(c) =
      lim_{h→0⁺} (f(c + h) − f(c))/h ≤ 0.
    uses:
      - id: definition.local-maximum
        role: definition
        confidence: high
      - id: definition.derivative-at-point
        role: definition
        confidence: high
      - id: proposition.limit-monotonicity
        role: essential
        confidence: high
        notes: Stewart cites Theorem 2.3.2 explicitly to pass the inequality through the limit
      - id: definition.right-hand-limit
        role: definition
        confidence: high

  - name: max-case-left-limit
    kind: subclaim
    description: >
      For h < 0 small, dividing by h reverses the inequality:
      (f(c + h) − f(c))/h ≥ 0. Taking the left-hand limit:
      f'(c) = lim_{h→0⁻} (f(c + h) − f(c))/h ≥ 0.
    uses:
      - id: definition.local-maximum
        role: definition
        confidence: high
      - id: definition.derivative-at-point
        role: definition
        confidence: high
      - id: proposition.limit-monotonicity
        role: essential
        confidence: high
      - id: definition.left-hand-limit
        role: definition
        confidence: high

  - name: combine
    kind: subclaim
    description: >
      Since f'(c) exists by hypothesis, both one-sided limits
      equal f'(c). The two inequalities f'(c) ≤ 0 and f'(c) ≥ 0
      force f'(c) = 0.
    uses:
      - id: proposition.limit-exists-iff-one-sided-limits
        role: essential
        confidence: high
        notes: existence of f'(c) requires equality of left and right limits

  - name: min-case
    kind: subclaim
    description: >
      The minimum case is symmetric: replace ≤ by ≥ throughout, or
      apply the maximum case to −f (Stewart Exercise 76 → 77).
    uses:
      - id: definition.local-minimum
        role: definition
        confidence: high
      - id: theorem.constant-multiple-rule-derivative
        role: notation
        confidence: high
        notes: (-f)'(c) = -f'(c) used to reduce the min case to the max case via Ex 76

