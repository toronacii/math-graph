notes: >
  Stewart's proof is fully written for the maximum case; minimum
  case is delegated to Exercises 76–77 with the explicit reduction
  via −f. The proof reactivates proposition.limit-monotonicity
  (Ch2 §2.3 Theorem 2) and proposition.limit-exists-iff-one-sided-
  limits (Ch2 §2.3 Theorem 1), both of which were stated without
  proof in Ch2 (deferred to Apéndice F). This proof is one of the
  earliest in Ch4 to cite Ch2 limit-foundations directly rather
  than going through the derivative-rules abstractions of Ch3.
