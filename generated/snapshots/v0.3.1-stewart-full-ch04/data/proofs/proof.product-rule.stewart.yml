sketch:
  es:
    text: >
      Sean u = f(x), v = g(x). Si x cambia en Δx, los cambios
      en u y v son Δu = f(x+Δx) − f(x), Δv = g(x+Δx) − g(x).
      El nuevo producto es (u+Δu)(v+Δv), de modo que
      Δ(uv) = (u+Δu)(v+Δv) − uv = uΔv + vΔu + ΔuΔv.
      Dividiendo entre Δx:
      Δ(uv)/Δx = u·(Δv/Δx) + v·(Δu/Δx) + Δu·(Δv/Δx).
      Tomando Δx → 0, por la ley de la suma y la del producto,
      (d/dx)(uv) = u·(dv/dx) + v·(du/dx) + 0·(dv/dx)
                 = u·v' + v·u'.
      El término cruzado se anula porque Δu → 0 cuando Δx → 0
      (f es derivable, luego continua). La interpretación
      geométrica de áreas (figura 1) supone u, v > 0, pero el
      álgebra es válida sin restricción de signo.
    is_original: true
    origin: original
    review_status: unreviewed

