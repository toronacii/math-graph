sketch:
  es:
    text: >
      Por definición de valor absoluto, f(x) = ln|x| es ln x si
      x > 0 y ln(−x) si x < 0. En el primer caso f'(x) = 1/x
      directamente. En el segundo caso, por la regla de la cadena,
      f'(x) = (1/(−x)) · (−1) = 1/x. Por tanto f'(x) = 1/x para
      todo x ≠ 0.
