sketch:
  es:
    text: >
      Sea y = log_a x. Por definición de logaritmo, a^y = x.
      Derivando implícitamente respecto a x usando la fórmula
      §3.4 Eq 5 ((d/dx) a^x = a^x ln a) combinada con la regla
      de la cadena: a^y · ln a · (dy/dx) = 1. Despejando,
      dy/dx = 1/(a^y · ln a) = 1/(x · ln a).
    is_original: true
    origin: original
    review_status: unreviewed

