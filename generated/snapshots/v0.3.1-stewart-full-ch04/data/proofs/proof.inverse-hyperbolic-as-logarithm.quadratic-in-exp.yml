sketch:
  es:
    text: >
      Bundle. arcsinh: y = senh⁻¹ x ⇒ x = senh y = (eʸ − e⁻ʸ)/2.
      Multiplicando por eʸ y reordenando: (eʸ)² − 2x(eʸ) − 1 = 0.
      Cuadrática en eʸ con solución eʸ = x ± √(x² + 1); como
      eʸ > 0 y x − √(x² + 1) < 0, eʸ = x + √(x² + 1), luego
      y = ln(x + √(x² + 1)). arccosh y arctanh: técnica análoga,
      con la rama elegida según la convención del dominio.
    is_original: true
    origin: original
    review_status: unreviewed

