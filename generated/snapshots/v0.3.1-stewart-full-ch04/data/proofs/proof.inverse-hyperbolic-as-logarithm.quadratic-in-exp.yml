notes: >
  Bundled proof. Stewart proves arcsinh in Example 3 fully and
  defers arccosh and arctanh to Exercises 26 and 27 with the same
  technique (the alternative method via Ex 9 / Ex 18 is also
  possible but not modeled). The proof requires only algebra and
  the inverse relation between exp and ln — no calculus.
