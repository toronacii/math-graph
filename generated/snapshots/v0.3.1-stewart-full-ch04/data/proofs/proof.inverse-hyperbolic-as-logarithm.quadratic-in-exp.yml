schema_version: "0.3.1"
id: proof.inverse-hyperbolic-as-logarithm.quadratic-in-exp
type: proof
status: extracted

proves: theorem.inverse-hyperbolic-as-logarithm
style: solve-quadratic

uses: []

parts:
  - name: arcsinh-as-log
    kind: subclaim
    description: >
      senh⁻¹ x = ln(x + √(x² + 1)). Let y = senh⁻¹ x, so
      x = (eʸ − e⁻ʸ)/2, i.e. eʸ − 2x − e⁻ʸ = 0. Multiplying by
      eʸ gives e²ʸ − 2x eʸ − 1 = 0, a quadratic in eʸ with
      solutions eʸ = x ± √(x² + 1). Since eʸ > 0 and
      x − √(x² + 1) < 0, the negative branch is rejected, so
      eʸ = x + √(x² + 1) and y = ln(x + √(x² + 1)). Stewart
      Example 3, page 260.
    uses:
      - id: definition.inverse-hyperbolic-function
        role: definition
        confidence: high
      - id: definition.hyperbolic-function
        role: definition
        confidence: high
      - id: definition.natural-logarithm
        role: definition
        confidence: high
        notes: y = ln eʸ used to recover y from eʸ

  - name: arccosh-as-log
    kind: subclaim
    description: >
      cosh⁻¹ x = ln(x + √(x² − 1)) for x ≥ 1, by the analogous
      quadratic e²ʸ − 2x eʸ + 1 = 0. The positive root x + √(x² − 1)
      is selected because the cosh⁻¹ branch convention y ≥ 0
      corresponds to eʸ ≥ 1 ≥ x − √(x² − 1). Stewart Ex 26.
    uses:
      - id: definition.inverse-hyperbolic-function
        role: definition
        confidence: high
      - id: definition.hyperbolic-function
        role: definition
        confidence: high
      - id: definition.natural-logarithm
        role: definition
        confidence: high

  - name: arctanh-as-log
    kind: subclaim
    description: >
      tanh⁻¹ x = ½ ln((1 + x)/(1 − x)) for −1 < x < 1. Let
      y = tanh⁻¹ x, so x = (eʸ − e⁻ʸ)/(eʸ + e⁻ʸ). Solving for
      e²ʸ gives e²ʸ = (1 + x)/(1 − x); taking ln and dividing by
      2 yields the formula. Stewart Ex 27.
    uses:
      - id: definition.inverse-hyperbolic-function
        role: definition
        confidence: high
      - id: definition.hyperbolic-function
        role: definition
        confidence: high
      - id: definition.natural-logarithm
        role: definition
        confidence: high

