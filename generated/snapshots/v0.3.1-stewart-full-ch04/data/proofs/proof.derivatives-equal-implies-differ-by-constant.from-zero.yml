notes: >
  One-line corollary: apply Theorem 5 to f − g. This is the formal
  basis for the "+ C" of every antiderivative and every indefinite
  integral. Stewart's Example 6 uses it to prove
  arctan(x) + arccot(x) = π/2 by zero-derivative + endpoint matching.
