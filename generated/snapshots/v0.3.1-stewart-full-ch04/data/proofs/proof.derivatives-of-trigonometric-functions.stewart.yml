parts:
  - name: derivative-of-sine
    kind: subclaim
    description: >
      Proof of (d/dx) sin x = cos x from the limit definition,
      the angle-addition formula sin(x+h) = sin x cos h + cos x sin h,
      and the two foundational trig limits (Eq 2 and Eq 3).
      Stewart §3.3, page 192–193 (full inline derivation).
    uses:
      - id: definition.derivative-function
        role: essential
        confidence: high
        notes: unfolds f'(x) as the (h → 0) limit of (sin(x+h) − sin x)/h
      - id: proposition.limit-sin-over-x
        role: essential
        confidence: high
        notes: lim (sin h)/h = 1
      - id: proposition.limit-cos-minus-1-over-x
        role: essential
        confidence: high
        notes: lim (cos h − 1)/h = 0
      - id: proposition.limit-laws
        role: essential
        confidence: high
        notes: sum law and product law to split the four-term limit
      - id: definition.trigonometric-function
        role: definition
        confidence: high
        notes: angle-addition identity for sine

  - name: derivative-of-cosine
    kind: subclaim
    description: >
      Proof of (d/dx) cos x = − sin x. Stewart defers to Exercise 20
      ("by the same methods used in the proof of formula 4"). The
      argument mirrors the sine derivation using the cosine
      angle-addition formula. Recorded here as essential structural
      dependency; full text not in §3.3 body.
    uses:
      - id: definition.derivative-function
        role: essential
        confidence: high
      - id: proposition.limit-sin-over-x
        role: essential
        confidence: high
      - id: proposition.limit-cos-minus-1-over-x
        role: essential
        confidence: high
      - id: proposition.limit-laws
        role: essential
        confidence: high
      - id: definition.trigonometric-function
        role: definition
        confidence: high
        notes: angle-addition identity for cosine

  - name: derivative-of-tangent
    kind: subclaim
    description: >
      (d/dx) tan x = sec² x derived inline via the quotient rule
      applied to tan x = sin x / cos x, using the two preceding
      derivatives and the Pythagorean identity sin² + cos² = 1.
      Stewart §3.3 page 194.
    uses:
      - id: theorem.quotient-rule
        role: essential
        confidence: high
      - id: theorem.derivatives-of-trigonometric-functions
        role: essential
        confidence: high
        notes: uses the sine and cosine derivatives proved above (self-reference within the bundle)
      - id: definition.trigonometric-function
        role: definition
        confidence: high
        notes: tan = sin/cos; sec = 1/cos; Pythagorean identity

  - name: derivative-of-cosecant-secant-cotangent
    kind: subclaim
    description: >
      (d/dx) csc x = −csc x cot x; (d/dx) sec x = sec x tan x;
      (d/dx) cot x = −csc² x. Stewart relegates to exercises 17–19
      using the same quotient-rule approach: csc = 1/sin, sec = 1/cos,
      cot = cos/sin. Recorded as bundled dependency.
    uses:
      - id: theorem.quotient-rule
        role: essential
        confidence: high
      - id: theorem.derivatives-of-trigonometric-functions
        role: essential
        confidence: high
        notes: uses sine and cosine derivatives (self-reference within the bundle)
      - id: definition.trigonometric-function
        role: definition
        confidence: high
        notes: csc, sec, cot defined as reciprocals/quotient of sin and cos

