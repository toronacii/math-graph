sketch:
  es:
    text: >
      Bundle de pruebas. Sólo (d/dx) sen x = cos x se demuestra
      por completo en el cuerpo del texto (§3.3 pp. 192–193),
      a partir de la definición de derivada y las identidades
      de adición sen(x+h) = sen x cos h + cos x sen h:
      (sen(x+h) − sen x)/h = sen x · (cos h − 1)/h
                            + cos x · sen h / h.
      Tomando h → 0 y usando proposition.limit-sin-over-x
      (límite = 1) y proposition.limit-cos-minus-1-over-x
      (límite = 0):
      f'(x) = sen x · 0 + cos x · 1 = cos x.
      La derivada de cos x se obtiene análogamente (ejercicio 20)
      usando cos(x+h) = cos x cos h − sen x sen h. La derivada de
      tan x se calcula directamente: aplicar la regla del cociente
      a sen x / cos x, simplificar usando cos² + sen² = 1, y
      reescribir 1/cos² x como sec² x. Las derivadas de csc, sec
      y cot se obtienen por la misma técnica (ejercicios 17–19).
    is_original: true
    origin: original
    review_status: unreviewed

