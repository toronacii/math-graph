parts:
  - name: derivative-of-arcsine
    kind: subclaim
    description: >
      (d/dx) sin⁻¹ x = 1/√(1 − x²) derived inline from
      sin y = x via implicit differentiation. The branch
      −π/2 ≤ y ≤ π/2 ensures cos y ≥ 0, so cos y = √(1 − sin² y) =
      √(1 − x²). Stewart §3.5 page 213.
    uses:
      - id: proposition.implicit-differentiation
        role: essential
        confidence: high
      - id: theorem.chain-rule
        role: essential
        confidence: high
        notes: applied to sin y when differentiating sin y = x, with y a function of x
      - id: definition.inverse-trigonometric-function
        role: definition
        confidence: high
        notes: y = sin⁻¹ x ⇔ sin y = x for y ∈ [−π/2, π/2]
      - id: theorem.derivatives-of-trigonometric-functions
        role: essential
        confidence: high
        notes: (d/dy) sin y = cos y

  - name: derivative-of-arctangent
    kind: subclaim
    description: >
      (d/dx) tan⁻¹ x = 1/(1 + x²) derived inline from tan y = x
      via implicit differentiation, using sec² y = 1 + tan² y =
      1 + x². Stewart §3.5 page 214.
    uses:
      - id: proposition.implicit-differentiation
        role: essential
        confidence: high
      - id: theorem.chain-rule
        role: essential
        confidence: high
      - id: definition.inverse-trigonometric-function
        role: definition
        confidence: high
        notes: y = tan⁻¹ x ⇔ tan y = x for y ∈ (−π/2, π/2)
      - id: theorem.derivatives-of-trigonometric-functions
        role: essential
        confidence: high
        notes: (d/dy) tan y = sec² y

  - name: derivatives-of-arccos-arccot-arcsec-arccsc
    kind: subclaim
    description: >
      (d/dx) cos⁻¹ x, cot⁻¹ x, sec⁻¹ x, csc⁻¹ x. Stewart relegates
      these to exercises (Ex 64 for sec/csc — branch-convention
      sensitive; arccos and arccot follow the same implicit-
      differentiation pattern). Recorded here as bundled
      structural dependency.
    uses:
      - id: proposition.implicit-differentiation
        role: essential
        confidence: medium
        notes: same technique as arcsin/arctan applied to the other four inverse trig identities
      - id: theorem.chain-rule
        role: essential
        confidence: medium
      - id: definition.inverse-trigonometric-function
        role: definition
        confidence: high
      - id: theorem.derivatives-of-trigonometric-functions
        role: essential
