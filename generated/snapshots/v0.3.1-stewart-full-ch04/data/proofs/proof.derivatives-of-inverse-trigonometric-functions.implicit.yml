sketch:
  es:
    text: >
      Bundle. Caso arcsin: sea y = sin⁻¹ x con y ∈ [−π/2, π/2],
      luego sen y = x. Derivando implícitamente respecto a x y
      aplicando regla de la cadena, cos y · (dy/dx) = 1, así
      dy/dx = 1/cos y. Como y ∈ [−π/2, π/2], cos y ≥ 0, luego
      cos y = √(1 − sen² y) = √(1 − x²), y por tanto
      (d/dx) sin⁻¹ x = 1/√(1 − x²).
      Caso arctan: sea y = tan⁻¹ x, tan y = x. Derivando,
      sec² y · (dy/dx) = 1, así dy/dx = 1/sec² y =
      1/(1 + tan² y) = 1/(1 + x²).
      Casos arccos, arccot, arcsec, arccsc: análogos por la misma
      técnica (Stewart los deja como ejercicios). Los signos
      negativos de las cofunciones reflejan que cos⁻¹ y cot⁻¹ son
      decrecientes; los factores 1/(x √(x² − 1)) en sec⁻¹/csc⁻¹
      dependen de la convención de rama.
    is_original: true
    origin: original
    review_status: unreviewed

