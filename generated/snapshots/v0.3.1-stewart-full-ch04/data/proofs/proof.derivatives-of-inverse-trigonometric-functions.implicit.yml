notes: >
  Bundled proof. arcsin and arctan are explicit; arccos, arccot,
  arcsec, arccsc are deferred to exercises. dependency_confidence:
  medium reflects the partial textual coverage AND the implicit
  hypothesis that the inverse of a differentiable bijection is
  itself differentiable (Stewart asserts this informally:
  "puede demostrarse que su función inversa f⁻¹ también es
  derivable, excepto donde sus rectas tangentes son verticales").
