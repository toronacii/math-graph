notes: >
  Bundled proof. All identities reduce mechanically to algebra
  on the exponential definition; no further machinery is required.
  Stewart proves only the Pythagorean and derived-Pythagorean
  cases inline; parity and addition formulas are exercises but
  follow the same pattern.
