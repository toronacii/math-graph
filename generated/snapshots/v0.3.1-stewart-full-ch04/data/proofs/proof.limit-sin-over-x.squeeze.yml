sketch:
  es:
    text: >
      Considérese un sector de la circunferencia unitaria con
      ángulo central θ ∈ (0, π/2). Sean B el extremo del arco y
      C el pie de la perpendicular desde B sobre OA. Por la
      definición de medida en radianes el arco AB tiene longitud
      θ, mientras |BC| = sen θ. Geométricamente |BC| < |AB| <
      arco AB, de donde sen θ < θ y por tanto (sen θ)/θ < 1.
      Considerando ahora el polígono circunscrito (tangentes en A
      y B), la circunferencia es menor que el polígono, y se
      obtiene θ < tan θ, es decir cos θ < (sen θ)/θ. Combinando,
      cos θ < (sen θ)/θ < 1 para θ ∈ (0, π/2). Como
      lím_{θ→0} cos θ = 1 (continuidad del coseno) y
      lím 1 = 1, por el teorema de la compresión
      lím_{θ→0⁺} (sen θ)/θ = 1. La función (sen θ)/θ es par,
      luego el límite por la izquierda coincide y se concluye
      lím_{θ→0} (sen θ)/θ = 1.
    is_original: true
    origin: original
    review_status: unreviewed

