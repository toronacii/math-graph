notes: >
  Stewart's geometric proof — relies on intuitive comparison of
  arc length to chord and to circumscribed polygon. He explicitly
  notes that Apéndice F gives a non-intuitive direct proof of
  θ < tan θ from the formal definition of arc length.
  dependency_confidence:medium reflects the geometric intuition
  step. Closes part of the squeeze-theorem usage debt.
