statement:
  natural:
    es:
      text: >
        Si f(x) ≤ g(x) ≤ h(x) cuando x tiende a a (excepto
        posiblemente en a) y lím_{x→a} f(x) = lím_{x→a} h(x) = L,
        entonces lím_{x→a} g(x) = L.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If f(x) ≤ g(x) ≤ h(x) when x is near a (except possibly at
        a) and lim_{x→a} f(x) = lim_{x→a} h(x) = L, then
        lim_{x→a} g(x) = L.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f(x) \le g(x) \le h(x) \text{ cerca de } a
      \;\;\text{y}\;\;
      \lim_{x \to a} f(x) = \lim_{x \to a} h(x) = L
      \;\;\Longrightarrow\;\;
      \lim_{x \to a} g(x) = L
    status: present
    review_status: unreviewed

