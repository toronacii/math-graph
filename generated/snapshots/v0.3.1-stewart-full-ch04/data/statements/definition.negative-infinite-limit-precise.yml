statement:
  natural:
    es:
      text: >
        Sea f una función definida sobre algún intervalo abierto que
        contiene al número a, excepto posiblemente en a misma.
        Entonces lím_{x→a} f(x) = −∞ significa que para todo número
        negativo N existe un número positivo δ tal que si
        0 < |x − a| < δ entonces f(x) < N.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        Let f be a function defined on some open interval that
        contains the number a, except possibly at a itself. Then
        lim_{x→a} f(x) = −∞ means that for every negative number N
        there is a positive number δ such that if 0 < |x − a| < δ
        then f(x) < N.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \lim_{x \to a} f(x) = -\infty
      \iff
      \forall N < 0,\ \exists \delta > 0:\
      0 < |x - a| < \delta \implies f(x) < N
    status: present
    review_status: unreviewed

