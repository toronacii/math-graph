notes: >
  Stewart's Eq 3, §3.10. With this definition, dy/dx is now
  literally a quotient of differentials (Stewart's marginal
  remark). Foundational for §3.9 related rates notation, §6
  integration (∫f(x) dx as antidifferential), and §9.4 separable
  ODEs. Differential rules (d(cu) = c du, d(u + v) = du + dv,
  d(uv) = u dv + v du, d(u/v), d(x^n) = n x^{n−1} dx) follow
  directly from the corresponding derivative rules and are not
  modeled as a separate proposition (Stewart relegates them to
  Exercise 41).
