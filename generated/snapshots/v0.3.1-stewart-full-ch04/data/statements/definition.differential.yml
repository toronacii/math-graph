statement:
  natural:
    es:
      text: >
        Sea y = f(x) una función derivable. La diferencial dx es
        una variable independiente que toma cualquier valor real.
        La diferencial dy se define en términos de dx por la
        ecuación dy = f'(x) dx. Geométricamente, dy es la cantidad
        en que se eleva o cae la recta tangente a y = f(x) en el
        punto (x, f(x)) cuando la abscisa cambia en dx, mientras
        que Δy = f(x + dx) − f(x) es la cantidad correspondiente
        en que se eleva o cae la propia curva.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        Let y = f(x) be differentiable. The differential dx is an
        independent variable taking any real value. The differential
        dy is defined in terms of dx by the equation dy = f'(x) dx.
        Geometrically, dy is the rise/fall of the tangent line to
        y = f(x) at (x, f(x)) when the abscissa changes by dx,
        whereas Δy = f(x + dx) − f(x) is the rise/fall of the curve
        itself.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      dy \;=\; f'(x)\,dx
