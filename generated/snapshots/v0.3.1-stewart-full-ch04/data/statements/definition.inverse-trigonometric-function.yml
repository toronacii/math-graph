statement:
  natural:
    es:
      text: >
        Las funciones trigonométricas inversas son las inversas
        sin⁻¹ (arcsin), cos⁻¹ (arccos), tan⁻¹ (arctan), cot⁻¹, sec⁻¹
        y csc⁻¹, definidas restringiendo cada función trigonométrica
        a un intervalo donde sea uno a uno. Por ejemplo, sin⁻¹ tiene
        dominio [−1, 1] y rango [−π/2, π/2], y cos⁻¹ tiene dominio
        [−1, 1] y rango [0, π].
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The inverse trigonometric functions are the inverses sin⁻¹
        (arcsin), cos⁻¹ (arccos), tan⁻¹ (arctan), cot⁻¹, sec⁻¹, and
        csc⁻¹, defined by restricting each trigonometric function to
        an interval on which it is one-to-one. For instance, sin⁻¹
        has domain [−1, 1] and range [−π/2, π/2], and cos⁻¹ has
        domain [−1, 1] and range [0, π].
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
