statement:
  natural:
    es:
      text: >
        Suponga que f y g son derivables y g'(x) ≠ 0 sobre un
        intervalo abierto I que contiene a a (excepto posiblemente
        en a). Suponga que (i) lím_{x→a} f(x) = 0 y
        lím_{x→a} g(x) = 0, o que (ii) lím_{x→a} f(x) = ±∞ y
        lím_{x→a} g(x) = ±∞. Entonces
        lím_{x→a} f(x)/g(x) = lím_{x→a} f'(x)/g'(x) si existe el
        límite del lado derecho (o es +∞ o −∞). La regla también es
        válida para límites unilaterales y para x → ±∞.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        Suppose f and g are differentiable and g'(x) ≠ 0 on an open
        interval I containing a (except possibly at a). Suppose
        either (i) lim_{x→a} f(x) = 0 and lim_{x→a} g(x) = 0, or
        (ii) lim_{x→a} f(x) = ±∞ and lim_{x→a} g(x) = ±∞. Then
        lim_{x→a} f(x)/g(x) = lim_{x→a} f'(x)/g'(x), provided the
        right-hand limit exists (or is +∞ or −∞). The rule also holds
        for one-sided limits and for x → ±∞.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f, g \in D(I \setminus \{a\}),\ g'(x) \neq 0,\
      \bigl(f, g \to 0\bigr) \;\vee\; \bigl(|f|, |g| \to \infty\bigr)
      \;\Longrightarrow\;
      \lim_{x \to a} \frac{f(x)}{g(x)} = \lim_{x \to a} \frac{f'(x)}{g'(x)}
      \quad \text{(provided RHS exists in } \overline{\mathbb{R}}\text{)}
    status: present
    review_status: unreviewed

