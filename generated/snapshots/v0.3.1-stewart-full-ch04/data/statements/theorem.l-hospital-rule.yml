notes: >
  Stewart §4.4 page 302. The boxed statement covers BOTH 0/0 and
  ∞/∞ cases jointly; both are kept in this single node because
  Stewart treats them in a single rule with parallel hypotheses.
  Stewart's Note 3 sketches a proof of the SPECIAL CASE
  (f(a) = g(a) = 0, f' and g' continuous, g'(a) ≠ 0) using the
  alternative form of the derivative definition; the general proof
  is explicitly deferred to Apéndice F ("Es más difícil demostrar
  la versión general de la regla de l'Hospital. Véase el apéndice
  F."). proved_by intentionally empty: the special-case sketch is
  insufficient to discharge the theorem as stated, and the general
  proof is not in Stewart's main text. Indeterminate-form
  techniques (0·∞, ∞−∞, 0⁰, ∞⁰, 1^∞) are exposition (NOT
  theorems): they are pedagogical strategies for rewriting limits
  into 0/0 or ∞/∞ form so this rule applies; they introduce no
  new entities. Stewart Ex 84 explicitly notes 0^∞ is NOT
  indeterminate and proves it via an inequality argument (not a
  separate theorem either). Multi-source disambiguation: Rudin
  Theorem 5.13 is the more general version (Cauchy MVT-based) and
  would be a separate node in any future merge.
