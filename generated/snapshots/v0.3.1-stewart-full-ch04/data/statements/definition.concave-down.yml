statement:
  natural:
    es:
      text: >
        Si la gráfica de f queda por abajo de todas sus rectas
        tangentes sobre un intervalo I, se dice que f es cóncava
        hacia abajo sobre I.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If the graph of f lies below all of its tangent lines on an
        interval I, then f is said to be concave downward on I.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f \text{ concave down on } I \iff
      \forall x_0 \in I,\ \forall x \in I:\ f(x) \le f(x_0) + f'(x_0)(x - x_0)
    status: present
    review_status: unreviewed

