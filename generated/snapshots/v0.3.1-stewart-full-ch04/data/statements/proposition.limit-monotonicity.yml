statement:
  natural:
    es:
      text: >
        Si f(x) ≤ g(x) cuando x tiende a a (excepto posiblemente en
        x = a) y los límites de f y g existen cuando x tiende a a,
        entonces lím_{x→a} f(x) ≤ lím_{x→a} g(x).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If f(x) ≤ g(x) when x is near a (except possibly at x = a)
        and both lim_{x→a} f(x) and lim_{x→a} g(x) exist, then
        lim_{x→a} f(x) ≤ lim_{x→a} g(x).
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f(x) \le g(x) \text{ cerca de } a
      \;\;\Longrightarrow\;\;
      \lim_{x \to a} f(x) \le \lim_{x \to a} g(x)
    status: present
    review_status: unreviewed

