statement:
  natural:
    es:
      text: >
        Si f es derivable en a, entonces para todo incremento Δx
        existe Δy = f(a + Δx) − f(a) que se puede escribir como
        Δy = f'(a) Δx + ε Δx, donde ε = ε(Δx) → 0 cuando Δx → 0
        (definiendo ε(0) = 0, ε es función continua de Δx).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If f is differentiable at a, then for every increment Δx
        the corresponding Δy = f(a + Δx) − f(a) can be written as
        Δy = f'(a) Δx + ε Δx, where ε = ε(Δx) → 0 as Δx → 0
        (with ε(0) := 0, ε is a continuous function of Δx).
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \Delta y \;=\; f'(a)\,\Delta x \;+\; \varepsilon\,\Delta x,
      \qquad \varepsilon \to 0 \text{ as } \Delta x \to 0
    status: present
    review_status: unreviewed

