notes: >
  Lemma supporting the rigorous proof of the chain rule. It also
  underlies the differential approximation Δy ≈ dy = f'(a)Δx
  treated formally in §3.10. Could be classified as lemma; kept
  as proposition because Stewart presents it as a stand-alone
  property of differentiable functions, not merely a stepping
  stone.
