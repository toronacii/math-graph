notes: >
  Type-A bundle. Stewart asserts the theorem without unified proof:
  trig continuity is sketched (§2.5 eq. 6 + addition formulas, with
  full proof deferred to §3.3 squeeze-theorem application);
  inv-trig continuity is asserted via Apéndice F (continuous bijection
  ⇒ continuous inverse); exp continuity via §1.5 construction;
  log continuity via inverse-of-continuous-bijection.
  semantic_confidence: medium tracks this inhomogeneous justification
  shape. No proof node authored — would require Apéndice F machinery
  not yet in graph.
