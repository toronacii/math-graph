statement:
  natural:
    es:
      text: >
        Los siguientes tipos de funciones son continuas en todo
        número de sus dominios: funciones polinomiales, funciones
        racionales, funciones raíz, funciones trigonométricas,
        funciones trigonométricas inversas, funciones exponenciales,
        funciones logarítmicas.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The following types of functions are continuous at every
        number in their domains: polynomial, rational, root,
        trigonometric, inverse trigonometric, exponential, and
        logarithmic functions.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \text{polynomial, rational, root, trig, inv-trig, exp, log}
      \text{ functions are continuous on their domains}
    status: present
    review_status: unreviewed

