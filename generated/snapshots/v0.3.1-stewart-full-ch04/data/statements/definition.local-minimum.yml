statement:
  natural:
    es:
      text: >
        El número f(c) es un valor mínimo local de f si
        f(c) ≤ f(x) cuando x está cerca de c, es decir, si existe
        un intervalo abierto que contiene a c en el cual
        f(c) ≤ f(x) para toda x del intervalo (intersectado con
        el dominio de f).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The number f(c) is a local minimum value of f if
        f(c) ≤ f(x) when x is near c — that is, if there exists
        an open interval containing c on which f(c) ≤ f(x) for
        every x in the interval (intersected with the domain of f).
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \exists \delta > 0 \text{ such that } f(c) \le f(x) \text{ for all } x \in (c-\delta,\, c+\delta) \cap D
    status: present
    review_status: unreviewed

