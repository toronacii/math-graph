notes: >
  Stewart §4.9 Teorema 1 page 344. Direct corollary of
  corollary.derivatives-equal-implies-differ-by-constant (§4.2
  Corolario 7) applied to two antiderivatives F, G of f. Could
  be classified as a corollary; Stewart presents it as a numbered
  theorem so we mirror that. The "+ C" appearing in every indefinite
  integral and every solution to a first-order ODE in §4.9 / Ch5 / Ch9
  is justified by this single result. Stewart's statement implicitly
  assumes I is an interval (connectedness) — on a disconnected
  domain (e.g. R \\ {0}) one obtains independent constants on each
  component, as illustrated by the ln|x| example on the same page.
