statement:
  natural:
    es:
      text: >
        Si F es una antiderivada de f sobre un intervalo I, entonces
        la antiderivada más general de f sobre I es F(x) + C, donde C
        es una constante arbitraria.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If F is an antiderivative of f on an interval I, then the most
        general antiderivative of f on I is F(x) + C, where C is an
        arbitrary constant.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \text{Si } F'(x) = f(x) \text{ en } I,\;
      \text{entonces toda antiderivada de } f \text{ en } I
      \text{ tiene la forma } F(x) + C,\; C \in \mathbb{R}.
