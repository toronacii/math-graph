    review_status: unreviewed

statement:
  natural:
    es:
      text: >
        Una función f es continua en un número x = a si
        lím_{x→a} f(x) = f(a). Esto requiere implícitamente tres
        cosas: (1) f(a) está definida (a está en el dominio de f);
        (2) lím_{x→a} f(x) existe; (3) lím_{x→a} f(x) = f(a).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        A function f is continuous at a number x = a if
        lim_{x→a} f(x) = f(a). This implicitly requires three
        things: (1) f(a) is defined (a is in the domain of f);
        (2) lim_{x→a} f(x) exists; (3) lim_{x→a} f(x) = f(a).
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f \text{ continuous at } a \iff \lim_{x \to a} f(x) = f(a)
    status: present
    review_status: unreviewed

