statement:
  natural:
    es:
      text: >
        Las derivadas de las seis funciones hiperbólicas son:
        (d/dx) senh x = cosh x;
        (d/dx) cosh x = senh x;
        (d/dx) tanh x = sech²x;
        (d/dx) csch x = − csch x coth x;
        (d/dx) sech x = − sech x tanh x;
        (d/dx) coth x = − csch²x.
        Cada una vale en el dominio de la función correspondiente.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The derivatives of the six hyperbolic functions are:
        (d/dx) sinh x = cosh x;
        (d/dx) cosh x = sinh x;
        (d/dx) tanh x = sech²x;
        (d/dx) csch x = −csch x coth x;
        (d/dx) sech x = −sech x tanh x;
        (d/dx) coth x = −csch²x.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \begin{aligned}
        \frac{d}{dx}\sinh x &= \cosh x, &
        \frac{d}{dx}\operatorname{csch} x &= -\operatorname{csch} x\,\coth x,\\[4pt]
        \frac{d}{dx}\cosh x &= \sinh x, &
        \frac{d}{dx}\operatorname{sech} x &= -\operatorname{sech} x\,\tanh x,\\[4pt]
        \frac{d}{dx}\tanh x &= \operatorname{sech}^{2} x, &
        \frac{d}{dx}\coth x &= -\operatorname{csch}^{2} x.
      \end{aligned}
    status: present
    review_status: unreviewed

