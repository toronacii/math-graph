statement:
  natural:
    es:
      text: >
        Dadas dos funciones f y g, la función compuesta f ∘ g se
        define por (f ∘ g)(x) = f(g(x)). El dominio de f ∘ g es el
        conjunto de todos los x en el dominio de g tales que g(x)
        está en el dominio de f.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        Given two functions f and g, the composite function f ∘ g is
        defined by (f ∘ g)(x) = f(g(x)). The domain of f ∘ g is the
        set of all x in the domain of g such that g(x) lies in the
        domain of f.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      (f \circ g)(x) = f(g(x))
