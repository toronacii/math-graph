title:
  es:
    text: Conmutatividad del límite con una función continua
    is_original: true
    origin: original
    review_status: unreviewed
  en:
    text: Limit commutes through a continuous function
    is_original: false
    origin: llm
    generated_by: "llm:claude-opus-4.7"
    review_status: unreviewed

statement:
  natural:
    es:
      text: >
        Si f es continua en b y lím_{x→a} g(x) = b, entonces
        lím_{x→a} f(g(x)) = f(b). En otras palabras,
        lím_{x→a} f(g(x)) = f(lím_{x→a} g(x)).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If f is continuous at b and lim_{x→a} g(x) = b, then
        lim_{x→a} f(g(x)) = f(b). In other words,
        lim_{x→a} f(g(x)) = f(lim_{x→a} g(x)).
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f \text{ continuous at } b \;\wedge\;
      \lim_{x \to a} g(x) = b
      \implies
      \lim_{x \to a} f(g(x)) = f\!\left(\lim_{x \to a} g(x)\right)
    status: present
    review_status: unreviewed

