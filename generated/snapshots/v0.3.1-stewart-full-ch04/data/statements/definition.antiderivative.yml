notes: >
  Stewart §4.9 page 344. Foundational definition for Chapter 5
  (indefinite integral, FTC). Stewart's definition is interval-local:
  the same function f admits different antiderivatives on different
  intervals (cf. ln|x| on (−∞,0) and (0,∞)). The "+ C" structure is
  NOT part of this definition — it is captured separately by
  theorem.general-antiderivative, whose proof uses
  corollary.derivatives-equal-implies-differ-by-constant. Multi-source
  note: in Rudin / standard analysis the term "primitive" is more
  common; future merge would identify the nodes via title alias.
