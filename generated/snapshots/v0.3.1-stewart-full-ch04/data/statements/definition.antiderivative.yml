statement:
  natural:
    es:
      text: >
        Una función F recibe el nombre de antiderivada de f sobre un
        intervalo I si F'(x) = f(x) para toda x en I.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        A function F is called an antiderivative of f on an interval
        I if F'(x) = f(x) for every x in I.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
