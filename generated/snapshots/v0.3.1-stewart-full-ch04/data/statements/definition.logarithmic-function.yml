statement:
  natural:
    es:
      text: >
        Si a > 0 y a ≠ 1, la función logarítmica de base a, denotada
        logₐ, es la inversa de la función exponencial f(x) = aˣ.
        Su dominio es (0, ∞) y su rango es R, y se caracteriza por
        logₐ(x) = y si y sólo si aʸ = x.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If a > 0 and a ≠ 1, the logarithmic function with base a,
        denoted logₐ, is the inverse of the exponential function
        f(x) = aˣ. Its domain is (0, ∞) and its range is R, and it
        is characterized by logₐ(x) = y if and only if aʸ = x.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \log_a x = y \iff a^{y} = x, \qquad a > 0,\; a \ne 1
    status: present
    review_status: unreviewed

