statement:
  natural:
    es:
      text: >
        Las funciones hiperbólicas inversas se definen como las
        inversas de las funciones hiperbólicas correspondientes,
        previa restricción al subdominio en que son uno a uno:
        senh⁻¹ es la inversa de senh : ℝ → ℝ;
        cosh⁻¹ es la inversa de cosh restringida a [0, ∞);
        tanh⁻¹ es la inversa de tanh : ℝ → (−1, 1);
        csch⁻¹, sech⁻¹, coth⁻¹ se definen análogamente
        (Ejercicio 28). Equivalentemente:
        y = senh⁻¹ x ⇔ senh y = x;
        y = cosh⁻¹ x ⇔ cosh y = x ∧ y ≥ 0;
        y = tanh⁻¹ x ⇔ tanh y = x.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The inverse hyperbolic functions are defined as the
        inverses of the hyperbolic functions, restricted where
        necessary to a one-to-one subdomain:
        sinh⁻¹ is the inverse of sinh : ℝ → ℝ;
        cosh⁻¹ is the inverse of cosh restricted to [0, ∞);
        tanh⁻¹ is the inverse of tanh : ℝ → (−1, 1);
        csch⁻¹, sech⁻¹, coth⁻¹ are defined analogously
        (Exercise 28). Equivalently:
        y = sinh⁻¹ x ⇔ sinh y = x;
        y = cosh⁻¹ x ⇔ cosh y = x ∧ y ≥ 0;
        y = tanh⁻¹ x ⇔ tanh y = x.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \begin{aligned}
        y = \sinh^{-1} x &\iff \sinh y = x,\\
        y = \cosh^{-1} x &\iff \cosh y = x \;\wedge\; y \ge 0,\\
        y = \tanh^{-1} x &\iff \tanh y = x.
      \end{aligned}
    status: present
    review_status: unreviewed

