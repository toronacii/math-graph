notes: >
  Bundled per the trig-bundle policy. Stewart writes out senh⁻¹,
  cosh⁻¹, tanh⁻¹ explicitly (Cuadro 2) and defers csch⁻¹, sech⁻¹,
  coth⁻¹ to Exercise 28. The cosh⁻¹ branch convention y ≥ 0 is
  required for invertibility; other branch conventions exist in
  the literature.
