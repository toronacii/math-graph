statement:
  natural:
    es:
      text: >
        Sea f una función definida sobre algún intervalo (a, ∞).
        Entonces lím_{x→∞} f(x) = L significa que para toda ε > 0
        existe un correspondiente número N tal que si x > N entonces
        |f(x) − L| < ε.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        Let f be a function defined on some interval (a, ∞). Then
        lim_{x→∞} f(x) = L means that for every ε > 0 there is a
        corresponding number N such that if x > N then
        |f(x) − L| < ε.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \lim_{x \to \infty} f(x) = L
      \iff
      \forall \varepsilon > 0,\ \exists N:\
      x > N \implies |f(x) - L| < \varepsilon
    status: present
    review_status: unreviewed

