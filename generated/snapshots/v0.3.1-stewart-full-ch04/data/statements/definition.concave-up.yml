notes: >
  Stewart §4.3 page 293 bundles concave-up and concave-down in a
  single Definition box; split into sibling atomic nodes per the
  §4.1 precedent. Stewart's geometric definition (graph above
  tangents) presupposes f is differentiable on I; the formal LaTeX
  rendering above makes this explicit. The equivalence with f'' ≥ 0
  is established separately via the Concavity Test
  (proposition.concavity-test). Multi-source disambiguation note:
  Rudin's standard "convex" definition uses chord-above-graph; the
  two coincide for differentiable functions but not for
  non-differentiable ones, so any future Rudin merge must keep them
  separate or formalize the equivalence.
