notes: >
  This is Stewart's Eq 4 (page 179). It is a conditional theorem:
  the conclusion holds IF f'(0) exists. Stewart only provides
  numerical evidence (table of values) for the existence of
  f'(0) when a = 2 and a = 3 — he does not prove it. The
  existence of f'(0) for general a is open debt; flagged in
  proof.exponential-derivative-proportional.stewart with
  dependency_confidence:medium. The key consequence
  d/dx(e^x) = e^x is captured as a separate corollary node.
