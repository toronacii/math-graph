title:
  es:
    text: La derivada de una función exponencial es proporcional a la función
    is_original: true
    origin: original
    review_status: unreviewed
  en:
    text: The derivative of an exponential function is proportional to the function
    is_original: false
    origin: llm
    generated_by: "llm:claude-opus-4.7"
    review_status: unreviewed

statement:
  natural:
    es:
      text: >
        Si la función exponencial f(x) = a^x (con a > 0) es
        derivable en 0, entonces es derivable para todo x y
        f'(x) = f'(0) · a^x. En consecuencia, la razón de cambio
        de cualquier función exponencial es proporcional a la
        función misma.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If the exponential function f(x) = a^x (with a > 0) is
        differentiable at 0, then it is differentiable everywhere
        and f'(x) = f'(0) · a^x. Hence the rate of change of any
        exponential function is proportional to the function
        itself.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f(x) = a^{x},\ a>0,\ f'(0)\text{ exists}
        \;\Longrightarrow\; f'(x) \;=\; f'(0)\cdot a^{x}
    status: present
    review_status: unreviewed

