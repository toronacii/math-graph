statement:
  natural:
    es:
      text: >
        Supongamos que f(x) está definida cuando x está cerca del
        número a (es decir, en algún intervalo abierto que contiene
        a a, excepto posiblemente en a misma). Entonces escribimos
        lím_{x→a} f(x) = L y decimos "el límite de f(x) cuando x
        tiende a a es igual a L" si podemos hacer que los valores
        de f(x) estén arbitrariamente cercanos a L (tan cercanos a L
        como queramos), tomando valores de x suficientemente cerca
        de a (por ambos lados de a), pero no iguales a a.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        Suppose f(x) is defined when x is near the number a (i.e.,
        on some open interval containing a, except possibly at a
        itself). Then we write lim_{x→a} f(x) = L, and say "the
        limit of f(x) as x approaches a equals L", if we can make
        the values of f(x) arbitrarily close to L (as close to L as
        we like) by taking x sufficiently close to a (on either
        side of a), but not equal to a.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \lim_{x \to a} f(x) = L
    status: informal
    review_status: unreviewed

