statement:
  natural:
    es:
      text: >
        El número e admite la representación como límite
        e = lím_{x→0} (1 + x)^{1/x}, equivalentemente
        e = lím_{n→∞} (1 + 1/n)^n.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The number e admits the limit representations
        e = lim_{x→0} (1 + x)^{1/x}, equivalently
        e = lim_{n→∞} (1 + 1/n)^n.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
