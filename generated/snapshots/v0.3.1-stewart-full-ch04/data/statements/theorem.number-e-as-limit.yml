notes: >
  Stewart's Eqs 5 and 6 of §3.6. The proof uses the identity
  (ln x)' = 1/x evaluated at x = 1 (so f'(1) = 1) together with
  continuity of the exponential function (Theorem 2.5.8). The
  alternate form e = lim (1 + 1/n)^n follows by substitution
  n = 1/x. Bundled because both forms are mathematically the
  same characterization (one for continuous variable, one for
  integer index).
