notes: >
  Stewart's Theorem 2, §3.8 p. 237. Stewart proves only the
  forward direction (verification that Ce^{kt} satisfies the
  ODE) inline; the converse (uniqueness — that EVERY solution
  has this form) is asserted but its proof is deferred to §9.4.
  Hence dependency_confidence:medium and an open uniqueness
  debt for the §9.4 milestone. Newton's law of cooling
  (dT/dt = k(T − T_s)) and the continuous compound interest
  formula A(t) = A_0 e^{rt} are derived from this theorem in
  §3.8 by change of variable / limit; they are pedagogical
  applications, not new mathematical content, and are not
  modeled as separate theorem nodes.
