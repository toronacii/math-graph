statement:
  natural:
    es:
      text: >
        Las únicas soluciones de la ecuación diferencial dy/dt =
        k y son las funciones exponenciales y(t) = y(0) e^{k t},
        donde y(0) es el valor inicial y k es la constante de
        proporcionalidad (k > 0 → crecimiento; k < 0 → decaimiento).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The only solutions of the differential equation dy/dt = k y
        are the exponential functions y(t) = y(0) e^{k t}, where
        y(0) is the initial value and k is the proportionality
        constant (k > 0 → growth; k < 0 → decay).
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \frac{dy}{dt} = k\,y \quad\Longleftrightarrow\quad y(t) = y(0)\,e^{k t}
    status: present
    review_status: unreviewed

