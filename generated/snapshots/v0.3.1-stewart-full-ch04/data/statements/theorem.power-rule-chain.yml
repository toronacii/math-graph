statement:
  natural:
    es:
      text: >
        Si n es cualquier número real y u = g(x) es derivable,
        entonces (d/dx)[u^n] = n u^{n−1} (du/dx). Equivalentemente,
        (d/dx)[g(x)]^n = n [g(x)]^{n−1} g'(x).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If n is any real number and u = g(x) is differentiable,
        then (d/dx)[u^n] = n u^{n−1} (du/dx). Equivalently,
        (d/dx)[g(x)]^n = n [g(x)]^{n−1} g'(x).
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \frac{d}{dx}\bigl[g(x)\bigr]^{n}
        \;=\; n\,\bigl[g(x)\bigr]^{n-1}\,g'(x)
    status: present
    review_status: unreviewed

