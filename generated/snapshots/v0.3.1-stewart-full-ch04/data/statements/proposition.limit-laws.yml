notes: >
  Type-A bundle of five arithmetic limit laws sharing structure and
  hypotheses (existence of lim f and lim g). Stewart bundles them
  in the same boxed group and gives them as Laws 1–5. Carried as
  explicit epistemic debt at dependency_confidence: medium —
  splittable into proposition.limit-{sum,difference,constant-
  multiple,product,quotient}-law if downstream proofs cite them
  individually. Stewart's main text notes the proofs are in
  Apéndice F (and Law 1 is to be proved in §2.4 from the precise
  definition); no proof node authored in §2.3.
