statement:
  natural:
    es:
      text: >
        Suponga que c es una constante y que lím_{x→a} f(x) y
        lím_{x→a} g(x) existen. Entonces:
        (1) Suma: lím[f(x) + g(x)] = lím f(x) + lím g(x).
        (2) Diferencia: lím[f(x) − g(x)] = lím f(x) − lím g(x).
        (3) Múltiplo constante: lím[c f(x)] = c · lím f(x).
        (4) Producto: lím[f(x) g(x)] = lím f(x) · lím g(x).
        (5) Cociente: lím[f(x)/g(x)] = lím f(x) / lím g(x), siempre
        que lím g(x) ≠ 0.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        Suppose c is a constant and lim_{x→a} f(x) and lim_{x→a}
        g(x) exist. Then:
        (1) Sum: lim[f(x) + g(x)] = lim f(x) + lim g(x).
        (2) Difference: lim[f(x) − g(x)] = lim f(x) − lim g(x).
        (3) Constant multiple: lim[c f(x)] = c · lim f(x).
        (4) Product: lim[f(x) g(x)] = lim f(x) · lim g(x).
        (5) Quotient: lim[f(x)/g(x)] = lim f(x) / lim g(x), provided
        lim g(x) ≠ 0.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \begin{aligned}
      &\lim_{x\to a}\bigl[f(x)+g(x)\bigr]
        = \lim_{x\to a} f(x) + \lim_{x\to a} g(x), \\
      &\lim_{x\to a}\bigl[f(x)-g(x)\bigr]
        = \lim_{x\to a} f(x) - \lim_{x\to a} g(x), \\
      &\lim_{x\to a}\bigl[c\,f(x)\bigr] = c \lim_{x\to a} f(x), \\
      &\lim_{x\to a}\bigl[f(x)\,g(x)\bigr]
        = \lim_{x\to a} f(x)\cdot \lim_{x\to a} g(x), \\
      &\lim_{x\to a}\frac{f(x)}{g(x)}
        = \frac{\lim_{x\to a} f(x)}{\lim_{x\to a} g(x)}
        \quad \text{si } \lim_{x\to a} g(x) \neq 0.
      \end{aligned}
    status: present
    review_status: unreviewed

