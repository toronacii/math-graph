statement:
  natural:
    es:
      text: >
        Si f es derivable en a, entonces para x cercano a a se
        tiene la aproximación f(x) ≈ f(a) + f'(a)(x − a) = L(x).
        En notación de diferenciales, con dx = Δx pequeño,
        Δy = f(a + dx) − f(a) ≈ dy = f'(a) dx, equivalentemente
        f(a + dx) ≈ f(a) + dy. La precisión de la aproximación
        mejora cuando |x − a| → 0.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If f is differentiable at a, then for x near a one has
        the approximation f(x) ≈ f(a) + f'(a)(x − a) = L(x). In
        differential notation, with dx = Δx small,
        Δy = f(a + dx) − f(a) ≈ dy = f'(a) dx, equivalently
        f(a + dx) ≈ f(a) + dy. Accuracy improves as |x − a| → 0.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f(x) \;\approx\; f(a) + f'(a)(x-a) \qquad (x \text{ near } a)
    status: present
    review_status: unreviewed

