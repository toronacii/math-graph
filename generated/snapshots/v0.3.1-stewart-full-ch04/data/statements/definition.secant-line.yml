statement:
  natural:
    es:
      text: >
        Una recta secante (de la palabra latina secans, que significa
        cortar) es una recta que interseca (corta) una curva en más
        de un punto.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        A secant line (from the Latin secans, "to cut") is a line
        that intersects (cuts) a curve in more than one point.
      is_original: false
