notes: >
  Stewart introduces this in §2.1 as part of the tangent-line
  motivation. The slope of the secant PQ is later limited to give
  the tangent slope (§2.7). No formal `depends_on` because Stewart
  treats "curve" and "line" as informal geometric primitives at
  this stage.
