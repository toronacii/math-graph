statement:
  natural:
    es:
      text: >
        Una función racional f es una razón de dos polinomios, es
        decir, f(x) = P(x)/Q(x), donde P y Q son polinomios. El
        dominio consta de todos los valores de x tales que Q(x) ≠ 0.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        A rational function f is a ratio of two polynomials,
        f(x) = P(x)/Q(x), where P and Q are polynomials. Its domain
        consists of all x such that Q(x) ≠ 0.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f(x) = \frac{P(x)}{Q(x)}, \qquad P, Q \text{ polinomios},\; Q(x) \ne 0
