statement:
  natural:
    es:
      text: >
        Si lím_{x→∞} [f(x) − (mx + b)] = 0, entonces la recta
        y = mx + b se llama asíntota inclinada (u oblicua) de la
        curva y = f(x), porque la distancia vertical entre la curva
        y la recta tiende a cero. (Una situación análoga ocurre
        cuando x → −∞.)
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If lim_{x→∞} [f(x) − (mx + b)] = 0, then the line
        y = mx + b is called a slant (or oblique) asymptote of the
        curve y = f(x), since the vertical distance between the
        curve and the line tends to zero. (An analogous situation
        holds for x → −∞.)
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      y = mx + b \text{ is a slant asymptote of } y = f(x) \iff
      \lim_{x \to \pm\infty} \bigl[f(x) - (mx + b)\bigr] = 0
      \quad (m \neq 0)
    status: present
    review_status: unreviewed

