notes: >
  Stewart §4.5 page 315. The slant case requires m ≠ 0 — when m = 0
  the limit condition reduces to lim f(x) = b, the horizontal-
  asymptote definition (Ch2 §2.6). For rational functions, slant
  asymptotes occur precisely when deg(num) = deg(denom) + 1, and
  the line is found by polynomial long division. The §4.5 curve-
  sketching guide (steps A–H) and §4.6 (graphing with technology)
  introduce no further entities — they are pedagogical schemas
  that compose previously-defined criteria (continuity, asymptotes,
  monotonicity, concavity, extrema, inflection points). Per the
  policy on Type-B/schema entities, those guides are intentionally
  not modeled as nodes; this slant-asymptote definition is the
  only formal new content of §4.5.
