statement:
  natural:
    es:
      text: >
        Si g es derivable en x y f es derivable en g(x), entonces
        la función compuesta F = f ∘ g definida por F(x) = f(g(x))
        es derivable en x y F'(x) = f'(g(x)) · g'(x). En notación
        de Leibniz, si y = f(u) y u = g(x) son derivables, entonces
        dy/dx = (dy/du)(du/dx).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If g is differentiable at x and f is differentiable at
        g(x), then the composite function F = f ∘ g defined by
        F(x) = f(g(x)) is differentiable at x and
        F'(x) = f'(g(x)) · g'(x). In Leibniz notation,
        dy/dx = (dy/du)(du/dx).
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      F(x) = f\bigl(g(x)\bigr)
        \;\Longrightarrow\;
        F'(x) \;=\; f'\bigl(g(x)\bigr)\cdot g'(x)
        \quad\text{i.e.}\quad
        \frac{dy}{dx} \;=\; \frac{dy}{du}\,\frac{du}{dx}
    status: present
    review_status: unreviewed

