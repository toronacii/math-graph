notes: >
  Stewart attributes the chain rule historically to James Gregory
  (1638–1675). The intuitive proof sketch (Δy/Δx = (Δy/Δu)(Δu/Δx))
  fails when Δu = 0 even with Δx ≠ 0; Stewart provides the rigorous
  proof at the end of the section using the increment-form
  characterization of differentiability.
