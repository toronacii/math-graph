statement:
  natural:
    es:
      text: >
        Sea c un número en el dominio D de una función f. Entonces
        f(c) es el valor máximo absoluto (o máximo global) de f
        sobre D si f(c) ≥ f(x) para toda x ∈ D.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        Let c be a number in the domain D of a function f. Then
        f(c) is the absolute maximum value (or global maximum) of
        f on D if f(c) ≥ f(x) for every x ∈ D.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f(c) = \max_{x \in D} f(x) \iff \forall x \in D,\; f(c) \ge f(x)
    status: present
    review_status: unreviewed

