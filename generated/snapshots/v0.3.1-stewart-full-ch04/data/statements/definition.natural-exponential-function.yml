statement:
  natural:
    es:
      text: >
        La función exponencial natural es la función exponencial
        f(x) = eˣ, donde e ≈ 2.71828 es el número irracional
        caracterizado por que la pendiente de la tangente a la
        gráfica de y = eˣ en x = 0 es igual a 1.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The natural exponential function is the exponential function
        f(x) = eˣ, where e ≈ 2.71828 is the irrational number
        characterized by the property that the slope of the tangent
        line to y = eˣ at x = 0 equals 1.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f(x) = e^{x}, \qquad e \approx 2.71828
