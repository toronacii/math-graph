statement:
  natural:
    es:
      text: >
        La función exponencial natural f(x) = e^x es derivable en
        todo R, y (d/dx) e^x = e^x. En particular, la pendiente de
        la recta tangente a y = e^x en cualquier punto es igual a
        la coordenada y de ese punto.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The natural exponential function f(x) = e^x is differentiable
        on all of R, and (d/dx) e^x = e^x. In particular, the slope
        of the tangent line to y = e^x at any point equals the
        y-coordinate of that point.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \frac{d}{dx}\,e^{x} \;=\; e^{x}
