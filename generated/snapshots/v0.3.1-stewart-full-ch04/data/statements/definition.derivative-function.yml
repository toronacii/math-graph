statement:
  natural:
    es:
      text: >
        Sea f una función. La función derivada de f, denotada f',
        se define haciendo variar el punto base de la derivada
        puntual: para cada x donde el límite existe,
        f'(x) = lím_{h→0} (f(x + h) − f(x))/h. El dominio de f' es
        el conjunto {x : f'(x) existe} y puede ser estrictamente
        menor que el dominio de f. En notación de Leibniz se
        escribe dy/dx, df/dx, (d/dx)f(x), Df(x) o D_x f(x).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        Let f be a function. The derivative function of f, denoted
        f', is obtained by letting the base point of the pointwise
        derivative vary: for each x where the limit exists,
        f'(x) = lim_{h→0} (f(x + h) − f(x))/h. The domain of f' is
        {x : f'(x) exists} and may be strictly smaller than the
        domain of f. In Leibniz notation it is written dy/dx,
        df/dx, (d/dx)f(x), Df(x) or D_x f(x).
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f'(x) \;=\; \lim_{h \to 0} \frac{f(x + h) - f(x)}{h}
    status: present
    review_status: unreviewed

