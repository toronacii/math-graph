notes: >
  Distinct node from definition.derivative-at-point: the pointwise
  derivative is a number, the derivative function is a function.
  The domain shrinkage (e.g., f(x) = √x has domain [0,∞) but f'
  has domain (0,∞)) is a consequence of this distinction and
  motivates definition.differentiable-on-interval. Includes the
  Leibniz notation cluster as semantic_kind: notation.
