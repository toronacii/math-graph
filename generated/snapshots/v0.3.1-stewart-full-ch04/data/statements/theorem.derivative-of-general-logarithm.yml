statement:
  natural:
    es:
      text: >
        Para cualquier base a > 0 con a ≠ 1, la derivada del
        logaritmo en base a es (d/dx) log_a x = 1/(x ln a),
        para x > 0.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        For any base a > 0 with a ≠ 1, the derivative of the
        base-a logarithm is (d/dx) log_a x = 1/(x ln a),
        for x > 0.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \frac{d}{dx}\,\log_{a} x \;=\; \frac{1}{x\,\ln a}\qquad (a>0,\ a\neq 1,\ x>0)
    status: present
    review_status: unreviewed

