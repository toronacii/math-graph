statement:
  natural:
    es:
      text: >
        Si f es continua sobre un intervalo cerrado [a, b], entonces
        f alcanza un valor máximo absoluto f(c) y un valor mínimo
        absoluto f(d) en algunos números c y d en [a, b].
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If f is continuous on a closed interval [a, b], then f
        attains an absolute maximum value f(c) and an absolute
        minimum value f(d) at some numbers c and d in [a, b].
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f \in C([a,b]) \implies \exists c, d \in [a,b]:\;
      f(c) = \max_{[a,b]} f \;\wedge\; f(d) = \min_{[a,b]} f
    status: present
    review_status: unreviewed

