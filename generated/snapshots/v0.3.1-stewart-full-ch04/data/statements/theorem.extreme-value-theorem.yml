notes: >
  Stewart Theorem 3 §4.1 page 275. The proof is explicitly omitted
  ("aun cuando el teorema del valor extremo es muy aceptable a
  nivel intuitivo, su demostración es difícil, por consiguiente,
  se omite") — deferred to Apéndice F. Both hypotheses (continuity
  AND closed interval) are necessary, as Stewart illustrates with
  Figures 8 (discontinuous) and 9 (open interval). Multi-source
  disambiguation note for future Rudin merge: this theorem is the
  R-restriction of "continuous image of compact set is compact"
  (Rudin Theorem 4.16); per the AGENTS.md disambiguation guide,
  the more general topological version will be a SEPARATE node and
  this theorem becomes a corollary via Heine-Borel.
