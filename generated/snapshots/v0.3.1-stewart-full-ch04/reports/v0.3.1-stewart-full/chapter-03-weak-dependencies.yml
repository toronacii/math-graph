# ---------------------------------------------------------------------------
# C. Implicit / Informal Dependencies
# ---------------------------------------------------------------------------

implicit_dependencies:
  - location: proof.derivatives-of-inverse-trigonometric-functions.implicit (§3.5)
    issue: >
      Stewart asserts informally (page 213) that "the inverse function
      of a one-to-one differentiable function is itself differentiable
      except where the tangent line is vertical." This is a non-trivial
      analytic theorem (inverse function theorem on R) treated as
      background. Encoded as dependency_confidence:medium on the proof.

  - location: proof.derivatives-of-inverse-hyperbolic-functions.implicit (§3.11)
    issue: >
      Same handwave repeated for hyperbolic case (page 261). Same
      treatment.

  - location: proof.exponential-growth-decay-solution.verification (§3.8)
    issue: >
      Stewart proves only existence (verifies that y(t) = y₀ e^(kt)
      satisfies y' = ky). Uniqueness — every solution to y' = ky
      with y(0) = y₀ has this form — is implicit. Full uniqueness
      proof requires §9.4 separable equations or Picard-Lindelöf.
      Encoded as a `notes:` field on the theorem; flagged here as
      uniqueness debt.

  - location: theorem.exp-function-existence (carryover, §3.1 first cited)
    issue: >
      Stewart presupposes the existence of a function f satisfying
      f(0)=1 and f' = f without constructing it. The constructive
      definition (via series, or as inverse of ln) is deferred to
      Ch7/Apéndice. Recorded as deferred proof.

  - location: theorem.special-trig-limit (carryover from §2.3, used in §3.3)
    issue: >
      lim_{x→0} sin(x)/x = 1. Stewart's geometric proof (§2.3
      Example 8) uses the squeeze theorem and an inequality on
      arc length and tangent length that is itself unproven (it
      tacitly uses the definition of radian measure and arc length,
      which are not formalized in Stewart Ch1–3). Carried as
      dependency_confidence:medium.

