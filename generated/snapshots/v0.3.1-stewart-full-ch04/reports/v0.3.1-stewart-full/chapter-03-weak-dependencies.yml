# ---------------------------------------------------------------------------
# E. Open Terminology / Naming Concerns
# ---------------------------------------------------------------------------

terminology_warnings:
  - issue: linear-function vs linear-approximation
    detail: >
      Stewart §3.10 introduces "linearization" L(x) = f(a) + f'(a)(x − a)
      and uses the phrase "approximation by a linear function" — but
      L is affine, not linear in the algebraic sense. Carried from Ch1
      epistemic debt; flagged in title field of definition.linearization.

  - issue: differential dy notation overload
    detail: >
      Stewart §3.10 defines dy = f'(x) dx with dx as an independent
      variable — a notational convention that conflicts with the
      Ch4–Ch5 use of dx as integration variable and the Leibniz
      dy/dx as quotient. Modeled atomically (definition.differential)
      but the relationship to the Leibniz convention is not yet
      formalized. Will be revisited when integration is introduced
      in Ch5.

  - issue: number-e definition recursion
    detail: >
      §3.1 introduces e as "the unique number such that
      lim_{h→0} (e^h − 1)/h = 1" (operational definition).
      §3.6 derives e = lim_{n→∞} (1 + 1/n)^n (Equation 5)
      from the derivative of the natural logarithm. The two
      characterizations are mathematically equivalent but appear
      in different sections; modeled as
      theorem.number-e-as-limit with proof.number-e-as-limit.from-derivative-at-1
      to make the derivation chain explicit. No circularity in the
      graph, but Stewart's narrative is not strictly bottom-up.

