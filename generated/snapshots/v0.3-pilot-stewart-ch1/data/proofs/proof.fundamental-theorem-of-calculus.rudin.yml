notes: >
  Choose partition P with U(P,f) - L(P,f) < epsilon. MVT gives t_i
  with F(x_i) - F(x_{i-1}) = f(t_i) Delta x_i. Thus
  sum f(t_i) Delta x_i = F(b) - F(a). By Theorem 6.7(c),
  |F(b) - F(a) - integral f| < epsilon.
