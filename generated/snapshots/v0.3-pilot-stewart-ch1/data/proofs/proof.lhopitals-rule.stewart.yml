id: proof.lhopitals-rule.stewart
type: proof
status: draft

proves: theorem.lhopitals-rule

uses:
  - theorem.mean-value-theorem
  - definition.indeterminate-form
  - theorem.limit-laws

style: direct
sources:
  - work: Cálculo de una variable — Trascendentes tempranas
    author: James Stewart
    edition: "7"
    chapter: "4"
    section: "4.4"

confidence: medium
notes: >
  Stewart proves the 0/0 case for x→a using a generalized Mean Value
  Theorem (Cauchy MVT). For f(a) = g(a) = 0, there exists c between
  a and x with f(x)/g(x) = f'(c)/g'(c). As x→a, c→a, giving the
  result. The ∞/∞ case requires a more delicate argument not fully
  given in the text.
