    author: James Stewart
    edition: "7"
    chapter: "3"
    section: "3.3"

confidence: high
notes: >
  sin(x+h) = sin x cos h + cos x sin h by the addition formula.
  Then [sin(x+h) - sin x]/h = sin x · (cos h - 1)/h + cos x · sin h/h.
  As h→0, (cos h - 1)/h → 0 and sin h/h → 1, giving cos x.
