notes: >
  Let h = f/g. Then (h(t) - h(x))/(t - x) =
  (1/(g(t)g(x)))[g(x)(f(t)-f(x))/(t-x) - f(x)(g(t)-g(x))/(t-x)].
  Letting t → x, applying Theorems 4.4 and 5.2, we obtain (c).
