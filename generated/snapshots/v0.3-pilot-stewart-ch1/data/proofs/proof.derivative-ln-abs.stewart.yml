id: proof.derivative-ln-abs.stewart
type: proof
status: draft

proves: theorem.derivative-ln-abs

uses:
  - theorem.derivative-ln
  - theorem.chain-rule
  - definition.absolute-value

style: direct
sources:
  - work: Cálculo de una variable — Trascendentes tempranas
    author: James Stewart
    edition: "7"
    chapter: "3"
    section: "3.6"

confidence: high
notes: >
  Case x > 0: ln|x| = ln x, so d/dx = 1/x.
  Case x < 0: ln|x| = ln(-x), so d/dx = (1/(-x))(-1) = 1/x
  by the chain rule. In both cases, d/dx(ln|x|) = 1/x.
