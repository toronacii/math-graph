id: theorem.mean-value-theorem-integrals
type: theorem
status: draft

title:
  en: Mean Value Theorem for Integrals
  es: Teorema del valor medio para integrales

statement:
  natural:
    es: >
      Si f es continua en [a, b], entonces existe un número c en
      [a, b] tal que f(c) = f_prom = (1/(b-a)) ∫_a^b f(x) dx,
      es decir, ∫_a^b f(x) dx = f(c)(b - a).
    en: >
      If f is continuous on [a, b], then there exists a number c in
      [a, b] such that f(c) = f_avg = (1/(b-a)) ∫_a^b f(x) dx,
      that is, ∫_a^b f(x) dx = f(c)(b - a).
  latex: |
    \int_a^b f(x)\,dx = f(c)(b - a)
    \quad\text{for some } c \in [a, b]

proved_by:
  - proof.mean-value-theorem-integrals.stewart

sources:
  - work: Cálculo de una variable — Trascendentes tempranas
    author: James Stewart
    edition: "7"
    chapter: "6"
    section: "6.5"

confidence: high
notes: >
  Stewart presents this as a consequence of the Intermediate Value
  Theorem applied to the integral function. It guarantees the
  existence of a point where the function attains its average value.
