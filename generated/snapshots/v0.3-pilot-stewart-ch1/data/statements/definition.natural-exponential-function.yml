statement:
  natural:
    es:
      text: >
        La función exponencial natural es la función exponencial
        f(x) = eˣ, donde e es el número de Euler, definido como el
        número tal que la recta tangente a y = eˣ en el punto (0, 1)
        tiene pendiente exactamente 1. El valor de e es
        aproximadamente 2.71828.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The natural exponential function is the exponential function
        f(x) = eˣ, where e is Euler's number, defined as the number
        such that the tangent line to y = eˣ at the point (0, 1) has
        slope exactly 1. The value of e is approximately 2.71828.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f(x) = e^x, \qquad e \approx 2.71828
