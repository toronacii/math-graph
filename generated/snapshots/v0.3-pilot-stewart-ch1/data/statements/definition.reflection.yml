statement:
  natural:
    es:
      text: >
        La gráfica de y = -f(x) es la reflexión de la gráfica de
        y = f(x) respecto al eje x. La gráfica de y = f(-x) es la
        reflexión de la gráfica de y = f(x) respecto al eje y.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The graph of y = -f(x) is the reflection of the graph of
        y = f(x) about the x-axis. The graph of y = f(-x) is the
        reflection of the graph of y = f(x) about the y-axis.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      y = -f(x) \quad \text{(eje } x\text{)}, \qquad y = f(-x) \quad \text{(eje } y\text{)}
    status: present
    review_status: unreviewed

