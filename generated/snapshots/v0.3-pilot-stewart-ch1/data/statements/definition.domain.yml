statement:
  natural:
    es:
      text: >
        El dominio de una función f es el conjunto D de todos los valores
        admisibles de la variable independiente x para los que f(x) está
        definido.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The domain of a function f is the set D of all admissible values
        of the independent variable x for which f(x) is defined.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
