title:
  es:
    text: Traslación horizontal
    is_original: true
    origin: original
    review_status: unreviewed
  en:
    text: Horizontal shift
    is_original: false
    origin: llm
    generated_by: "llm:claude-opus-4.7"
    review_status: unreviewed

statement:
  natural:
    es:
      text: >
        Si c > 0, la gráfica de y = f(x - c) se obtiene desplazando la
        gráfica de y = f(x) hacia la derecha c unidades. La gráfica de
        y = f(x + c) se obtiene desplazando la gráfica hacia la
        izquierda c unidades.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If c > 0, the graph of y = f(x - c) is obtained by shifting the
        graph of y = f(x) to the right c units. The graph of y = f(x + c)
        is obtained by shifting the graph to the left c units.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      y = f(x - c), \qquad c > 0
    status: present
    review_status: unreviewed

