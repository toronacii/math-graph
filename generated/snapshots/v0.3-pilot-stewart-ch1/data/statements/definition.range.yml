statement:
  natural:
    es:
      text: >
        El rango de una función f es el conjunto de todos los valores
        posibles f(x) cuando x recorre todo el dominio.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The range of a function f is the set of all possible values f(x)
        as x varies throughout the domain.
      is_original: false
