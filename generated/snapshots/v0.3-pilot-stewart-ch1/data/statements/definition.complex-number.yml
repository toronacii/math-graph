id: definition.complex-number
type: definition
status: draft

title:
  en: Complex Number

statement:
  natural:
    en: >
      A complex number is an ordered pair (a, b) of real numbers.
      We write x = y if and only if a = c and b = d, where
      x = (a, b) and y = (c, d). Addition and multiplication are
      defined by x + y = (a + c, b + d) and xy = (ac - bd, ad + bc).
  latex: |
    x + y = (a+c,\; b+d), \quad xy = (ac - bd,\; ad + bc)

sources:
  - work: Principles of Mathematical Analysis
    author: Walter Rudin
    edition: "3"
    chapter: "1"
    section: "1.24"

confidence: high
notes: >
  Rudin 1.24. Complex numbers defined constructively as ordered
  pairs of reals, without reference to √(-1).
