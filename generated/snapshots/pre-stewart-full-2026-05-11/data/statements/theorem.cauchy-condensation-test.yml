id: theorem.cauchy-condensation-test
type: theorem
status: draft

title:
  en: Cauchy Condensation Test

statement:
  natural:
    en: >
      If a_1 ≥ a_2 ≥ ... ≥ 0, then Σa_n converges if and only if Σ2^k a_{2^k} converges.

  latex: |
    a_1 \geq a_2 \geq \cdots \geq 0 \implies \left( \sum_{n=1}^{\infty} a_n \text{ conv.} \iff \sum_{k=0}^{\infty} 2^k a_{2^k} \text{ conv.} \right)

proved_by:
  - proof.cauchy-condensation-test.rudin

sources:
  - work: Principles of Mathematical Analysis
    author: Walter Rudin
    edition: "3"
    chapter: "3"
    section: "3.27"

confidence: high
notes: >
  Theorem 3.27 from Rudin.
