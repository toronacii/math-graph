statement:
  natural:
    es:
      text: >
        Una función lineal es una función de la forma f(x) = mx + b,
        donde m es la pendiente y b es la ordenada al origen. Su
        gráfica es una línea recta.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        A linear function is a function of the form f(x) = mx + b,
        where m is the slope and b is the y-intercept. Its graph is a
        straight line.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
