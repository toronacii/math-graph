statement:
  natural:
    es:
      text: >
        Una función f es impar si para todo x en su dominio se cumple
        f(-x) = -f(x). Geométricamente, la gráfica de una función impar
        es simétrica respecto al origen.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        A function f is odd if f(-x) = -f(x) for every x in its domain.
        Geometrically, the graph of an odd function is symmetric about
        the origin.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
