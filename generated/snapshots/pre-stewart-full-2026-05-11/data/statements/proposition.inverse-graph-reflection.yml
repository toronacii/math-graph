statement:
  natural:
    es:
      text: >
        Si f es una función inyectiva, entonces la gráfica de f⁻¹ se
        obtiene reflejando la gráfica de f respecto a la recta y = x.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If f is a one-to-one function, then the graph of f⁻¹ is
        obtained by reflecting the graph of f about the line y = x.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
