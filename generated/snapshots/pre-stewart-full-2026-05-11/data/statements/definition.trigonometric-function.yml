statement:
  natural:
    es:
      text: >
        Las funciones trigonométricas son las funciones seno, coseno,
        tangente, cotangente, secante y cosecante. Se definen en términos
        de las razones de los lados de un triángulo rectángulo o, de
        manera más general, usando el círculo unitario.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The trigonometric functions are the sine, cosine, tangent,
        cotangent, secant, and cosecant functions. They are defined in
        terms of the ratios of the sides of a right triangle or, more
        generally, using the unit circle.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: ""
    status: not_applicable
    notes: >
      Stewart reviews the trig functions as a family without giving a
      single defining formula at this point; specific formulas for
      each member belong to dedicated nodes if added later.
