statement:
  natural:
    es:
      text: >
        Sea f una función inyectiva con dominio A y rango B. Entonces
        su función inversa f⁻¹ tiene dominio B y rango A y se define
        por f⁻¹(y) = x si y sólo si f(x) = y, para toda y en B.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        Let f be a one-to-one function with domain A and range B. Then
        its inverse function f⁻¹ has domain B and range A and is
        defined by f⁻¹(y) = x if and only if f(x) = y, for every y
        in B.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f^{-1}(y) = x \iff f(x) = y, \qquad y \in B
    status: present
    review_status: unreviewed

