      elementary functions: by definition no function is both. They
      are disjoint, hence incomparable under generalization.
      Overloaded use of `incomparable` for disjoint/complementary
      classes — see audit finding (frozen vocab lacks `disjoint`).
      Edge recorded on the alphabetically-earlier id per policy 04.

