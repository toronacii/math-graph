statement:
  natural:
    es:
      text: >
        Una función trascendente es una función que no es algebraica.
        Entre las funciones trascendentes se incluyen las funciones
        trigonométricas, exponenciales y logarítmicas.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        A transcendental function is a function that is not algebraic.
        Transcendental functions include the trigonometric, exponential,
        and logarithmic functions.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
