    source_language: es

sketch:
  es:
    text: >
      Cada ley se deriva de la ley de exponentes correspondiente
      vía la relación inversa entre logₐ y aˣ: si u = logₐx y
      v = logₐy entonces aᵘ = x y aᵛ = y, y se aplica la ley de
      exponentes correspondiente seguida de logₐ.
    is_original: true
