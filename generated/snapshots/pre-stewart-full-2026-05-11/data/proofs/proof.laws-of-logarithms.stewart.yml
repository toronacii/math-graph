parts:
  - name: product-law
    kind: case
    description: >
      Set u = logₐ(x), v = logₐ(y). Then aᵘ = x and aᵛ = y, so
      x·y = aᵘ⁺ᵛ by the product law of exponents. Applying logₐ
      gives logₐ(xy) = u + v = logₐ(x) + logₐ(y).
    uses: []
  - name: quotient-law
    kind: case
    description: >
      Same set-up. From aᵘ⁻ᵛ = aᵘ/aᵛ = x/y (by the quotient law of
      exponents), apply logₐ to obtain logₐ(x/y) = u − v.
    uses: []
  - name: power-law
    kind: case
    description: >
      Set u = logₐ(x), so aᵘ = x. Then xʳ = (aᵘ)ʳ = aᵘʳ by the
      power law of exponents. Applying logₐ gives logₐ(xʳ) = r·u.
    uses: []

sources:
  - work: Cálculo de una variable — Trascendentes tempranas
    author: James Stewart
    edition: "7"
