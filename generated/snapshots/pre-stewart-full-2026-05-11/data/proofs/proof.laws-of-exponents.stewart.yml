    notes: >
      Stewart asserts the laws by appeal to the intuitive
      (precalculus) construction of a^x for real x.

sources:
  - work: Cálculo de una variable — Trascendentes tempranas
    author: James Stewart
    edition: "7"
    chapter: "1"
    section: "1.4"
    locator: "Leyes de los exponentes (sección 1.4) — sin demostración"
    source_language: es

sketch:
  es:
    text: >
      Stewart no demuestra las leyes en la sección 1.4: las acepta
      como hechos conocidos del precálculo, extendidos por
      continuidad de exponentes racionales a exponentes reales. Una
      demostración rigurosa requiere o bien la construcción del
      exponencial real vía supremos / continuidad, o bien la
      identidad a^x = exp(x · ln a) una vez que el logaritmo natural
      se define analíticamente. Ese desarrollo aparece en capítulos
      posteriores (y formalmente en Rudin).
