confidence: high
notes: >
  Choose delta < epsilon with |phi(s) - phi(t)| < epsilon when |s-t| <= delta.
  Since f in R(alpha), find P with U(P,f,alpha) - L(P,f,alpha) < delta^2.
  Split indices into A (M_i - m_i < delta) and B (M_i - m_i >= delta).
  For A: M_i* - m_i* < epsilon. For B: sum Delta alpha_i < delta.
  Then U(P,h,alpha) - L(P,h,alpha) < epsilon[alpha(b) - alpha(a) + 2K].
