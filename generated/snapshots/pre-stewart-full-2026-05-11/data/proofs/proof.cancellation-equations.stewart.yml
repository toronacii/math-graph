schema_version: "0.3.0"
id: proof.cancellation-equations.stewart
type: proof
status: extracted

proves: proposition.cancellation-equations
style: direct

uses:
  - id: definition.inverse-function
    role: definition
    confidence: high
    implicit: false
  - id: definition.one-to-one-function
    role: definition
    confidence: high
    implicit: false

parts:
  - name: left-cancellation
    kind: case
    description: >
      Apply the defining biconditional f⁻¹(y) = x ⇔ f(x) = y with
      y = f(x): the right-hand side holds trivially, so f⁻¹(f(x)) = x
      for every x in the domain of f.
    uses: []
  - name: right-cancellation
    kind: case
    description: >
      Apply the same biconditional with x = f⁻¹(y): the right-hand side
      becomes f(f⁻¹(y)) = y, valid for every y in the domain of f⁻¹.
    uses: []

sources:
  - work: Cálculo de una variable — Trascendentes tempranas
    author: James Stewart
    edition: "7"
    chapter: "1"
    section: "1.5"
    locator: "Ecuaciones de cancelación (sección 1.5)"
    source_language: es

sketch:
  es:
    text: >
      Las dos identidades se obtienen sustituyendo directamente en la
      definición de inversa f⁻¹(y) = x ⇔ f(x) = y. La primera con
      y = f(x); la segunda con x = f⁻¹(y).
    is_original: true
    origin: human
    review_status: unreviewed

