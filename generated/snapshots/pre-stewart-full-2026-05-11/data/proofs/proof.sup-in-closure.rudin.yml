proves: proposition.sup-in-closure

uses:
  - definition.closure
  - definition.supremum

style: direct
sources:
  - work: Principles of Mathematical Analysis
    author: Walter Rudin
    edition: "3"
    chapter: "2"
    section: "2.28"

confidence: high
notes: >
  If y ∉ E, for every h > 0 there exists x ∈ E with y-h < x < y (else y-h is upper bound). So y is limit point of E, hence y ∈ E̅.
