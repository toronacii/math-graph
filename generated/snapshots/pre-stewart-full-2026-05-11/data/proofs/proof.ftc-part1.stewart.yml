notes: >
  g'(x) = lim(h→0) [g(x+h) - g(x)]/h = lim(h→0) (1/h)∫_x^{x+h} f(t)dt.
  By the comparison property, for h > 0: h·m(h) ≤ ∫_x^{x+h}f(t)dt ≤ h·M(h)
  where m(h) and M(h) are the min and max of f on [x, x+h]. Since f
  is continuous, both m(h) and M(h) → f(x) as h→0 by squeeze.
