id: proof.power-rule.stewart
type: proof
status: draft

proves: theorem.power-rule

uses:
  - definition.derivative-function
  - theorem.limit-laws

style: direct
sources:
  - work: Cálculo de una variable — Trascendentes tempranas
    author: James Stewart
    edition: "7"
    chapter: "3"
    section: "3.1"

confidence: medium
notes: >
  For positive integer n, expand (x+h)^n using the Binomial Theorem:
  (x+h)^n = x^n + nx^{n-1}h + terms with h^2 or higher. Then
  f'(x) = lim(h→0) [(x+h)^n - x^n]/h = nx^{n-1}. The general case
  (all real n) is deferred to section 3.6 via logarithmic differentiation.
