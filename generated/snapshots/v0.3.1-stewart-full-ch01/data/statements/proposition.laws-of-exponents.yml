statement:
  natural:
    es:
      text: >
        Si a, b > 0 y x, y son números reales cualesquiera:
        (1) a^(x+y) = aˣ · aʸ;
        (2) a^(x−y) = aˣ / aʸ;
        (3) (aˣ)ʸ = a^(x·y);
        (4) (a·b)ˣ = aˣ · bˣ.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If a, b > 0 and x, y are any real numbers:
        (1) a^(x+y) = aˣ · aʸ;
        (2) a^(x−y) = aˣ / aʸ;
        (3) (aˣ)ʸ = a^(x·y);
        (4) (a·b)ˣ = aˣ · bˣ.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      a^{x+y} = a^{x} a^{y}, \quad
      a^{x-y} = \tfrac{a^{x}}{a^{y}}, \quad
      (a^{x})^{y} = a^{xy}, \quad
      (ab)^{x} = a^{x} b^{x}
    status: present
    review_status: unreviewed

