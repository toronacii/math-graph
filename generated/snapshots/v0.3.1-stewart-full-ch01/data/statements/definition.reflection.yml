statement:
  natural:
    es:
      text: >
        La gráfica de y = −f(x) se obtiene reflejando la gráfica de
        y = f(x) respecto al eje x. La gráfica de y = f(−x) se
        obtiene reflejándola respecto al eje y.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The graph of y = −f(x) is obtained by reflecting the graph
        of y = f(x) about the x-axis. The graph of y = f(−x) is
        obtained by reflecting it about the y-axis.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \text{x-axis: } g(x) = -f(x); \qquad
      \text{y-axis: } g(x) = f(-x)
