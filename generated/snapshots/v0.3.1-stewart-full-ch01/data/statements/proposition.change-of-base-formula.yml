statement:
  natural:
    es:
      text: >
        Para cualesquiera bases positivas a, b distintas de 1, y para
        todo x > 0, se cumple logₐ x = (ln x) / (ln a), y más
        generalmente log_b x = (logₐ x) / (logₐ b).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        For any positive bases a, b different from 1, and for every
        x > 0, logₐ x = (ln x) / (ln a) and, more generally,
        log_b x = (logₐ x) / (logₐ b).
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \log_b x = \frac{\log_a x}{\log_a b}, \qquad
      \log_a x = \frac{\ln x}{\ln a}
    status: present
    review_status: unreviewed

