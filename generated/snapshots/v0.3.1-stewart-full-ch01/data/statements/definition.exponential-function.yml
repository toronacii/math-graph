statement:
  natural:
    es:
      text: >
        Una función exponencial es una función de la forma
        f(x) = aˣ, donde la base a es una constante positiva
        (a > 0, a ≠ 1). El dominio es R y el rango es (0, ∞).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        An exponential function is a function of the form
        f(x) = aˣ, where the base a is a positive constant
        (a > 0, a ≠ 1). The domain is R and the range is (0, ∞).
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f(x) = a^{x}, \qquad a > 0,\; a \ne 1
    status: present
    review_status: unreviewed

