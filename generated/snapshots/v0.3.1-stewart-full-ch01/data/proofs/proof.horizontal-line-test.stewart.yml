schema_version: "0.3.1"
id: proof.horizontal-line-test.stewart
type: proof
status: extracted

proves: proposition.horizontal-line-test
style: direct

uses:
  - id: definition.one-to-one-function
    role: definition
    confidence: high
    implicit: false
  - id: definition.graph-of-function
    role: definition
    confidence: high
    implicit: false

parts:
  - name: forward
    kind: direction
    description: >
      If f is one-to-one and a horizontal line y = c meets the graph
      at (x₁, c) and (x₂, c) with x₁ ≠ x₂, then f(x₁) = f(x₂) = c
      contradicts injectivity.
    uses: []
  - name: backward
    kind: direction
    description: >
      If no horizontal line meets the graph twice, then no two
      distinct x's share an output, so f is injective.
    uses: []

sources:
  - work: Cálculo de una variable — Trascendentes tempranas
    author: James Stewart
    edition: "7"
    chapter: "1"
    section: "1.6"
    locator: "Argumento informal junto a la prueba de la línea horizontal"
    source_language: es

sketch:
  es:
    text: >
      Stewart argumenta directamente desde la definición: una recta
      horizontal y = c interseca la gráfica de f en los puntos
      (x, c) tales que f(x) = c. Si dos x distintos producen el
      mismo c, f no es uno a uno; recíprocamente, si f es uno a uno,
      cada valor c se alcanza a lo más una vez.
    is_original: true
    origin: human
    review_status: unreviewed

