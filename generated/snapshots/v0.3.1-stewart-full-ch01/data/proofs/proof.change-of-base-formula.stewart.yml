sketch:
  es:
    text: >
      Sea y = log_b x, de modo que x = bʸ por las ecuaciones de
      cancelación. Tomando logₐ a ambos lados y aplicando la ley
      del exponente, logₐ x = y · logₐ b. Despejando y se obtiene
      y = (logₐ x) / (logₐ b). El caso natural a = e da
      logₐ x = (ln x) / (ln a) cuando se renombra la base.
