statement:
  natural:
    es:
      text: >
        Una función lineal es una función cuya gráfica es una recta;
        equivalentemente, puede escribirse en la forma f(x) = m x + b,
        donde m es la pendiente y b es la ordenada al origen.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        A linear function is a function whose graph is a straight
        line; equivalently, it can be written as f(x) = m x + b, where
        m is the slope and b is the y-intercept.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f(x) = m x + b, \qquad m, b \in \mathbb{R}
    status: present
    review_status: unreviewed

