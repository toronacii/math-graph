statement:
  natural:
    es:
      text: >
        Un modelo matemático es una descripción matemática (a menudo
        mediante una función o ecuación) de un fenómeno del mundo
        real, como el tamaño de una población, la demanda de un
        producto o la concentración de un contaminante en el aire,
        cuyo propósito es entender el fenómeno y hacer predicciones
        acerca de su comportamiento futuro.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        A mathematical model is a mathematical description (often via
        a function or equation) of a real-world phenomenon — such as
        a population size, product demand, or pollutant concentration
        — whose purpose is to understand the phenomenon and predict
        its future behavior.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
