statement:
  natural:
    es:
      text: >
        Si f es una función con dominio D, entonces su gráfica es el
        conjunto de pares ordenados {(x, f(x)) : x ∈ D}, considerado
        como subconjunto del plano coordenado.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If f is a function with domain D, its graph is the set of
        ordered pairs {(x, f(x)) : x ∈ D}, viewed as a subset of the
        coordinate plane.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \operatorname{graph}(f) = \{\, (x, f(x)) : x \in D \,\}
    status: present
    review_status: unreviewed

