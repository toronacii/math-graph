statement:
  natural:
    es:
      text: >
        El símbolo que representa un número en el rango de una función
        f, dependiente de la elección de la variable independiente, se
        llama variable dependiente.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The symbol that represents a number in the range of a function
        f, depending on the choice of independent variable, is called
        the dependent variable.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
