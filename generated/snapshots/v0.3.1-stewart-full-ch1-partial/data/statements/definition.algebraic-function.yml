statement:
  natural:
    es:
      text: >
        Una función f se llama algebraica si puede construirse a
        partir de polinomios mediante operaciones algebraicas (suma,
        resta, multiplicación, división y extracción de raíces).
        Toda función racional es automáticamente algebraica.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        A function f is called algebraic if it can be built from
        polynomials by algebraic operations (addition, subtraction,
        multiplication, division, and taking roots). Every rational
        function is automatically algebraic.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    status: informal
    body: |
      f \in \langle \text{polynomials}, +, -, \times, /, \sqrt[n]{\cdot} \rangle
    review_status: unreviewed

