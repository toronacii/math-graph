sketch:
  es:
    text: >
      Sea u = g(x) derivable en a y y = f(u) derivable en b = g(a).
      Por proposition.differentiable-increment-formula aplicada a g:
      Δu = [g'(a) + ε₁]·Δx, con ε₁ → 0 cuando Δx → 0.
      Aplicada a f: Δy = [f'(b) + ε₂]·Δu, con ε₂ → 0 cuando
      Δu → 0. Sustituyendo,
      Δy = [f'(b) + ε₂]·[g'(a) + ε₁]·Δx,
      por lo que Δy/Δx = [f'(b) + ε₂]·[g'(a) + ε₁].
      Como g es derivable, también es continua, luego Δu → 0
      cuando Δx → 0, y por tanto ε₂ → 0 cuando Δx → 0. Tomando
      el límite Δx → 0:
      F'(a) = lím Δy/Δx = f'(b)·g'(a) = f'(g(a))·g'(a).
      Esta demostración evita el defecto del argumento intuitivo
      (división entre Δu = 0).
    is_original: true
    origin: original
    review_status: unreviewed

