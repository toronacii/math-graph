id: proof.quotient-rule.stewart
type: proof
status: draft

proves: theorem.quotient-rule

uses:
  - definition.derivative-function
  - theorem.limit-laws
  - theorem.differentiable-implies-continuous

style: direct
sources:
  - work: Cálculo de una variable — Trascendentes tempranas
    author: James Stewart
    edition: "7"
    chapter: "3"
    section: "3.2"

confidence: high
notes: >
  [f(x+h)/g(x+h) - f(x)/g(x)]/h
  = [f(x+h)g(x) - f(x)g(x+h)] / [h · g(x+h)g(x)].
  Add and subtract f(x)g(x) in the numerator, apply limit laws,
  and use continuity of g to get g(x+h)→g(x).
