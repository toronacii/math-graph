sketch:
  es:
    text: >
      Sea g(x) = ∫_a^x f(t) dt. Para mostrar g'(x) = f(x) se usa la
      definición de derivada: g'(x) = lím_{h→0} [g(x+h)−g(x)]/h.
      La diferencia g(x+h)−g(x) = ∫_x^{x+h} f(t) dt. Si f tiene mínimo m
      y máximo M sobre [x, x+h] (por el TVM), la propiedad de acotación
      (Propiedad 8) da m·h ≤ ∫_x^{x+h} f(t) dt ≤ M·h, luego
      m ≤ [g(x+h)−g(x)]/h ≤ M.
      Por continuidad de f, m → f(x) y M → f(x) cuando h → 0, así que
      por el teorema del emparedado g'(x) = f(x).
