  - id: definition.derivative-at-point
    role: definition
    confidence: high
    notes: >
      The proof expands g'(x) using the limit definition of the derivative.
  - id: theorem.extreme-value-theorem
    role: essential
    confidence: high
    notes: >
      Guarantees f attains min m and max M on [x, x+h], giving the bound
      m·h ≤ g(x+h)−g(x) ≤ M·h.
  - id: proposition.definite-integral-bound
    role: essential
    confidence: high
    notes: >
      Comparison property (Property 8) bounds ∫_x^{x+h} f(t) dt between m·h and M·h.
  - id: theorem.squeeze-theorem
    role: essential
    confidence: high
    notes: >
      As h→0, continuity of f forces m→f(x) and M→f(x), so the squeeze closes
      the limit to g'(x) = f(x).
  - id: definition.continuity-at-point
    role: essential
    confidence: high
    notes: >
      Continuity of f is actively used: as h→0 the min m and max M on
      [x, x+h] both converge to f(x), which is the step that closes the
      squeeze argument. Without continuity the limit is not determined.

