sources:
  - work: Principles of Mathematical Analysis
    author: Walter Rudin
    edition: "3"
    chapter: "6"
    section: "6.20"

confidence: high
notes: >
  Continuity: |F(y) - F(x)| = |integral_x^y f| <= M(y-x) by 6.12(c)(d).
  Differentiability at x_0: if f continuous at x_0, choose delta so
  |f(t) - f(x_0)| < epsilon for |t - x_0| < delta. Then
  |(F(t) - F(s))/(t-s) - f(x_0)| = |1/(t-s) integral_s^t [f(u) - f(x_0)] du| < epsilon.
