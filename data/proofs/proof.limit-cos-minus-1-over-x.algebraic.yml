sketch:
  es:
    text: >
      Multiplíquese numerador y denominador por (cos θ + 1):
      (cos θ − 1)/θ
        = (cos θ − 1)(cos θ + 1) / (θ (cos θ + 1))
        = (cos² θ − 1) / (θ (cos θ + 1))
        = − sen² θ / (θ (cos θ + 1))     (identidad pitagórica)
        = − (sen θ / θ) · (sen θ / (cos θ + 1)).
      Tomando θ → 0, por la ley del producto y proposition.limit-sin-over-x,
      lím_{θ→0} (cos θ − 1)/θ = − 1 · (0 / (1 + 1)) = 0.
