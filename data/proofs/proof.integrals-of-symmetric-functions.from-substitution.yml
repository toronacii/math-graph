uses:
  - id: proposition.definite-integral-properties
    role: essential
    confidence: high
    notes: >
      Interval-additivity (Property 5) splits ∫_{-a}^a into ∫_{-a}^0 + ∫_0^a.
  - id: theorem.substitution-rule-definite
    role: essential
    confidence: high
    notes: >
      The substitution t = −x on the [−a, 0] piece transforms it to ∫_0^a f(−t) dt;
      limits change from [−a, 0] to [a, 0] and the −dt flips them to [0, a].
  - id: definition.definite-integral
    role: definition
