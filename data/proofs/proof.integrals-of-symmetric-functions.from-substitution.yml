sketch:
  es:
    text: >
      Se separa ∫_{-a}^a f(x) dx = ∫_{-a}^0 f(x) dx + ∫_0^a f(x) dx
      (aditividad). En la primera integral se hace t = −x, dt = −dx;
      cuando x = −a, t = a; cuando x = 0, t = 0. Así
      ∫_{-a}^0 f(x) dx = ∫_a^0 f(−t)(−dt) = ∫_0^a f(−t) dt.
      (a) Si f es par (f(−t) = f(t)):
          ∫_{-a}^a = ∫_0^a f(t) dt + ∫_0^a f(t) dt = 2∫_0^a f(x) dx.
      (b) Si f es impar (f(−t) = −f(t)):
          ∫_{-a}^a = −∫_0^a f(t) dt + ∫_0^a f(t) dt = 0.
