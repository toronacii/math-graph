notes: >
  Stewart's argument is informal: "La prueba de la primera derivada
  es una consecuencia de la prueba C/D. En el inciso a), por
  ejemplo, puesto que el signo de f'(x) cambia de positivo a
  negativo en c, f es creciente por la izquierda de c y decreciente
  por la derecha de c. Se deduce entonces que f tiene un máximo
  local en c." Style flagged informal because Stewart does not
  rigorously handle the boundary value f(c) — this requires
  continuity of f at c (given as hypothesis). Semantic confidence
  medium because the formalization of "sign change" relies on
  Stewart's informal phrasing, with a known counterexample for
  derivatives that oscillate (Stewart Ex 87).
