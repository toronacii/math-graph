notes: >
  Stewart's justification (p. 295): "el inciso a) es cierto porque
  f''(x) > 0 cerca de x = c y, por tanto, f es cóncava hacia arriba
  cerca de c. Esto significa que la gráfica está sobre su recta
  tangente horizontal en c y, por tanto, f tiene un mínimo local en
  x = c." Style flagged informal because the appeal to "the graph
  is above its tangent line ⇒ local min" is geometric. The proof
  inherits epistemic debt from proposition.concavity-test (proof
  deferred to Apéndice F). Semantic confidence medium for that
  reason.
