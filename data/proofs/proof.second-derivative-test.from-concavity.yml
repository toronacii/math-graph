sketch:
  es:
    text: >
      Caso a). f'(c) = 0 y f''(c) > 0. Por continuidad de f'' cerca
      de c, f''(x) > 0 en una vecindad, así que por la Prueba de
      concavidad f es cóncava hacia arriba ahí; la gráfica está
      sobre su recta tangente horizontal en c, luego f(x) ≥ f(c) en
      una vecindad: mínimo local. Caso b) análogo.
    is_original: true
    origin: original
    review_status: unreviewed

