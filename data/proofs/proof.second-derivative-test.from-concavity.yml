id: proof.second-derivative-test.from-concavity
type: proof
status: extracted

proves: proposition.second-derivative-test
style: informal

uses: []

parts:
  - name: case-min-positive-second-derivative
    kind: subclaim
    description: >
      Suppose f'(c) = 0 and f''(c) > 0. By continuity of f'' near c,
      there exists δ > 0 with f''(x) > 0 on (c−δ, c+δ). By the
      Concavity Test, f is concave up on (c−δ, c+δ); the graph of f
      lies above its tangent line at c. Since f'(c) = 0, that
      tangent is horizontal at height f(c), so f(x) ≥ f(c) on a
      neighborhood of c, i.e. c is a local minimum.
    uses:
      - id: proposition.concavity-test
        role: essential
        confidence: high
      - id: definition.continuity-at-point
        role: essential
        confidence: high
        notes: continuity of f'' at c is used to extend f''(c) > 0 to a neighborhood
      - id: definition.tangent-line
        role: essential
        confidence: high
      - id: definition.local-minimum
        role: definition
        confidence: high
      - id: definition.concave-up
        role: definition
        confidence: high

  - name: case-max-negative-second-derivative
    kind: subclaim
    description: >
      Symmetric: if f'(c) = 0 and f''(c) < 0, then f is concave down
      near c, the horizontal tangent at c lies above the graph, so
      f(x) ≤ f(c) on a neighborhood of c, hence c is a local
      maximum.
    uses:
      - id: proposition.concavity-test
        role: essential
        confidence: high
      - id: definition.local-maximum
        role: definition
        confidence: high
      - id: definition.concave-down
        role: definition
        confidence: high

