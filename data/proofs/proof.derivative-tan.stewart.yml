id: proof.derivative-tan.stewart
type: proof
status: draft

proves: theorem.derivative-tan

uses:
  - theorem.derivative-sin
  - theorem.derivative-cos
  - theorem.quotient-rule

style: direct
sources:
  - work: Cálculo de una variable — Trascendentes tempranas
    author: James Stewart
    edition: "7"
    chapter: "3"
    section: "3.3"

confidence: high
notes: >
  tan x = sin x / cos x. By the quotient rule:
  d/dx(tan x) = [cos x · cos x - sin x · (-sin x)] / cos²x
  = (cos²x + sin²x) / cos²x = 1/cos²x = sec²x.
