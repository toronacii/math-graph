notes: >
  Split ∫_{-a}^a = ∫_{-a}^0 + ∫_0^a. In the first integral,
  substitute u = -x: ∫_{-a}^0 f(x)dx = ∫_a^0 f(-u)(-du)
  = ∫_0^a f(-u)du. If f is even, this equals ∫_0^a f(u)du,
  giving 2∫_0^a. If f is odd, this equals -∫_0^a f(u)du,
  giving 0.
