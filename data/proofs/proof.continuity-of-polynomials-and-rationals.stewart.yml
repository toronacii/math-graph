parts:
  - name: polynomial
    kind: case
    description: P(x) = c_n x^n + … + c_0 is continuous on ℝ.
    uses: []
  - name: rational
    kind: case
    description: f = P/Q is continuous wherever Q ≠ 0.
    uses: []

sources:
  - work: Cálculo de una variable — Trascendentes tempranas
    author: James Stewart
    edition: "7"
