    notes: lim_{x→a} x^m = a^m (Ley 9), establishing continuity of x ↦ x^m
  - id: theorem.continuity-arithmetic
    role: essential
    confidence: high
    notes: >
      Constant-multiple (inciso 3) builds c x^m from x^m; sum
      (inciso 1) assembles the polynomial; quotient (inciso 5)
      handles the rational case where the denominator is non-zero.
