    section: "2.5"
    locator: "Demostración del Teorema 5"
    page: "122"
    source_language: es

sketch:
  es:
    text: >
      (a) lím_{x→a} c = c (Ley 7) y lím_{x→a} x^m = a^m (Ley 9),
      es decir, x ↦ x^m es continua. Por el inciso 3 del Teorema 4
      la función c·x^m es continua. Como P es una suma de tales
      funciones más una constante, por el inciso 1 del Teorema 4 P
      es continua. (b) Si f = P/Q con P, Q polinomiales y D = {x :
      Q(x) ≠ 0}, entonces P y Q son continuas en D y por el inciso 5
      del Teorema 4, f es continua en cada punto de D.
    is_original: true
    origin: original
    review_status: unreviewed

