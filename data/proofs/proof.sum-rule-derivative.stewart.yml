sketch:
  es:
    text: >
      Sea F(x) = f(x) + g(x). Por la definición de derivada,
      F'(x) = lím_{h→0} (F(x+h) − F(x))/h
            = lím_{h→0} ([f(x+h) + g(x+h)] − [f(x) + g(x)])/h
            = lím_{h→0} [(f(x+h) − f(x))/h + (g(x+h) − g(x))/h].
      Por la ley de la suma de los límites (ley 1),
      F'(x) = lím_{h→0} (f(x+h) − f(x))/h + lím_{h→0} (g(x+h) − g(x))/h
            = f'(x) + g'(x).
      Aplicación iterada extiende el resultado a sumas finitas
      arbitrarias.
