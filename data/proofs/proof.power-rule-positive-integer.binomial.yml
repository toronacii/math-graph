sketch:
  es:
    text: >
      Sea f(x) = x^n. Por el teorema del binomio,
      (x + h)^n = x^n + n x^{n−1} h + C(n,2) x^{n−2} h^2
                + ··· + n x h^{n−1} + h^n.
      Entonces
      f(x+h) − f(x) = n x^{n−1} h + C(n,2) x^{n−2} h^2
                    + ··· + n x h^{n−1} + h^n,
      y dividiendo entre h:
      (f(x+h) − f(x))/h = n x^{n−1} + C(n,2) x^{n−2} h
                        + ··· + n x h^{n−2} + h^{n−1}.
      Tomando h → 0, todos los términos excepto el primero tienen
      h como factor y tienden a 0. Por lo tanto
      f'(x) = n x^{n−1}.
