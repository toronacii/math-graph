sketch:
  es:
    text: >
      Sea f(x) = c. Por la definición de derivada,
      f'(x) = lím_{h→0} (f(x+h) − f(x))/h
            = lím_{h→0} (c − c)/h
            = lím_{h→0} 0
            = 0.
      Por lo tanto (d/dx) c = 0.
    is_original: true
    origin: original
    review_status: unreviewed

