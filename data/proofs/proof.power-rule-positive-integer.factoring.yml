sketch:
  es:
    text: >
      Sea f(x) = x^n. Por la identidad algebraica
      x^n − a^n = (x − a)(x^{n−1} + x^{n−2}a + ··· + xa^{n−2} + a^{n−1})
      (verificable por multiplicación directa o como suma
      geométrica), se tiene
      f'(a) = lím_{x→a} (x^n − a^n)/(x − a)
            = lím_{x→a} (x^{n−1} + x^{n−2}a + ··· + a^{n−1}).
      El límite contiene n términos, cada uno con valor a^{n−1}
      por sustitución directa. Por la ley de la suma,
      f'(a) = n·a^{n−1}. Renombrando a → x da
      (d/dx) x^n = n x^{n−1}.
    is_original: true
    origin: original
    review_status: unreviewed

