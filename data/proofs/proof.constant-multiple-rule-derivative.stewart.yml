sketch:
  es:
    text: >
      Sea g(x) = c·f(x). Por la definición de derivada,
      g'(x) = lím_{h→0} (g(x+h) − g(x))/h
            = lím_{h→0} (c·f(x+h) − c·f(x))/h
            = lím_{h→0} c·(f(x+h) − f(x))/h.
      Por la ley del múltiplo constante de los límites
      (ley 3 de los límites), se puede sacar c del límite:
      g'(x) = c·lím_{h→0} (f(x+h) − f(x))/h = c·f'(x).
    is_original: true
    origin: original
    review_status: unreviewed

