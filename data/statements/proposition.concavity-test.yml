notes: >
  Stewart §4.3 page 293. Stewart explicitly defers the proof to
  Apéndice F ("En el apéndice F se da una demostración con la ayuda
  del teorema del valor medio"); proved_by is empty here, marking
  this as epistemic debt — to be supplied if Apéndice F is ever
  extracted. The converse fails in general: f concave up does not
  imply f''(x) > 0 (e.g., f(x) = x⁴ is concave up at 0 but
  f''(0) = 0). The test as stated (strict inequality) is sufficient
  but not necessary.
