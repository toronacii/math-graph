statement:
  natural:
    es:
      text: >
        a) Si f''(x) > 0 para toda x en I, entonces la gráfica de f
        es cóncava hacia arriba sobre I. b) Si f''(x) < 0 para toda
        x en I, entonces la gráfica de f es cóncava hacia abajo
        sobre I.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        (a) If f''(x) > 0 for all x in I, then the graph of f is
        concave upward on I. (b) If f''(x) < 0 for all x in I, then
        the graph of f is concave downward on I.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \bigl(\forall x \in I:\ f''(x) > 0\bigr) \Rightarrow f \text{ concave up on } I
      \quad\wedge\quad
      \bigl(\forall x \in I:\ f''(x) < 0\bigr) \Rightarrow f \text{ concave down on } I
    status: present
    review_status: unreviewed

