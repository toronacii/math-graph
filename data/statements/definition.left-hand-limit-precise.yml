  en:
    text: Precise (epsilon–delta) definition of left-hand limit
    is_original: false
    origin: llm
    generated_by: "llm:claude-opus-4.7"
    review_status: unreviewed

statement:
  natural:
    es:
      text: >
        lím_{x→a⁻} f(x) = L si para todo ε > 0 existe un número
        δ > 0 tal que si a − δ < x < a entonces |f(x) − L| < ε.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        lim_{x→a⁻} f(x) = L if for every ε > 0 there is a number
        δ > 0 such that if a − δ < x < a then |f(x) − L| < ε.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \lim_{x \to a^{-}} f(x) = L
      \iff
      \forall \varepsilon > 0,\ \exists \delta > 0:\
      a - \delta < x < a \implies |f(x) - L| < \varepsilon
    status: present
    review_status: unreviewed

