statement:
  natural:
    es:
      text: >
        Para a ≤ b se tienen las siguientes propiedades de comparación:
        6. Si f(x) ≥ 0 para a ≤ x ≤ b, entonces ∫_a^b f(x) dx ≥ 0.
        7. Si f(x) ≥ g(x) para a ≤ x ≤ b, entonces
           ∫_a^b f(x) dx ≥ ∫_a^b g(x) dx.
        8. Si m ≤ f(x) ≤ M para a ≤ x ≤ b, entonces
           m(b − a) ≤ ∫_a^b f(x) dx ≤ M(b − a).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        For a ≤ b the following comparison properties hold:
        6. If f(x) ≥ 0 for a ≤ x ≤ b, then ∫_a^b f(x) dx ≥ 0.
        7. If f(x) ≥ g(x) for a ≤ x ≤ b, then
           ∫_a^b f(x) dx ≥ ∫_a^b g(x) dx.
        8. If m ≤ f(x) ≤ M for a ≤ x ≤ b, then
           m(b − a) ≤ ∫_a^b f(x) dx ≤ M(b − a).
      is_original: false
      origin: llm
      generated_by: "llm:claude-sonnet-4-6"
      review_status: unreviewed
  latex:
    body: |
      f(x) \ge 0 \;\Rightarrow\; \int_a^b f\,dx \ge 0;\qquad
      f \ge g \;\Rightarrow\; \int_a^b f\,dx \ge \int_a^b g\,dx;\\
      m \le f(x) \le M \;\Rightarrow\;
        m(b-a) \;\le\; \int_a^b f(x)\,dx \;\le\; M(b-a)
    status: present
    review_status: unreviewed

