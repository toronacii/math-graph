notes: >
  Property 8 is used as the key squeeze in the proof of TFC Part 1
  (proof.ftc-part-1.stewart): it bounds the increment (g(x+h)−g(x))/h
  between the min and max of f on [x, x+h]. Stewart gives a brief explicit
  proof of Property 8 in the text; Properties 6–7 are stated without separate
  proofs since they follow immediately from 8 and 1.
