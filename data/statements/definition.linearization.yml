statement:
  natural:
    es:
      text: >
        Sea f una función derivable en a. La linealización de f
        en a es la función lineal L(x) = f(a) + f'(a)(x − a).
        Su gráfica es la recta tangente a y = f(x) en el punto
        (a, f(a)).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        Let f be differentiable at a. The linearization of f at a
        is the linear function L(x) = f(a) + f'(a)(x − a). Its
        graph is the tangent line to y = f(x) at (a, f(a)).
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      L(x) \;=\; f(a) + f'(a)(x - a)
    status: present
    review_status: unreviewed

