id: definition.composition-of-functions
type: definition
status: draft

title:
  en: Composition of functions
  es: Composición de funciones

statement:
  natural:
    es: >
      Dadas dos funciones f y g, la función compuesta f ∘ g (también
      llamada composición de f y g) se define por (f ∘ g)(x) = f(g(x)).
      El dominio de f ∘ g es el conjunto de todos los x en el dominio de
      g tales que g(x) está en el dominio de f.
    en: >
      Given two functions f and g, the composite function f ∘ g (also
      called the composition of f and g) is defined by (f ∘ g)(x) = f(g(x)).
      The domain of f ∘ g is the set of all x in the domain of g such
      that g(x) is in the domain of f.
  latex: |
    (f \circ g)(x) = f(g(x))

sources:
  - work: Cálculo de una variable — Trascendentes tempranas
    author: James Stewart
    edition: "7"
    chapter: "1"
    section: "1.3"

confidence: medium
notes: >
  Stewart defines function composition in section 1.3 and emphasizes
  that the order of composition matters: f ∘ g ≠ g ∘ f in general.
