statement:
  natural:
    es:
      text: >
        Para una partícula cuya posición en el instante t es s(t),
        la velocidad promedio en el intervalo [t₁, t₂] es el cociente
        del cambio de posición entre el tiempo transcurrido,
        (s(t₂) − s(t₁)) / (t₂ − t₁).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        For a particle whose position at time t is s(t), the average
        velocity over the interval [t₁, t₂] is the ratio of the
        change in position to the elapsed time,
        (s(t₂) − s(t₁)) / (t₂ − t₁).
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \overline{v}_{[t_1,t_2]} \;=\;
      \frac{\,s(t_2) - s(t_1)\,}{t_2 - t_1}
    status: present
    review_status: unreviewed

