id: definition.odd-function
type: definition
status: draft

title:
  en: Odd function
  es: Función impar

statement:
  natural:
    es: >
      Una función f es impar si para todo x en su dominio se cumple
      f(-x) = -f(x). Geométricamente, la gráfica de una función impar es
      simétrica respecto al origen.
    en: >
      A function f is odd if f(-x) = -f(x) for every x in its domain.
      Geometrically, the graph of an odd function is symmetric about the
      origin.
  latex: |
    f(-x) = -f(x) \quad \forall x \in D

sources:
  - work: Cálculo de una variable — Trascendentes tempranas
    author: James Stewart
    edition: "7"
    chapter: "1"
    section: "1.1"

confidence: medium
notes: >
  Stewart introduces even and odd functions together in section 1.1
  alongside symmetry properties.
