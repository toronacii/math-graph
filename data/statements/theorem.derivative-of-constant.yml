statement:
  natural:
    es:
      text: >
        La derivada de cualquier función constante es cero. Es
        decir, si c es un número real, entonces (d/dx)(c) = 0.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The derivative of any constant function is zero. That is,
        if c is a real number, then (d/dx)(c) = 0.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
