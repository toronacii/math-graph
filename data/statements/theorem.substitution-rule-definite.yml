statement:
  natural:
    es:
      text: >
        Si g' es continua sobre [a, b] y f es continua sobre el rango de
        u = g(x), entonces
        ∫_a^b f(g(x))·g'(x) dx = ∫_{g(a)}^{g(b)} f(u) du.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If g' is continuous on [a, b] and f is continuous on the range of
        u = g(x), then
        ∫_a^b f(g(x))·g'(x) dx = ∫_{g(a)}^{g(b)} f(u) du.
      is_original: false
      origin: llm
      generated_by: "llm:claude-sonnet-4-6"
      review_status: unreviewed
  latex:
    body: |
      g' \in C([a,b]),\; f \in C(\operatorname{range}(g))
      \;\;\Rightarrow\;\;
      \int_a^b f(g(x))\,g'(x)\,dx = \int_{g(a)}^{g(b)} f(u)\,du
    status: present
    review_status: unreviewed

