depends_on:
  - id: theorem.substitution-rule
    role: uses_concept
    confidence: high
    notes: >
      The definite-integral version applies the indefinite substitution rule
      and transforms the limits of integration accordingly: x=a gives u=g(a)
      and x=b gives u=g(b). Role is uses_concept (not specializes) because
      this is a consequence/application, not a strict specialization — it
      adds limit transformation rather than restricting hypotheses.
  - id: theorem.ftc-part-2
    role: uses_concept
    confidence: high
    notes: >
      The proof uses TFC2 to evaluate both sides after applying the chain rule
      antiderivative relationship.
