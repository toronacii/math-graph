notes: >
  The key practical difference from the indefinite version (theorem.substitution-rule)
  is the transformation of the integration limits: instead of back-substituting
  u = g(x) at the end, the limits are changed from a,b to g(a),g(b) directly.
  This avoids re-expressing the antiderivative in terms of x.
