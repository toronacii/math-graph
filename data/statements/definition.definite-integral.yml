notes: >
  Stewart's definition is restricted to equal-width partitions, which suffices
  because he proves in the text that the limit is the same when using arbitrary
  partitions (via Theorem 3 on integrability of continuous functions and the
  note about max Δxᵢ → 0). Leibniz introduced the ∫ symbol (elongated S for
  "summa"). The notation ∫_a^b f(x) dx treats the expression as a limit where
  Σ → ∫, xᵢ* → x, and Δx → dx.
  Multi-source note: Rudin Ch6 defines the Riemann-Stieltjes integral
  ∫f dα, which strictly generalises Stewart's Riemann integral (α = identity).
  These are SEPARATE nodes; Rudin's version will occupy a different id when
  Rudin Ch6 is ported to v0.3.
