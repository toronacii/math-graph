statement:
  natural:
    es:
      text: >
        Si f es una función continua definida para a ≤ x ≤ b, se divide
        el intervalo [a, b] en n subintervalos de igual ancho
        Δx = (b − a)/n. Sean x₀(= a), x₁, x₂, …, xₙ(= b) los puntos
        extremos de estos subintervalos y sean x₁*, x₂*, …, xₙ* los
        puntos muestra en estos subintervalos, de modo que xᵢ* se
        encuentre en el i-ésimo subintervalo [xᵢ₋₁, xᵢ]. Entonces la
        integral definida de f, desde a hasta b, es
        ∫_a^b f(x) dx = lím_{n→∞} Σᵢ₌₁ⁿ f(xᵢ*)Δx
        siempre que este límite exista y dé el mismo valor para todos los
        posibles elecciones de los puntos muestra. Si existe, decimos que
        f es integrable sobre [a, b].
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If f is a continuous function defined for a ≤ x ≤ b, divide [a, b]
        into n subintervals of equal width Δx = (b − a)/n with endpoints
        x₀(= a), x₁, …, xₙ(= b), and choose sample points x₁*, …, xₙ*
        with xᵢ* in the i-th subinterval. Then the definite integral of
        f from a to b is
        ∫_a^b f(x) dx = lim_{n→∞} Σᵢ₌₁ⁿ f(xᵢ*)Δx,
        provided this limit exists and has the same value for all choices
        of sample points. If it exists, f is called integrable on [a, b].
      is_original: false
      origin: llm
      generated_by: "llm:claude-sonnet-4-6"
      review_status: unreviewed
  latex:
    body: |
      \int_a^b f(x)\,dx
        = \lim_{n \to \infty} \sum_{i=1}^{n} f(x_i^*)\,\Delta x,
      \quad \Delta x = \frac{b-a}{n}
    status: present
    review_status: unreviewed

