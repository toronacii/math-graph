notes: >
  Stewart §4.3 page 294. The phrase "the concavity of f changes
  sign at c" is informal — operationalized as: there exist intervals
  (c−δ, c) and (c, c+δ) on which f has opposite concavity. LaTeX
  status flagged informal because Stewart does not give a fully
  symbolic formulation. Stewart immediately notes (§4.3) that an
  inflection point need not coincide with a zero of f'' (e.g., where
  f'' does not exist), and exercise 82 (f(x) = x^4) shows f''(c) = 0
  does not imply (c, f(c)) is an inflection point.
