statement:
  natural:
    es:
      text: >
        Un punto P sobre una curva y = f(x) se llama punto de
        inflexión si f es allí continua y la curva cambia de cóncava
        hacia arriba a cóncava hacia abajo o de cóncava hacia abajo
        a cóncava hacia arriba en P.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        A point P on a curve y = f(x) is called an inflection point
        if f is continuous there and the curve changes from concave
        upward to concave downward, or from concave downward to
        concave upward, at P.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      P = (c, f(c)) \text{ inflection point} \iff
      f \text{ continuous at } c \;\wedge\;
      \text{concavity of } f \text{ changes sign at } c
    status: informal
    review_status: unreviewed

