statement:
  natural:
    es:
      text: >
        Cada fórmula de derivación, leída de derecha a izquierda, da
        lugar a una fórmula de antiderivación particular. En particular
        son antiderivadas particulares (sobre un intervalo apropiado):
        de cf(x), cF(x); de f(x) + g(x), F(x) + G(x); de x^n con n ≠
        −1, x^{n+1}/(n+1); de 1/x, ln|x|; de e^x, e^x; de cos x, sen x;
        de sen x, −cos x; de sec²x, tan x; de sec x · tan x, sec x; de
        1/√(1 − x²), arcsen x; de 1/(1 + x²), arctan x; de cosh x,
        senh x; de senh x, cosh x. La antiderivada más general se
        obtiene sumando una constante arbitraria.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        Every differentiation formula, read right to left, yields a
        particular antiderivative formula. In particular (on a suitable
        interval) the following are particular antiderivatives: of
        cf(x), cF(x); of f(x) + g(x), F(x) + G(x); of x^n with n ≠ −1,
        x^{n+1}/(n+1); of 1/x, ln|x|; of e^x, e^x; of cos x, sin x; of
        sin x, −cos x; of sec²x, tan x; of sec x · tan x, sec x; of
        1/√(1 − x²), arcsin x; of 1/(1 + x²), arctan x; of cosh x,
        sinh x; of sinh x, cosh x. The most general antiderivative is
        obtained by adding an arbitrary constant.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \begin{array}{ll}
      \text{Función} & \text{Antiderivada particular} \\
      cf(x) & cF(x) \\
      f(x) + g(x) & F(x) + G(x) \\
      x^n\;(n \neq -1) & \dfrac{x^{n+1}}{n+1} \\
      \dfrac{1}{x} & \ln|x| \\
      e^x & e^x \\
      \cos x & \sin x \\
      \sin x & -\cos x \\
      \sec^2 x & \tan x \\
      \sec x\,\tan x & \sec x \\
      \dfrac{1}{\sqrt{1-x^2}} & \arcsin x \\
      \dfrac{1}{1+x^2} & \arctan x \\
      \cosh x & \sinh x \\
      \sinh x & \cosh x
      \end{array}
    status: present
    review_status: unreviewed

