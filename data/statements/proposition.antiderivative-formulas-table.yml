notes: >
  Stewart §4.9 Tabla 2 page 345. EPISTEMIC DEBT — bundled node:
  this proposition collapses 13 inverse-derivative formulas into a
  single statement, mirroring the precedent set for the trig /
  inv-trig / hyperbolic derivative bundles in Ch3. Each row is
  individually verifiable by differentiating the right column and
  matching the left, citing the corresponding derivative theorem
  already in the graph. Two specific weaknesses to flag for future
  refinement: (i) the row "1/x → ln|x|" is valid only on intervals
  not containing 0 (Stewart explicitly notes the disconnected-domain
  caveat — see ln|x| discussion p. 344), and the bundle does not
  capture this restriction; (ii) the n ≠ −1 row uses the general
  real power rule, which Stewart only proves rigorously for positive
  integer n in §3.1 — full justification depends on the logarithmic
  differentiation argument in §3.6. Reasonable future refactor:
  split into one proposition per row, each with an explicit
  domain-of-validity field. semantic_confidence and
  dependency_confidence intentionally medium for this reason. No
  proof node is created; each row is a one-line verification.
