id: theorem.root-test
type: theorem
status: draft

title:
  en: The Root Test
  es: Prueba de la raíz

statement:
  natural:
    es: >
      (i) Si lim(n→∞) ⁿ√|aₙ| = L < 1, entonces la serie ∑ aₙ
      es absolutamente convergente.
      (ii) Si lim(n→∞) ⁿ√|aₙ| = L > 1 o lim ⁿ√|aₙ| = ∞,
      la serie diverge.
      (iii) Si L = 1, la prueba no es concluyente.
    en: >
      (i) If lim(n→∞) ⁿ√|aₙ| = L < 1, then the series ∑ aₙ
      is absolutely convergent.
      (ii) If lim(n→∞) ⁿ√|aₙ| = L > 1 or lim ⁿ√|aₙ| = ∞,
      the series diverges.
      (iii) If L = 1, the test is inconclusive.
  latex: |
    L = \lim_{n\to\infty}\sqrt[n]{|a_n|}
    \implies
    \begin{cases}
    L < 1 \Rightarrow \text{abs. convergent}\\
    L > 1 \Rightarrow \text{divergent}\\
    L = 1 \Rightarrow \text{inconclusive}
    \end{cases}

proved_by:
  - proof.root-test.stewart

sources:
  - work: Cálculo de una variable — Trascendentes tempranas
    author: James Stewart
    edition: "7"
    chapter: "11"
    section: "11.6"

confidence: high
