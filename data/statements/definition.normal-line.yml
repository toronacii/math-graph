statement:
  natural:
    es:
      text: >
        La recta normal a una curva C en un punto P es la recta
        que pasa por P y es perpendicular a la recta tangente a C
        en P.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The normal line to a curve C at a point P is the line
        through P perpendicular to the tangent line of C at P.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      m_{\text{normal}} \;=\; -\,\frac{1}{m_{\text{tan}}}
        \quad\text{(when }m_{\text{tan}} \neq 0\text{)}
