statement:
  natural:
    es:
      text: >
        Con x medido en radianes, las derivadas de las seis
        funciones trigonométricas están dadas por:
        (d/dx) sen x = cos x;
        (d/dx) cos x = − sen x;
        (d/dx) tan x = sec² x;
        (d/dx) csc x = − csc x · cot x;
        (d/dx) sec x = sec x · tan x;
        (d/dx) cot x = − csc² x.
        Los signos negativos van con las derivadas de las
        cofunciones (coseno, cosecante y cotangente).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        With x in radians, the derivatives of the six trig
        functions are: (d/dx) sin x = cos x; (d/dx) cos x = −sin x;
        (d/dx) tan x = sec² x; (d/dx) csc x = −csc x cot x;
        (d/dx) sec x = sec x tan x; (d/dx) cot x = −csc² x.
        The minus signs accompany derivatives of the cofunctions.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \begin{aligned}
        \frac{d}{dx}\sin x &= \cos x, &
        \frac{d}{dx}\cos x &= -\sin x, &
        \frac{d}{dx}\tan x &= \sec^{2} x,\\[4pt]
        \frac{d}{dx}\csc x &= -\csc x \cot x, &
        \frac{d}{dx}\sec x &= \sec x \tan x, &
        \frac{d}{dx}\cot x &= -\csc^{2} x.
      \end{aligned}
    status: present
    review_status: unreviewed

