notes: >
  Bundled per the trig-bundle policy. Stewart proves
  (d/dx) senh⁻¹ x in Example 4 by two methods (implicit
  differentiation, and differentiating the log form of Eq 3).
  The remaining five derivatives are Exercise 29. tanh⁻¹ and
  coth⁻¹ have algebraically identical derivatives but disjoint
  domains — Stewart highlights this explicitly. Hidden
  hypothesis: the inverse of a differentiable bijection is
  differentiable (asserted informally page 261), captured as
  dependency_confidence:medium.
