statement:
  natural:
    es:
      text: >
        Las derivadas de las seis funciones hiperbólicas inversas son:
        (d/dx) senh⁻¹ x = 1/√(1 + x²);
        (d/dx) cosh⁻¹ x = 1/√(x² − 1) (x > 1);
        (d/dx) tanh⁻¹ x = 1/(1 − x²) (|x| < 1);
        (d/dx) csch⁻¹ x = − 1/(|x| √(x² + 1)) (x ≠ 0);
        (d/dx) sech⁻¹ x = − 1/(x √(1 − x²)) (0 < x < 1);
        (d/dx) coth⁻¹ x = 1/(1 − x²) (|x| > 1).
        Las fórmulas para tanh⁻¹ y coth⁻¹ son idénticas como
        expresiones, pero sus dominios son disjuntos.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The derivatives of the six inverse hyperbolic functions
        are: (d/dx) sinh⁻¹ x = 1/√(1 + x²);
        (d/dx) cosh⁻¹ x = 1/√(x² − 1) (x > 1);
        (d/dx) tanh⁻¹ x = 1/(1 − x²) (|x| < 1);
        (d/dx) csch⁻¹ x = −1/(|x|√(x² + 1)) (x ≠ 0);
        (d/dx) sech⁻¹ x = −1/(x√(1 − x²)) (0 < x < 1);
        (d/dx) coth⁻¹ x = 1/(1 − x²) (|x| > 1).
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \begin{aligned}
        \frac{d}{dx}\sinh^{-1} x &= \frac{1}{\sqrt{1 + x^{2}}}, &
        \frac{d}{dx}\operatorname{csch}^{-1} x &= -\frac{1}{|x|\sqrt{x^{2} + 1}},\\[4pt]
        \frac{d}{dx}\cosh^{-1} x &= \frac{1}{\sqrt{x^{2} - 1}}, &
        \frac{d}{dx}\operatorname{sech}^{-1} x &= -\frac{1}{x\sqrt{1 - x^{2}}},\\[4pt]
        \frac{d}{dx}\tanh^{-1} x &= \frac{1}{1 - x^{2}}, &
        \frac{d}{dx}\coth^{-1} x &= \frac{1}{1 - x^{2}}.
      \end{aligned}
    status: present
    review_status: unreviewed

