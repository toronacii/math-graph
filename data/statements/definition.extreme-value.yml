statement:
  natural:
    es:
      text: >
        Un valor extremo de una función f es cualquiera de sus
        valores máximo o mínimo (locales o absolutos). El término
        agrupa los cuatro casos: máximo absoluto, mínimo absoluto,
        máximo local, mínimo local. (Stewart §4.1 página 274:
        "Los valores máximo y mínimo de f se llaman valores
        extremos de f".)
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        An extreme value of a function f is any of its maximum or
        minimum values (local or absolute). The term covers the
        four cases: absolute maximum, absolute minimum, local
        maximum, local minimum.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
