id: definition.epsilon-delta-limit
type: definition
status: draft

title:
  en: Precise definition of a limit (epsilon-delta)
  es: Definición precisa de un límite (épsilon-delta)

statement:
  natural:
    es: >
      Sea f una función definida en algún intervalo abierto que contiene
      al número a, excepto posiblemente en a misma. Se dice que el límite
      de f(x) cuando x tiende a a es L, y se escribe lim(x→a) f(x) = L,
      si para todo número ε > 0 existe un número δ > 0 tal que
      si 0 < |x - a| < δ entonces |f(x) - L| < ε.
    en: >
      Let f be a function defined on some open interval that contains
      the number a, except possibly at a itself. We say that the limit
      of f(x) as x approaches a is L, and write lim(x→a) f(x) = L,
      if for every number ε > 0 there exists a number δ > 0 such that
      if 0 < |x - a| < δ then |f(x) - L| < ε.
  latex: |
    \forall \varepsilon > 0, \; \exists \delta > 0 : 0 < |x - a| < \delta \implies |f(x) - L| < \varepsilon

sources:
  - work: Cálculo de una variable — Trascendentes tempranas
    author: James Stewart
    edition: "7"
    chapter: "2"
    section: "2.4"

confidence: high
notes: >
  This is the rigorous formalization of definition.limit-of-function.
  Stewart devotes section 2.4 entirely to this definition and its
  applications.
