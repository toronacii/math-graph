statement:
  natural:
    es:
      text: >
        Sea f una función definida sobre algún intervalo abierto que
        contiene al número a, excepto posiblemente en a misma.
        Entonces decimos que el límite de f(x) cuando x tiende a a
        es L, y lo expresamos como lím_{x→a} f(x) = L, si para cada
        número ε > 0 existe un número δ > 0 tal que si
        0 < |x − a| < δ entonces |f(x) − L| < ε.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        Let f be a function defined on some open interval that
        contains the number a, except possibly at a itself. Then we
        say that the limit of f(x) as x approaches a is L, and we
        write lim_{x→a} f(x) = L, if for every number ε > 0 there is
        a number δ > 0 such that if 0 < |x − a| < δ then
        |f(x) − L| < ε.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \lim_{x \to a} f(x) = L
      \iff
      \forall \varepsilon > 0,\ \exists \delta > 0:\
      0 < |x - a| < \delta \implies |f(x) - L| < \varepsilon
    status: present
    review_status: unreviewed

