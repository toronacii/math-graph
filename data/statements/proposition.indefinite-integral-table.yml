notes: >
  Type-A bundle: 17+ formulas in one node, mirroring the §4.9 bundle
  (proposition.antiderivative-formulas-table). Accepted as explicit debt.
  Domain-of-validity gaps carried forward from §4.9:
    - ∫(1/x)dx = ln|x|+C: disconnected-domain caveat (the general antiderivative
      on ℝ\{0} needs two constants C₁ on (−∞,0) and C₂ on (0,∞)).
    - ∫xⁿdx = xⁿ⁺¹/(n+1)+C: n real requires the generalised power rule
      (§3.6 logarithmic differentiation); the elementary form covers n integer.
  The latex body is marked `informal` because listing all 17 rows as LaTeX
  would be unwieldy; a summary of the key forms is given instead.
