statement:
  natural:
    es:
      text: >
        Las siguientes son fórmulas básicas para integrales indefinidas
        (cada una puede verificarse derivando el lado derecho):
        ∫ c·f(x) dx = c·∫ f(x) dx;
        ∫ [f(x)+g(x)] dx = ∫f dx + ∫g dx;
        ∫ k dx = kx + C;
        ∫ xⁿ dx = xⁿ⁺¹/(n+1) + C  (n ≠ −1);
        ∫ (1/x) dx = ln|x| + C;
        ∫ eˣ dx = eˣ + C;
        ∫ aˣ dx = aˣ/ln a + C;
        ∫ sin x dx = −cos x + C;
        ∫ cos x dx = sin x + C;
        ∫ sec²x dx = tan x + C;
        ∫ csc²x dx = −cot x + C;
        ∫ sec x tan x dx = sec x + C;
        ∫ csc x cot x dx = −csc x + C;
        ∫ 1/(x²+1) dx = tan⁻¹x + C;
        ∫ 1/√(1−x²) dx = sin⁻¹x + C;
        ∫ sinh x dx = cosh x + C;
        ∫ cosh x dx = sinh x + C.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The following are basic formulas for indefinite integrals (each
        can be verified by differentiating the right-hand side):
        ∫ c·f dx = c·∫ f dx; ∫[f+g] dx = ∫f dx + ∫g dx;
        ∫ k dx = kx + C; ∫ xⁿ dx = xⁿ⁺¹/(n+1) + C (n ≠ −1);
        ∫(1/x) dx = ln|x| + C; ∫ eˣ dx = eˣ + C; ∫ aˣ dx = aˣ/ln a + C;
        ∫ sin x dx = −cos x + C; ∫ cos x dx = sin x + C;
        ∫ sec²x dx = tan x + C; ∫ csc²x dx = −cot x + C;
        ∫ sec x tan x dx = sec x + C; ∫ csc x cot x dx = −csc x + C;
        ∫ 1/(x²+1) dx = tan⁻¹x + C; ∫ 1/√(1−x²) dx = sin⁻¹x + C;
        ∫ sinh x dx = cosh x + C; ∫ cosh x dx = sinh x + C.
      is_original: false
      origin: llm
      generated_by: "llm:claude-sonnet-4-6"
      review_status: unreviewed
  latex:
    body: |
      \int x^n\,dx = \frac{x^{n+1}}{n+1}+C\;(n\neq-1);\quad
      \int \frac{1}{x}\,dx = \ln|x|+C;\quad
      \int e^x\,dx = e^x+C;\quad
      \int \sin x\,dx = -\cos x+C;\quad
      \int \cos x\,dx = \sin x+C;\\
      \int \sec^2 x\,dx = \tan x+C;\quad
      \int \frac{1}{x^2+1}\,dx = \tan^{-1}x+C;\quad
      \int \frac{1}{\sqrt{1-x^2}}\,dx = \sin^{-1}x+C
    status: informal
    review_status: unreviewed

