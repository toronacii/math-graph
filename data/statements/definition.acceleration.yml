statement:
  natural:
    es:
      text: >
        Sea s = s(t) la función posición de un objeto que se
        desplaza a lo largo de una línea recta, con velocidad
        v(t) = s'(t). La aceleración a(t) del objeto se define
        como la razón de cambio de la velocidad respecto al
        tiempo, es decir, la derivada de la velocidad y por lo
        tanto la segunda derivada de la posición:
        a(t) = v'(t) = s''(t).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        Let s = s(t) be the position function of an object moving
        along a straight line, with velocity v(t) = s'(t). The
        acceleration a(t) of the object is defined as the rate of
        change of velocity with respect to time, i.e. the
        derivative of velocity and hence the second derivative of
        position: a(t) = v'(t) = s''(t).
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      a(t) \;=\; v'(t) \;=\; s''(t)
    status: present
    review_status: unreviewed

