notes: >
  Open-interval restriction matches Stewart's text. The notion of
  differentiability on a CLOSED interval (which would require
  one-sided derivatives at the endpoints) is NOT introduced in
  Ch2 and is deferred. The "open interval" notion itself is
  treated informally by Stewart and is not represented as a
  separate definition node in the corpus.
