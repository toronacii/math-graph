statement:
  natural:
    es:
      text: >
        Una función f es derivable sobre un intervalo abierto
        (a, b) [o (a, ∞) o (−∞, a) o (−∞, ∞)] si f es derivable
        en todo número del intervalo.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        A function f is differentiable on an open interval (a, b)
        [or (a, ∞) or (−∞, a) or (−∞, ∞)] if f is differentiable
        at every number in the interval.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f \text{ differentiable on } I
        \;\Longleftrightarrow\;
      \forall a \in I,\; f'(a) \text{ exists}
    status: present
    review_status: unreviewed

