notes: >
  Abbreviated TFC1. Discovered by Isaac Barrow (Newton's teacher, ~1670).
  States that integration and differentiation are inverse operations in one
  direction: differentiating an area-accumulation function recovers the
  integrand. The companion TFC2 (theorem.ftc-part-2) handles the other
  direction: evaluating a definite integral via antiderivatives.
  Multi-source note: Rudin Thm 6.20 (Principles of Mathematical Analysis, Ch6)
  proves this for Riemann-Stieltjes integrals; the statement coincides with
  Stewart's when α(x) = x. Future Rudin Ch6 extraction will create a separate
  node or add a second source here after disambiguation.
