statement:
  natural:
    es:
      text: >
        Si f es continua sobre [a, b], entonces la función g definida por
        g(x) = ∫_a^x f(t) dt,   a ≤ x ≤ b,
        es continua sobre [a, b] y derivable sobre (a, b), y g'(x) = f(x).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If f is continuous on [a, b], then the function g defined by
        g(x) = ∫_a^x f(t) dt,   a ≤ x ≤ b,
        is continuous on [a, b] and differentiable on (a, b), and g'(x) = f(x).
      is_original: false
      origin: llm
      generated_by: "llm:claude-sonnet-4-6"
      review_status: unreviewed
  latex:
    body: |
      g(x) = \int_a^x f(t)\,dt \;\;\Rightarrow\;\;
      g'(x) = \frac{d}{dx}\int_a^x f(t)\,dt = f(x),
      \quad f \in C([a,b]),\; a \le x \le b
    status: present
    review_status: unreviewed

