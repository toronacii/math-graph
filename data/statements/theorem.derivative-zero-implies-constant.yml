notes: >
  Stewart Theorem 5 §4.2 page 287. The interval hypothesis is
  essential: Stewart immediately follows the theorem with a NOTA
  cautioning that the result fails on disconnected domains
  (counterexample f(x) = x/|x| on R \ {0} has f' ≡ 0 but is not
  constant). This theorem is the foundation of antiderivative
  uniqueness (general antiderivative = F(x) + C, §4.9) and underlies
  the Fundamental Theorem of Calculus in Ch5.
