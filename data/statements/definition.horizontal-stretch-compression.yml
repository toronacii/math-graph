id: definition.horizontal-stretch-compression
type: definition
status: draft

title:
  en: Horizontal stretching and compression
  es: Estiramiento y compresión horizontal

statement:
  natural:
    es: >
      Si c > 1, la gráfica de y = f(cx) se obtiene comprimiendo la
      gráfica de y = f(x) horizontalmente por un factor de c. Si
      0 < c < 1, la gráfica se estira horizontalmente por un factor
      de 1/c.
    en: >
      If c > 1, the graph of y = f(cx) is obtained by compressing the
      graph of y = f(x) horizontally by a factor of c. If 0 < c < 1,
      the graph is stretched horizontally by a factor of 1/c.
  latex: |
    y = f(cx)

sources:
  - work: Cálculo de una variable — Trascendentes tempranas
    author: James Stewart
    edition: "7"
    chapter: "1"
    section: "1.3"

confidence: medium
notes: >
  Part of the catalog of transformations in section 1.3.
