notes: >
  Bundled per the trig-bundle policy. Stewart proves senh⁻¹ in
  Example 3 by solving a quadratic in eʸ; cosh⁻¹ (Eq 4) and
  tanh⁻¹ (Eq 5) are deferred to Exercises 26 and 27 with the
  same technique. Analogous log forms exist for csch⁻¹, sech⁻¹,
  coth⁻¹ (Ex 28); not modeled here. The natural-logarithm
  dependency reflects use of ln, but the proof uses only the
  inverse relation between exp and ln (no calculus of ln).
