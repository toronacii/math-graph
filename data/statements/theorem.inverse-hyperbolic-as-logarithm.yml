statement:
  natural:
    es:
      text: >
        Las funciones hiperbólicas inversas admiten formas
        logarítmicas explícitas:
        senh⁻¹ x = ln(x + √(x² + 1)) para todo x ∈ ℝ;
        cosh⁻¹ x = ln(x + √(x² − 1)) para x ≥ 1;
        tanh⁻¹ x = ½ ln((1 + x)/(1 − x)) para −1 < x < 1.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The inverse hyperbolic functions admit explicit logarithmic
        forms:
        sinh⁻¹ x = ln(x + √(x² + 1)) for all x ∈ ℝ;
        cosh⁻¹ x = ln(x + √(x² − 1)) for x ≥ 1;
        tanh⁻¹ x = ½ ln((1 + x)/(1 − x)) for −1 < x < 1.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \begin{aligned}
        \sinh^{-1} x &= \ln\!\bigl(x + \sqrt{x^{2} + 1}\bigr), & x &\in \mathbb{R},\\
        \cosh^{-1} x &= \ln\!\bigl(x + \sqrt{x^{2} - 1}\bigr), & x &\ge 1,\\
        \tanh^{-1} x &= \tfrac{1}{2}\ln\!\frac{1 + x}{1 - x}, & -1 &< x < 1.
      \end{aligned}
    status: present
    review_status: unreviewed

