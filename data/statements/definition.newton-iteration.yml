notes: >
  Stewart §4.8 page 339 (Equation 2). Stewart presents Newton's
  method as a constructive iteration derived from linear
  approximation; he does NOT state a formal convergence theorem in
  §4.8 (convergence is conditional and examples 31–34 illustrate
  failure modes — bad x₁, x_n leaving the domain, oscillation, very
  slow convergence). A precise convergence statement is deferred
  to Exercise 39 of §11.11 (Taylor remainder). For this reason
  this is modeled as a definition (a constructive scheme /
  operator), not a theorem; no proof node exists. Any future
  formalization of convergence would belong to a Ch11 or analysis
  node, not to §4.8. Multi-source disambiguation: Rudin's
  treatment (Theorem 5.18) gives a quadratic-convergence theorem
  on a neighborhood of a simple root with f'' continuous — would
  be a separate node in any future merge.
