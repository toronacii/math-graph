statement:
  natural:
    es:
      text: >
        Dada una función f derivable y una aproximación inicial x₁ a
        una raíz de la ecuación f(x) = 0, el método de Newton
        (Newton–Raphson) genera la sucesión de aproximaciones
        x_{n+1} = x_n − f(x_n) / f'(x_n), siempre que f'(x_n) ≠ 0.
        Geométricamente, x_{n+1} es la intersección con el eje x de
        la recta tangente a y = f(x) en el punto (x_n, f(x_n)). Si
        x_n converge a algún r, entonces r es la raíz aproximada
        buscada.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        Given a differentiable function f and an initial approximation
        x₁ to a root of the equation f(x) = 0, Newton's method
        (Newton–Raphson) produces the sequence of approximations
        x_{n+1} = x_n − f(x_n) / f'(x_n), provided f'(x_n) ≠ 0.
        Geometrically, x_{n+1} is the x-intercept of the tangent
        line to y = f(x) at the point (x_n, f(x_n)). If x_n converges
        to some r, then r is the approximate root.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      x_{n+1} \;=\; x_n - \frac{f(x_n)}{f'(x_n)},
      \qquad \text{provided } f'(x_n) \neq 0
    status: present
    review_status: unreviewed

