    review_status: unreviewed

statement:
  natural:
    es:
      text: >
        Si f es derivable en x = a, entonces f es continua en
        x = a. El recíproco es falso: hay funciones continuas que
        no son derivables (por ejemplo, f(x) = |x| en x = 0).
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If f is differentiable at x = a, then f is continuous at
        x = a. The converse is false: there are continuous
        functions that are not differentiable (for example,
        f(x) = |x| at x = 0).
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      f'(a) \text{ exists } \;\Longrightarrow\;
      \lim_{x \to a} f(x) = f(a)
    status: present
    review_status: unreviewed

