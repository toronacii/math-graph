notes: >
  The non-converse remark (|x| at 0) is recorded inside the
  natural-language statement but is established as fact through
  proposition.non-differentiability-cases (which uses the |x|
  example explicitly) and the continuity of |x| from §2.5. The
  theorem itself only asserts the forward implication.
