statement:
  natural:
    es:
      text: >
        Si f y g son derivables, entonces
        (d/dx)[f(x) + g(x)] = (d/dx) f(x) + (d/dx) g(x). La regla
        se extiende a cualquier número finito de sumandos por
        aplicación iterada.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If f and g are differentiable, then
        (d/dx)[f(x) + g(x)] = (d/dx) f(x) + (d/dx) g(x). The rule
        extends to any finite sum by iterated application.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \frac{d}{dx}\bigl[f(x) + g(x)\bigr] \;=\;
        \frac{d}{dx}f(x) + \frac{d}{dx}g(x)
    status: present
