statement:
  natural:
    es:
      text: >
        Si r > 0 es un número racional, entonces lím_{x→∞} 1/x^r = 0.
        Si r > 0 es un número racional tal que x^r está definida para
        toda x, entonces lím_{x→−∞} 1/x^r = 0.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If r > 0 is a rational number, then lim_{x→∞} 1/x^r = 0. If
        r > 0 is a rational number such that x^r is defined for all
        x, then lim_{x→−∞} 1/x^r = 0.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      r \in \mathbb{Q}_{>0} \implies \lim_{x \to \infty} \frac{1}{x^r} = 0; \\
      r \in \mathbb{Q}_{>0} \text{ with } x^r \text{ defined for all } x
      \implies \lim_{x \to -\infty} \frac{1}{x^r} = 0
    status: present
    review_status: unreviewed

