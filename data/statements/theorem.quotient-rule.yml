statement:
  natural:
    es:
      text: >
        Si f y g son derivables y g(x) ≠ 0, entonces el cociente
        f/g es derivable y
        (d/dx)[f(x)/g(x)] = (g(x) (d/dx) f(x) − f(x) (d/dx) g(x))
                          / g(x)^2.
        En palabras: la derivada de un cociente es el denominador
        por la derivada del numerador, menos el numerador por la
        derivada del denominador, todo dividido entre el cuadrado
        del denominador.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If f and g are differentiable and g(x) ≠ 0, then f/g is
        differentiable and (d/dx)[f(x)/g(x)] =
        (g(x) f'(x) − f(x) g'(x)) / g(x)^2.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \frac{d}{dx}\!\left[\frac{f(x)}{g(x)}\right] \;=\;
        \frac{g(x)\,\dfrac{d}{dx}f(x) \;-\; f(x)\,\dfrac{d}{dx}g(x)}
             {\bigl[g(x)\bigr]^{2}}
    status: present
    review_status: unreviewed

