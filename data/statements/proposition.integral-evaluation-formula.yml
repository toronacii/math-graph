statement:
  natural:
    es:
      text: >
        Si f es integrable sobre [a, b], entonces
        ∫_a^b f(x) dx = lím_{n→∞} Σᵢ₌₁ⁿ f(xᵢ)Δx
        donde Δx = (b − a)/n y xᵢ = a + i·Δx son los puntos extremos
        derechos de los subintervalos iguales.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        If f is integrable on [a, b], then
        ∫_a^b f(x) dx = lim_{n→∞} Σᵢ₌₁ⁿ f(xᵢ)Δx
        where Δx = (b − a)/n and xᵢ = a + i·Δx are the right endpoints
        of equal subintervals.
      is_original: false
      origin: llm
      generated_by: "llm:claude-sonnet-4-6"
      review_status: unreviewed
  latex:
    body: |
      \int_a^b f(x)\,dx
        = \lim_{n \to \infty} \sum_{i=1}^{n} f(x_i)\,\Delta x,
      \quad \Delta x = \frac{b-a}{n},\quad x_i = a + i\,\Delta x
    status: present
    review_status: unreviewed

