notes: >
  Stewart uses this proposition heavily in the worked examples of §5.2 to
  compute integrals from the definition (before the FTC is available).
  The theorem follows immediately from the definition: when f is integrable,
  all sample-point choices yield the same limit, so the convenient right-endpoint
  choice is valid.
