statement:
  natural:
    es:
      text: >
        Las funciones hiperbólicas satisfacen, para todo x, y ∈ ℝ:
        (paridad) senh(−x) = −senh x, cosh(−x) = cosh x;
        (identidad pitagórica) cosh²x − senh²x = 1;
        (forma derivada) 1 − tanh²x = sech²x;
        (suma) senh(x+y) = senh x cosh y + cosh x senh y;
        (suma) cosh(x+y) = cosh x cosh y + senh x senh y.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        The hyperbolic functions satisfy, for all x, y ∈ ℝ:
        (parity) sinh(−x) = −sinh x, cosh(−x) = cosh x;
        (Pythagorean) cosh²x − sinh²x = 1;
        (derived) 1 − tanh²x = sech²x;
        (addition) sinh(x+y) = sinh x cosh y + cosh x sinh y;
        (addition) cosh(x+y) = cosh x cosh y + sinh x sinh y.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \begin{aligned}
        \sinh(-x) &= -\sinh x, & \cosh(-x) &= \cosh x,\\
        \cosh^{2} x - \sinh^{2} x &= 1, & 1 - \tanh^{2} x &= \operatorname{sech}^{2} x,\\
        \sinh(x+y) &= \sinh x\cosh y + \cosh x\sinh y,\\
        \cosh(x+y) &= \cosh x\cosh y + \sinh x\sinh y.
      \end{aligned}
    status: present
    review_status: unreviewed

