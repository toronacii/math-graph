notes: >
  Bundled per the trig-bundle policy. Stewart proves cosh²−senh²=1
  in Example 1a and derives 1−tanh²=sech² in Example 1b; parity
  (Ex 7–8), addition formulas (Ex 11–12), and the analogous
  double-angle/quotient identities (Ex 13–19) are stated as
  identities and left to exercises. Bundling preserves Stewart's
  cuadro structure; splitting into atomic identities is optional
  refinement tracked in the chapter weak-dependencies report.
