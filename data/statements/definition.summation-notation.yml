id: definition.summation-notation
type: definition
status: draft

title:
  en: Summation Notation

statement:
  natural:
    en: >
      If x_1, ..., x_n are complex numbers, we write
      x_1 + x_2 + ... + x_n = Σ_{j=1}^{n} x_j.
  latex: |
    x_1 + x_2 + \cdots + x_n = \sum_{j=1}^{n} x_j

sources:
  - work: Principles of Mathematical Analysis
    author: Walter Rudin
    edition: "3"
    chapter: "1"
    section: "1.34"

confidence: high
notes: >
  Rudin 1.34. Standard notation convention.
