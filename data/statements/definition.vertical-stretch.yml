statement:
  natural:
    es:
      text: >
        Sea c > 0. La gráfica de y = c · f(x) se obtiene de la de
        y = f(x) alargándola verticalmente por un factor c si c > 1,
        o comprimiéndola verticalmente por el factor c si 0 < c < 1.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        Let c > 0. The graph of y = c · f(x) is obtained from the
        graph of y = f(x) by stretching vertically by a factor of c
        if c > 1, or compressing vertically by a factor of c if
        0 < c < 1.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      g(x) = c \cdot f(x), \qquad c > 0
    status: present
    review_status: unreviewed

