notes: >
  Stewart presents this as a pedagogical enumeration ("Tres
  maneras para que f no sea derivable") rather than an exhaustive
  classification. Marked semantic_kind: [criterion, pedagogical]
  to flag that the three cases are typical, NOT proven exhaustive
  — wild functions (e.g., the topologist's sine curve, nowhere-
  differentiable continuous functions) need not fall cleanly into
  these three buckets. semantic_confidence: medium reflects this
  non-exhaustiveness. No proof node: the three cases are each
  established either by a worked example (|x|) or by appealing to
  Theorem 4 / general limit machinery.
