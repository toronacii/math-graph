statement:
  natural:
    es:
      text: >
        Una función f puede dejar de ser derivable en un punto
        x = a por al menos una de las tres razones siguientes:
        (i) la gráfica tiene una esquina o pico en (a, f(a)) y
        los límites laterales del cociente de diferencias en a
        son distintos (por ejemplo, f(x) = |x| en a = 0);
        (ii) f es discontinua en a (por el contrarrecíproco del
        teorema «derivabilidad implica continuidad»; por ejemplo,
        una discontinuidad de salto); (iii) la curva tiene una
        recta tangente vertical en x = a, es decir,
        lím_{x→a} |f'(x)| = ∞.
      is_original: true
      origin: original
      review_status: unreviewed
    en:
      text: >
        A function f can fail to be differentiable at a point
        x = a for at least one of three reasons: (i) the graph
        has a corner or cusp at (a, f(a)) and the one-sided
        limits of the difference quotient at a disagree (for
        example, f(x) = |x| at a = 0); (ii) f is discontinuous
        at a (by the contrapositive of "differentiability implies
        continuity"; for example, a jump discontinuity); (iii)
        the curve has a vertical tangent line at x = a, i.e.
        lim_{x→a} |f'(x)| = ∞.
      is_original: false
      origin: llm
      generated_by: "llm:claude-opus-4.7"
      review_status: unreviewed
  latex:
    body: |
      \text{Non-differentiability at } a:
      \begin{cases}
        \text{(i) corner: }
          \lim_{h\to 0^{-}}\!\tfrac{f(a+h)-f(a)}{h}
          \neq
          \lim_{h\to 0^{+}}\!\tfrac{f(a+h)-f(a)}{h} \\
        \text{(ii) discontinuity: }
          \lim_{x\to a} f(x) \neq f(a)
          \text{ or undefined} \\
        \text{(iii) vertical tangent: }
          \lim_{x\to a}\bigl|f'(x)\bigr| = \infty
      \end{cases}
    status: present
    review_status: unreviewed

